    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează

    document.getElementById('fb-send').addEventListener('click', function(){
      var text = document.getElementById('fb-text').value.trim();
      var statusEl = document.getElementById('fb-status');
      if(!text) return;
      if(!hasFirebase){ statusEl.textContent = 'Feedback indisponibil — nu e configurat Firebase.'; return; }
      var sendBtn = document.getElementById('fb-send');
      sendBtn.disabled = true;
      feedbackUrl().then(function(url){
        return fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({text: text, ts: new Date().toISOString()})
        });
      }).then(function(res){
        if(!res.ok) throw new Error('feedback send failed');
        close();
        showToast('✓');
      }).catch(function(){
        statusEl.textContent = 'Nu s-a putut trimite. Încearcă din nou.';
        sendBtn.disabled = false;
      });
    });

    document.getElementById('fb-export').addEventListener('click', function(){
      if(!hasFirebase){ alert('Feedback indisponibil — nu e configurat Firebase.'); return; }
      feedbackUrl().then(function(url){ return fetch(url); }).then(function(res){ return res.json(); }).then(function(raw){
        var entries = [];
        if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
        entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? -1 : 1; });
        var lines = entries.length
          ? entries.map(function(e){ return '[' + (e.ts||'?') + ']\n' + (e.text||'') + '\n'; })
          : ['Niciun feedback trimis încă.'];
        var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'feedback-atelier-' + isoToday() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(){ alert('Nu s-a putut încărca feedback-ul.'); });
    });
  }

  /* ================= MODAL: proiect ================= */
  function openProjectModal(projectId){
    var editing = !!projectId;
    var proj = editing ? state.projects.find(function(p){ return p.id===projectId; }) : null;
    var nextNum = state.projects.length + 1;
    var suggestedCode = 'P-' + new Date().getFullYear() + '-' + (nextNum<10?'0'+nextNum:nextNum);

    var root = document.getElementById('modal-root');

    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>'+(editing?'Editează proiect':'Proiect nou')+'</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field-row"><div class="field"><label>Cod proiect</label><input id="f-cod" value="'+esc(editing?proj.cod:suggestedCode)+'"></div>';
    html += '<div class="field"><label>Termen limită</label><input type="date" id="f-termen" value="'+esc(editing?proj.termen:'')+'"></div></div>';
    html += '<div class="field"><label>Client</label><input id="f-client" value="'+esc(editing?proj.client:'')+'" placeholder="Nume client"></div>';

    var proiectStations = (editing ? stationsFor(proj) : state.stations).filter(function(s){ return s.type==='proiect'; });
    var showStageField = (!editing) || !proj.finalizat;
    if(showStageField && proiectStations.length){
      html += '<div class="field"><label>Etapă curentă</label><select id="f-stage">' + proiectStations.map(function(s){
        var sel = editing ? (proj.stationId===s.id) : (s.id===proiectStations[0].id);
        return '<option value="'+s.id+'" '+(sel?'selected':'')+'>'+esc(s.name)+'</option>';
      }).join('') + '</select><div class="field-hint">Poți defini piesele acum, chiar dacă proiectul e încă la ofertare — piesele pornesc spre producție doar cele pe care le trimiți tu, una câte una.</div></div>';
    }

    if(editing){
      html += '<div class="field"><label>Etape proiect</label>';
      html += '<div id="modal-stages" class="modal-stages"></div>';
      html += '<div style="display:flex; gap:6px; margin-top:6px;">';
      html += '<button type="button" class="btn btn-xs btn-ghost" id="btn-add-stage-proiect">+ etapă proiectare</button>';
      html += '<button type="button" class="btn btn-xs btn-ghost" id="btn-add-stage-piesa">+ etapă execuție</button>';
      html += '</div></div>';
    }

    html += '<div class="field"><label>Tip lucrare</label><input id="f-tip" value="'+esc(editing?(proj.tip||''):'')+'" placeholder="ex: Balustradă, Poartă, Tâmplărie ușă…"></div>';

    html += '<div class="field"><label>Notițe</label><textarea id="f-notite" placeholder="Detalii, cotă, observații…">'+esc(editing?(proj.notite||''):'')+'</textarea></div>';
    html += '<div class="field"><label>Necesar montaj</label><textarea id="f-montaj" placeholder="Ce se pregătește / se duce pentru ziua montajului (șuruburi, scule, dibluri…)">'+esc(editing?(proj.montajNotes||''):'')+'</textarea></div>';
    html += '<div class="field"><label>Listă piese</label><div class="pieces-editor" id="pieces-editor"></div>';
    html += '<button type="button" class="btn btn-sm btn-ghost" id="btn-add-piece" style="margin-top:8px;">+ Adaugă piesă</button>';
    html += '<div class="field-hint">Piesele pornesc în prima etapă a proiectului; le muți mai departe din pipeline-ul rândului desfășurat.</div>';
    html += '</div></div>';

    html += '<div class="modal-foot"><div class="left">';
    if(editing) html += '<button class="btn btn-danger-outline" id="btn-del-project">Șterge proiect</button>';
    html += '</div><div><button class="btn btn-ghost" id="btn-cancel">Anulează</button> <button class="btn btn-primary" id="btn-save">'+(editing?'Salvează':'Adaugă proiect')+'</button></div></div></div></div>';
    root.innerHTML = html;

    var piecesEditor = document.getElementById('pieces-editor');
    function addPieceRow(pieceId, name, stationId, colorCode){
      var row = document.createElement('div');
      row.className = 'piece-row';
      row.dataset.id = pieceId || uid();
      row.dataset.stationId = stationId || '';
      row.innerHTML = '<input class="piece-name" value="'+esc(name||'')+'" placeholder="Denumire piesă (ex: stâlp 40x40, 1.2m)"><input class="piece-color" value="'+esc(colorCode||'')+'" placeholder="Cod culoare"><button type="button" class="btn-remove-piece">×</button>';
      row.querySelector('.btn-remove-piece').addEventListener('click', function(){ row.remove(); });
      piecesEditor.appendChild(row);
      return row;
    }
    if(editing && proj.pieces && proj.pieces.length) proj.pieces.forEach(function(pc){ addPieceRow(pc.id, pc.name, pc.stationId, pc.colorCode); });
    document.getElementById('btn-add-piece').addEventListener('click', function(){ addPieceRow(null,'').querySelector('input').focus(); });

    if(editing && document.getElementById('modal-stages')){
      function renderModalStages(){
        var el = document.getElementById('modal-stages'); if(!el) return;
        el.innerHTML = stationsFor(proj).map(function(s){ return '<span class="modal-stage-chip ' + s.type + '">' + esc(s.name) + '</span>'; }).join('');
      }
      renderModalStages();
      document.getElementById('btn-add-stage-proiect').addEventListener('click', function(){ addProjectStage(proj.id, 'proiect'); renderModalStages(); });
      document.getElementById('btn-add-stage-piesa').addEventListener('click', function(){ addProjectStage(proj.id, 'piesa'); renderModalStages(); });
    }

    // render() la închidere: o etapă adăugată din modal se vede în pipeline chiar dacă ieși cu Anulează/✕
    function close(){ root.innerHTML=''; render(); }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează
    if(editing) document.getElementById('btn-del-project').addEventListener('click', function(){
      if(confirm('Ștergi proiectul '+proj.cod+'?')){ state.projects = state.projects.filter(function(p){ return p.id!==proj.id; }); saveState(); close(); render(); }
    });

    document.getElementById('btn-save').addEventListener('click', function(){
      var cod = document.getElementById('f-cod').value.trim();
      var client = document.getElementById('f-client').value.trim();
      var termen = document.getElementById('f-termen').value;
      if(!cod || !client || !termen){ alert('Completează cod, client și termen limită.'); return; }
      var tip = document.getElementById('f-tip').value.trim();
      var notite = document.getElementById('f-notite').value.trim();
      var montajNotes = document.getElementById('f-montaj').value.trim();

      var fallbackStationId = editing
        ? firstStationIdOf(proj)
        : ((state.stations && state.stations[0]) ? state.stations[0].id : null);
      var pieces = [];
      piecesEditor.querySelectorAll('.piece-row').forEach(function(row){
        var name = row.querySelector('.piece-name').value.trim();
        if(!name) return;
        var colorCode = row.querySelector('.piece-color').value.trim();
        pieces.push({id: row.dataset.id, name: name, stationId: row.dataset.stationId || fallbackStationId, colorCode: colorCode});
      });

      if(editing){
        proj.cod=cod; proj.client=client; proj.termen=termen; proj.tip=tip;
        proj.notite=notite; proj.montajNotes=montajNotes; proj.pieces=pieces;
        var stageSel = document.getElementById('f-stage');
        if(stageSel){ proj.stationId = stageSel.value; proj.lane = null; }
      } else {
        var stageSelNew = document.getElementById('f-stage');
        var newStations = JSON.parse(JSON.stringify(state.stations || []));
        var firstProiect = newStations.filter(function(s){ return s.type==='proiect'; })[0];
        state.projects.push({
          id: uid(), cod:cod, client:client, termen:termen, tip:tip,
          stations: newStations,
          stationId: stageSelNew ? stageSelNew.value : (firstProiect ? firstProiect.id : null),
          finalizat:false, notite:notite, pieces:pieces, orders:[], montajNotes:montajNotes, createdAt: isoToday()
        });
        logEvent('proiect-nou', cod + ' · ' + client);
      }
      saveState(); close(); render();
    });
  }

  /* ---------------- top-level wiring ---------------- */
  function setAddButton(){
    var btn = document.getElementById('btn-add');
    if(tab === 'reparatii'){ btn.textContent = '+ Reparație nouă'; btn.onclick = function(){ openRepairModal(null); }; }
    else { btn.textContent = '+ Proiect nou'; btn.onclick = function(){ openProjectModal(null); }; }
  }

  function updateSidebarForTab(){
    var main = document.getElementById('main');
    // the topbar is position:fixed — push the scrollable content clear of it (every tab, registru included)
    var tb = document.querySelector('.topbar');
    main.style.paddingTop = ((tb ? tb.offsetHeight : 60) + 12) + 'px';
  }
  // bara de sus e position:fixed și îi măsurăm înălțimea o dată — dacă fereastra se
  // redimensionează și butoanele se rup pe alt număr de rânduri, remăsurăm.
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ updateSidebarForTab(); }, 150);
  });

  document.getElementById('search').addEventListener('input', function(e){ searchQuery = e.target.value; render(); });
  document.getElementById('btn-feedback').addEventListener('click', function(){ openFeedbackModal(); });
  document.getElementById('btn-undo').addEventListener('click', doUndo);
  document.getElementById('btn-redo').addEventListener('click', doRedo);
  document.addEventListener('keydown', function(e){
    if(!(e.ctrlKey || e.metaKey)) return;
    var k = (e.key || '').toLowerCase();
    if(k !== 'z' && k !== 'y') return;
    var a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; // let the field's native text undo win
    e.preventDefault();
    if(k === 'y' || e.shiftKey) doRedo(); else doUndo();
  });
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      if(tab === b.dataset.tab) return;
      tab = b.dataset.tab;
      document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('active', x === b); });
      setAddButton();
      updateSidebarForTab();
      render();
    });
  });

  document.getElementById('btn-reset').addEventListener('click', function(){
    if(confirm('Ștergi tot panoul (proiecte, etape, reparații)? Nu se poate anula.')){
      if(confirm('Ești absolut sigur? Toate datele salvate se pierd definitiv.')){
        state = defaultState(); saveState(); render();
      }
    }
  });

  function startApp(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    loadState().then(function(s){
      state = s;
      if(!state.colorHistory) state.colorHistory = ['#f0b878','#a8c8dc','#a8d9b8','#f0dd9a','#d4b8dc','#a8dcc8','#f0b3bd','#b3d0e8'];
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      resetUndoHistory();
      setAddButton();
      updateSidebarForTab();
      render();
      attachLiveSync();
      if(!hasFirebase && !hasCloudStorage) showToast('Mod local — configurează Firebase (vezi comentariul din cod) sau deschide prin Claude.ai, ca șeful tău să vadă aceleași date.', true);
    });
  }

  // Live sync: apply changes other people save, as they happen. Held back only while
  // this user is mid-edit (a field focused or a modal open), then applied on the next tick.
  function userIsBusy(){
    var mr = document.getElementById('modal-root');
    if(mr && mr.children.length) return true;
    var a = document.activeElement;
    if(!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA' && a.tagName !== 'SELECT')) return false;
    // the top-bar search box is a filter, not data entry — it must not block live sync
    return !!(a.closest && a.closest('#board'));
  }
  function applyRemote(incoming){
    if(stableStringify(incoming) === stableStringify(state)) return;
    state = incoming;
    noteLocalWrite(stableStringify(state));
    resetUndoHistory(); // a colleague's change invalidates our local undo stack
    setAddButton();
    render();
    showToast('Tablou actualizat — modificări de la un coleg.');
  }
  // A remote change came in while the user was mid-edit — re-fetch the current DB state
  // (not a possibly-stale stashed copy) and apply it now that it's safe.
  function flushRemote(){
    if(!remoteDirty || !hasRtdb || userIsBusy()) return;
    remoteDirty = false;
    dbRef().once('value').then(function(snap){
      var raw = snap.val();
      if(!raw) return;
      try {
        var incoming = resolveVersioned(raw);
        if(recentLocalSigs.indexOf(stableStringify(incoming)) !== -1) return;
        console.log('[sync] aplic modificarea care aștepta');
        applyRemote(incoming);
      } catch(e){ /* ignore */ }
    }).catch(function(){});
  }
  function attachLiveSync(){
    console.log('[sync] hasAuth=' + hasAuth + ' hasRtdb=' + hasRtdb + ' firebase.database=' + (typeof (window.firebase && firebase.database)));
    if(liveSyncAttached) return;
    if(!hasRtdb){ console.warn('[sync] RTDB SDK indisponibil — rămân pe REST (fără actualizări live)'); return; }
    liveSyncAttached = true;
    try {
      firebase.database().ref('.info/connected').on('value', function(s){
        console.log('[sync] ' + (s.val() ? 'conectat la Firebase' : 'offline'));
      });
    } catch(e){ /* ignore */ }
    console.log('[sync] listener live pornit');
    dbRef().on('value', function(snap){
      var raw = snap.val();
      if(!raw) return;
      var incoming;
      try { incoming = resolveVersioned(raw); } catch(e){ console.warn('[sync] snapshot invalid', e); return; }
      var sig = stableStringify(incoming);
      if(recentLocalSigs.indexOf(sig) !== -1 || sig === stableStringify(state)){ return; } // our own echo / no change
      if(userIsBusy()){ console.log('[sync] schimbare primită — o aplic după ce termini editarea'); remoteDirty = true; return; }
      console.log('[sync] schimbare primită de la un coleg — aplic');
      applyRemote(incoming);
    }, function(err){
      console.warn('[sync] listener respins:', err && err.code, err && err.message);
    });
    setInterval(flushRemote, 1000);
    document.addEventListener('focusout', function(){ setTimeout(flushRemote, 60); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(flushRemote, 60); });
  }

  if(hasAuth){
    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type="submit"]');
      var errEl = document.getElementById('login-error');
      var pass = document.getElementById('login-password').value;
      btn.disabled = true;
      errEl.textContent = '';
      firebase.auth().signInWithEmailAndPassword(SHARED_LOGIN_EMAIL, pass).catch(function(){
        errEl.textContent = 'Parolă greșită. Încearcă din nou.';
        btn.disabled = false;
      });
    });
    firebase.auth().onAuthStateChanged(function(user){
      if(user){
        startApp();
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
