<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panou de Producție — Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="login-screen">
  <form id="login-form" class="login-box">
    <div class="login-title">ATELIER MOLDOVEANU</div>
    <div class="login-sub">Introdu parola echipei pentru a continua</div>
    <input type="password" id="login-password" class="search-input login-input" placeholder="Parolă" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary login-btn">Intră</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<div id="loading" style="display:none;"><div class="spinner"></div> Se încarcă panoul de producție…</div>

<div class="app" id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">ATELIER MOLDOVEANU <span>—</span> ORGANIZARE</div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="hala" class="active">Hartă atelier</button>
      <button data-tab="comenzi">Comenzi</button>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" id="btn-add">+ Proiect nou</button>
      <input type="text" id="search" class="search-input" placeholder="Caută cod sau client…">
      <button class="btn btn-ghost btn-icon" id="btn-undo" title="Anulează (Ctrl+Z)" disabled>↶</button>
      <button class="btn btn-ghost btn-icon" id="btn-redo" title="Refă (Ctrl+Shift+Z)" disabled>↷</button>
      <button class="btn btn-ghost btn-icon" id="btn-feedback" title="Lasă un feedback">💬</button>
    </div>
  </header>

  <main id="main">
    <div class="board" id="board"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'workshop-board';
  var DATA_VERSION = 8;

  var state = null;
  var tab = 'hala';
  var searchQuery = '';
  var recentLocalSigs = [];     // stableStringify of states we recently pushed — to ignore our own echoes
  var remoteDirty = false;      // a remote change arrived while the user was mid-edit — re-fetch & apply once idle
  var liveSyncAttached = false;
  function noteLocalWrite(sig){ recentLocalSigs.push(sig); if(recentLocalSigs.length > 10) recentLocalSigs.shift(); }
  var draggingData = null;
  var registryOpen = {}; // "<projectId>" -> true while that registru row is expanded (transient; not persisted)
  var regOrdersOpen = {}; // "<projectId>" -> true while that row's materials box is open (transient; not persisted)
  var regMoreOpen = {}; // "<projectId>" -> true while that row's ⋯ details/edit box is open (transient; not persisted)
  var regFilter = 'active'; // 'active' | 'done' | 'reps' | 'all' — registru filter (transient; not persisted)
  var regSort = 'termen';   // 'termen' | 'urgenta' | 'cod' | 'faza' — sort in fiecare găleată (transient; not persisted)
  var PIECE_MONTAJ = '__montaj__'; // pc.stationId sentinel: piece is done on the floor, sent to montaj
  var ORDER_STATUSES = ['de-comandat', 'comandat', 'primit'];
  var ORDER_STATUS_LABEL = { 'de-comandat': 'De comandat', 'comandat': 'Comandat', 'primit': 'Primit' };

  /* ---------------- utils ---------------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  // key-order-independent JSON, used only to compare local state vs. a remote snapshot.
  // Firebase RTDB prunes null/undefined, empty arrays, empty objects and empty strings on
  // save (recursively), so the echo of our own write comes back without those keys. We drop
  // the same things here — otherwise every save looks like a change from a colleague, which
  // used to wipe the undo history right after each action.
  function stableStringify(v){
    if(v === null || v === undefined) return 'null';
    if(typeof v !== 'object') return JSON.stringify(v);
    if(Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    var parts = [];
    Object.keys(v).sort().forEach(function(k){
      var s = stableStringify(v[k]);
      if(s === 'null' || s === '[]' || s === '{}' || s === '""') return; // pruned by Firebase
      parts.push(JSON.stringify(k) + ':' + s);
    });
    return '{' + parts.join(',') + '}';
  }
  function todayDate(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function isoToday(){ var d = todayDate(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function isoOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function addDays(d, n){ return new Date(d.getTime() + n*86400000); }
  function parseDate(iso){ if(!iso) return null; var p = iso.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  // „12 sep" — data scurtă a termenului, pentru rândul din registru
  function fmtShortDate(iso){ var d = parseDate(iso); if(!d) return ''; return d.getDate() + ' ' + ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'][d.getMonth()]; }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  var MONTHS = ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Noi','Dec'];
  function fmtDateTime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return String(iso);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  var LOG_LABEL = { 'proiect-nou':'proiect nou', 'finalizat':'finalizat', 'redeschis':'redeschis', 'avansat':'avansat', 'piesa-montaj':'piesă la montaj', 'furnizor-retur':'primit de la furnizor' };

  function defaultState(){
    var stations = [
        {id:'s1', name:'Ofertare', type:'proiect'},
        {id:'s2', name:'Măsurători', type:'proiect'},
        {id:'s3', name:'Proiectare', type:'proiect'},
        {id:'s4', name:'Debitare / Laser', type:'piesa'},
        {id:'s5', name:'Sudură', type:'piesa'},
        {id:'s6', name:'Finisaj', type:'piesa', lanes:[{id:'l1',name:'Atelier'},{id:'l2',name:'Extern'},{id:'l3',name:'Finalizat'}]},
        {id:'s7', name:'Montaj', type:'proiect'}
    ];
    return {
      version: DATA_VERSION,
      stations: stations,
      projects: [],
      repairs: [],
      workers: [],
      assignments: [],
      checklists: [],
      orders: []   // comenzile trimise la furnizori (CMD-…)
    };
  }

  /* ---------------- storage (shared — visible to everyone with this link) ---------------- */
  // Ca sa functioneze in afara Claude.ai, cu date comune reale, completeaza URL-ul bazei tale Firebase mai jos.
  // Exemplu: 'https://atelier-productie-default-rtdb.europe-west1.firebasedatabase.app'
  // Lasa gol ('') daca vrei sa continui doar cu Claude.ai / stocare locala.
  var FIREBASE_DB_URL = 'https://atelier-m-cccb6-default-rtdb.europe-west1.firebasedatabase.app/';
  var FIREBASE_PROJECT_ID = 'atelier-m-cccb6';
  // Web API key — nu e secret, e sigur de expus în cod client (protecția reală vine din Security Rules).
  // Ia-l din Firebase Console > Project Settings > General > Your apps > Web app > SDK setup.
  var FIREBASE_API_KEY = 'AIzaSyBbGwofxm0xSuEPU8nE-haDoH5t6JF3OTI';
  var SHARED_LOGIN_EMAIL = 'echipa@atelier-moldoveanu.local';
  var hasFirebase = !!FIREBASE_DB_URL;
  var hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  var hasAuth = hasFirebase && FIREBASE_API_KEY.indexOf('REPLACE_WITH') !== 0 && typeof firebase !== 'undefined';

  if(hasAuth){
    firebase.initializeApp({
      apiKey: FIREBASE_API_KEY,
      authDomain: FIREBASE_PROJECT_ID + '.firebaseapp.com',
      databaseURL: FIREBASE_DB_URL,
      projectId: FIREBASE_PROJECT_ID
    });
  }
  // Realtime Database SDK path: keeps every open board in sync live (a listener),
  // instead of the read-once REST fetch. REST stays as the fallback.
  var hasRtdb = hasAuth && typeof firebase.database === 'function';
  function dbRef(){ return firebase.database().ref(STORAGE_KEY); }

  function currentIdToken(){
    if(!hasAuth || !firebase.auth().currentUser) return Promise.resolve('');
    return firebase.auth().currentUser.getIdToken();
  }
  function withAuth(base){
    return currentIdToken().then(function(token){
      return token ? base + '?auth=' + encodeURIComponent(token) : base;
    });
  }
  function firebaseUrl(){ return withAuth(FIREBASE_DB_URL.replace(/\/$/, '') + '/' + STORAGE_KEY + '.json'); }
  // feedback lives in its own Firebase node, separate from the board data — never overwritten,
  // each submission is POSTed (Firebase generates a unique push key per entry)
  function feedbackUrl(){ return withAuth(FIREBASE_DB_URL.replace(/\/$/, '') + '/' + STORAGE_KEY + '-feedback.json'); }
  // activity log — same idea: its own node, append-only via POST, never part of `state`
  function logUrl(){ return withAuth(FIREBASE_DB_URL.replace(/\/$/, '') + '/' + STORAGE_KEY + '-log.json'); }
  function logEvent(type, text){
    if(!hasFirebase) return;
    logUrl().then(function(url){
      return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ts: new Date().toISOString(), type: type, text: text }) });
    }).catch(function(){ /* best-effort */ });
  }

  function loadState(){
    if(hasRtdb){
      return dbRef().once('value').then(function(snap){
        var raw = snap.val();
        return raw ? resolveVersioned(raw) : defaultState();
      }).catch(function(){ return loadFromLocal(); });
    }
    if(hasFirebase){
      return firebaseUrl().then(function(url){ return fetch(url); }).then(function(res){
        if(!res.ok) throw new Error('firebase read failed');
        return res.json();
      }).then(function(raw){
        if(raw) return resolveVersioned(raw);
        return defaultState();
      }).catch(function(){ return loadFromLocal(); });
    }
    if(hasCloudStorage){
      return window.storage.get(STORAGE_KEY, true).then(function(res){
        if(res && res.value) return parseOrDefault(res.value);
        return defaultState();
      }).catch(function(){ return loadFromLocal(); });
    }
    return Promise.resolve(loadFromLocal());
  }
  function loadFromLocal(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return parseOrDefault(raw);
    } catch(e){ /* localStorage unavailable (e.g. private mode) — start fresh */ }
    return defaultState();
  }
  function migrateV3toV4(parsed){
    (parsed.projects||[]).forEach(function(p){
      if(typeof p.inExecutie === 'undefined') p.inExecutie = !!(p.pieces && p.pieces.length > 0 && !p.finalizat);
    });
    parsed.version = 4;
    return parsed;
  }
  function migrateV4toV5(parsed){
    // construia assignments din task-urile lucrătorilor — feature scoasă; normalizeState curăță oricum
    parsed.version = 5;
    return parsed;
  }
  function migrateV5toV6(parsed){
    (parsed.workers||[]).forEach(function(w){
      if(!w.zoneIds) w.zoneIds = w.zoneId ? [w.zoneId] : [];
    });
    parsed.version = 6;
    return parsed;
  }
  function migrateV6toV7(parsed){
    (parsed.stations||[]).forEach(function(s){
      if(s.hasLanes && !s.lanes){
        s.lanes = [{id:'l1',name:'Atelier'},{id:'l2',name:'Extern'},{id:'l3',name:'Finalizat'}];
      }
      delete s.hasLanes;
    });
    (parsed.projects||[]).forEach(function(p){
      if(!p.inExecutie){
        // wasn't sent under the old model — keep pieces looking exactly as before (not on the floor)
        (p.pieces||[]).forEach(function(pc){ pc.stationId = null; });
      }
      delete p.inExecutie;
    });
    parsed.version = 7;
    return parsed;
  }
  function migrateV7toV8(parsed){
    parsed.version = 8;
    return parsed;
  }
  function normalizeState(parsed){
    // Firebase RTDB prunes empty arrays on save, so they can come back as undefined on load.
    if(!Array.isArray(parsed.stations)) parsed.stations = [];
    if(!Array.isArray(parsed.projects)) parsed.projects = [];
    if(!Array.isArray(parsed.repairs)) parsed.repairs = [];
    // reparațiile se leagă de proiect prin projectId; codul rămâne doar etichetă de rezervă
    parsed.repairs.forEach(function(r){
      if(r.projectId || !r.cod) return;
      var target = (parsed.projects || []).find(function(p){ return (p.cod || '').trim().toLowerCase() === (r.cod || '').trim().toLowerCase(); });
      if(target) r.projectId = target.id;
    });
    if(!Array.isArray(parsed.workers)) parsed.workers = [];
    // funcția de echipă/oameni a fost scoasă — păstrăm doar furnizorii, aruncăm restul
    parsed.workers = (parsed.workers || []).filter(function(w){ return w.kind === 'furnizor'; });
    // fiecare furnizor are o zi fixă de livrare (0=duminică … 6=sâmbătă) sau o notă liberă
    parsed.workers.forEach(function(w){
      if(!('deliveryDay' in w)) w.deliveryDay = null;
      if(!('deliveryNote' in w)) w.deliveryNote = null;
    });
    // comenzile trimise (CMD-…) — evidența e la nivel de stare, liniile arată spre ele prin cmdId
    if(!Array.isArray(parsed.orders)) parsed.orders = [];
    parsed.assignments = []; // legăturile persoană↔proiect nu mai există; ținem cheia ca să nu crape cod vechi
    delete parsed.colorHistory; // paleta de culori pentru oameni — feature scoasă
    if(!Array.isArray(parsed.checklists)) parsed.checklists = [];
    parsed.projects.forEach(function(p){
      if(!Array.isArray(p.orders)) p.orders = [];
      // câmpurile noi ale unei linii de necesar — completate o singură dată, cu valori fixe
      p.orders.forEach(function(o){
        if(typeof o.um === 'undefined') o.um = 'buc';
        if(typeof o.altSupplierId === 'undefined') o.altSupplierId = '';
        if(typeof o.cmdId === 'undefined') o.cmdId = null;
        if(typeof o.orderedAt === 'undefined') o.orderedAt = null;
        if(typeof o.receivedAt === 'undefined') o.receivedAt = null;
      });
      delete p.gataEstimat; delete p.faze; delete p.phaseKind; delete p.phaseSince; // graficul Gantt a fost scos
      if(typeof p.montajNotes !== 'string'){
        // the short-lived structured "necesar montaj" list is now just a free-text note
        p.montajNotes = (Array.isArray(p.montajNeeds) && p.montajNeeds.length)
          ? p.montajNeeds.map(function(n){ return '- ' + (n.text || '') + (n.qty ? ' (' + n.qty + ')' : ''); }).join('\n')
          : '';
      }
      delete p.montajNeeds;
      delete p.montajPinned; // panoul „necesar montaj" a devenit câmp în modal — nu mai are pin
      delete p.urgencyFloor; // sistemul de urgență (slider manual) a fost scos
      // each project now carries its own flow stages — seed from the shared list on first load
      if(!Array.isArray(p.stations) || !p.stations.length){
        p.stations = JSON.parse(JSON.stringify(parsed.stations || []));
      }
      // o piesă fără etapă — sau cu o etapă care nu mai există în fluxul proiectului — ar rămâne
      // invizibilă în pipeline; o aducem înapoi la prima etapă. (PIECE_MONTAJ e sentinel, nu etapă.)
      var stIds = {};
      (p.stations || []).forEach(function(s){ stIds[s.id] = true; });
      (p.pieces||[]).forEach(function(pc){
        if(pc.stationId !== PIECE_MONTAJ && !stIds[pc.stationId]){
          pc.stationId = (p.stations && p.stations[0]) ? p.stations[0].id : null;
          pc.lane = null;
        }
      });
    });
    // Linii vechi marcate „comandat" dinainte să existe evidența CMD: le legăm de o comandă
    // sintetică per furnizor, cu id determinist (fără Date.now / new Date — migrarea trebuie
    // să dea exact același rezultat de fiecare dată). Liniile fără furnizor rămân fără comandă:
    // se văd ca „comandat", dar nu apar în recepție.
    var cmdSeen = {};
    parsed.orders.forEach(function(o){ cmdSeen[o.id] = true; });
    parsed.projects.forEach(function(p){
      (p.orders || []).forEach(function(o){
        if(o.status !== 'comandat' || o.cmdId || !o.supplierId) return;
        var lid = 'legacy-' + (o.supplierId || 'none');
        if(!cmdSeen[lid]){
          parsed.orders.push({ id: lid, nr: 'CMD-veche', supplierId: o.supplierId, date: '' });
          cmdSeen[lid] = true;
        }
        o.cmdId = lid;
      });
    });
    // o comandă fără nicio linie care s-o arate e o fantomă în istoric — o aruncăm
    var cmdUsed = {};
    parsed.projects.forEach(function(p){ (p.orders || []).forEach(function(o){ if(o.cmdId) cmdUsed[o.cmdId] = true; }); });
    parsed.orders = parsed.orders.filter(function(o){ return cmdUsed[o.id]; });

    parsed.checklists.forEach(function(c){ if(!Array.isArray(c.items)) c.items = []; });
    delete parsed.registrySort; // comutatorul de sortare a fost scos — mereu după termen
    (parsed.projects||[]).forEach(function(p){ delete p.x; delete p.y; });
    (parsed.checklists||[]).forEach(function(c){ delete c.x; delete c.y; }); // datele listelor rămân
    return parsed;
  }
  function resolveVersioned(parsed){
    if(!parsed) return defaultState();
    if(parsed.version === DATA_VERSION) return normalizeState(parsed);
    if(parsed.version === 7) return normalizeState(migrateV7toV8(parsed));
    if(parsed.version === 6) return normalizeState(migrateV7toV8(migrateV6toV7(parsed)));
    if(parsed.version === 5) return normalizeState(migrateV7toV8(migrateV6toV7(migrateV5toV6(parsed))));
    if(parsed.version === 4) return normalizeState(migrateV7toV8(migrateV6toV7(migrateV5toV6(migrateV4toV5(parsed)))));
    if(parsed.version === 3) return normalizeState(migrateV7toV8(migrateV6toV7(migrateV5toV6(migrateV4toV5(migrateV3toV4(parsed))))));
    return defaultState();
  }
  function parseOrDefault(raw){
    try {
      return resolveVersioned(JSON.parse(raw));
    } catch(e){ /* corrupted data — start fresh */ }
    return defaultState();
  }
  var undoStack = [], redoStack = [], prevStateJson = null, suppressUndoPush = false;
  var UNDO_MAX = 40;
  function noteUndoPoint(){
    if(suppressUndoPush || prevStateJson == null) return;
    undoStack.push(prevStateJson);
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    redoStack.length = 0;
  }
  function resetUndoHistory(){ undoStack.length = 0; redoStack.length = 0; prevStateJson = state ? JSON.stringify(state) : null; updateUndoButtons(); }
  function updateUndoButtons(){
    var u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo');
    if(u) u.disabled = !undoStack.length;
    if(r) r.disabled = !redoStack.length;
  }
  function applySnapshot(json, msg){
    suppressUndoPush = true;
    try { state = resolveVersioned(JSON.parse(json)); } catch(e){ suppressUndoPush = false; return; }
    prevStateJson = JSON.stringify(state);
    saveState();
    suppressUndoPush = false;
    setAddButton(); render();
    showToast(msg);
  }
  function doUndo(){
    if(!undoStack.length) return;
    redoStack.push(JSON.stringify(state));
    applySnapshot(undoStack.pop(), 'Anulat');
  }
  function doRedo(){
    if(!redoStack.length) return;
    undoStack.push(JSON.stringify(state));
    applySnapshot(redoStack.pop(), 'Refăcut');
  }

  function saveState(){
    noteUndoPoint();
    updateUndoButtons(); // editările inline salvează fără re-render — ține butonul ↶ sincron cu stiva
    prevStateJson = JSON.stringify(state);
    if(hasRtdb){
      // our own write will echo back through the live listener — remember it so we don't re-render on it
      noteLocalWrite(stableStringify(state));
      return dbRef().set(state).then(function(){
        console.log('[sync] salvat în Firebase');
        // if a remote change was waiting, our write raced it — re-pull the current truth
        flushRemote();
      }).catch(function(err){
        console.warn('[sync] scriere RESPINSĂ:', err && err.code, err && err.message);
        saveToLocal(true);
      });
    }
    if(hasFirebase){
      return firebaseUrl().then(function(url){
        return fetch(url, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(state)
        });
      }).then(function(res){
        if(!res.ok) saveToLocal(true);
      }).catch(function(){ saveToLocal(true); });
    }
    if(hasCloudStorage){
      return window.storage.set(STORAGE_KEY, JSON.stringify(state), true).then(function(res){
        if(!res) saveToLocal(true);
      }).catch(function(){ saveToLocal(true); });
    }
    saveToLocal(false);
    return Promise.resolve();
  }
  function saveToLocal(isFallback){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(isFallback) showToast('Salvat local pe acest dispozitiv.');
    } catch(e){
      showToast('Nu s-a putut salva. Modificarea rămâne doar pe acest ecran.', true);
    }
  }

  var toastTimer = null;
  function showToast(msg, isErr){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isErr ? 'show err' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ''; }, 3200);
  }

  /* ---------------- station helpers ---------------- */
  function stationById(id){ return state.stations.find(function(s){ return s.id === id; }); }
  function projectById(id){ return state.projects.find(function(p){ return p.id === id; }); }
  /* per-project flow stages: each project carries its own p.stations (copied from state.stations
     at migration / on project creation). state.stations stays as the template for new projects. */
  function stationsFor(p){ return (p && Array.isArray(p.stations)) ? p.stations : state.stations; }
  function stationByIdFor(p, id){ return stationsFor(p).find(function(s){ return s.id === id; }); }
  function piesaStationsFor(p){ return stationsFor(p).filter(function(s){ return s.type === 'piesa'; }); }
  function bucketFor(p, stationId){
    if(stationId === PIECE_MONTAJ) return 'montaj';
    // o piesă pusă liber pe Montaj (sau orice etapă post-execuție) = montaj, nu pregătire
    if(isPostExecStationFor(p, stationId)) return 'montaj';
    var st = stationByIdFor(p, stationId);
    return (st && st.type === 'piesa') ? 'exec' : 'pregatire';
  }
  function pieceFlowFor(p){
    var a = stationsFor(p);
    var fp = firstPiesaIndexFor(p);
    var pre = fp === -1 ? [] : a.slice(0, fp).filter(function(s){ return s.type === 'proiect'; });
    return pre.concat(piesaStationsFor(p));
  }
  function firstStationIdOf(proj){
    var a = stationsFor(proj);
    return a[0] ? a[0].id : null;
  }
  function lastPiesaIndexFor(p){ var a = stationsFor(p); for(var i=a.length-1;i>=0;i--){ if(a[i].type==='piesa') return i; } return -1; }
  function firstPiesaIndexFor(p){ return stationsFor(p).findIndex(function(s){ return s.type === 'piesa'; }); }
  function nextProiectStationFor(p, stationId){
    var a = stationsFor(p);
    var next = a[a.findIndex(function(s){ return s.id === stationId; }) + 1];
    return (next && next.type === 'proiect') ? next : null;
  }
  function lastProiectBeforeFirstPiesaFor(p){
    var a = stationsFor(p), fp = firstPiesaIndexFor(p);
    if(fp === -1) return null;
    for(var i=fp-1;i>=0;i--){ if(a[i].type === 'proiect') return a[i]; }
    return null;
  }
  function isPostExecStationFor(p, stationId){
    var a = stationsFor(p), lp = lastPiesaIndexFor(p);
    if(lp === -1) return false;
    var idx = a.findIndex(function(s){ return s.id === stationId; });
    return idx > lp && a[idx] && a[idx].type === 'proiect';
  }
  function forkProjectStations(p){
    if(!Array.isArray(p.stations)) p.stations = JSON.parse(JSON.stringify(state.stations || []));
    return p.stations;
  }
  // Adaugă o etapă nouă în fluxul unui proiect (proiectare la nivel de proiect / execuție per piesă).
  function addProjectStage(projId, type){
    var p = projectById(projId);
    if(!p) return;
    var name = prompt('Denumire etapă nouă (' + (type === 'piesa' ? 'execuție, urmărită piesă cu piesă' : 'proiectare / anteproiect, la nivel de proiect') + '):');
    if(!name || !name.trim()) return;
    var arr = forkProjectStations(p);
    var st = { id: uid(), name: name.trim(), type: type };
    if(type === 'piesa'){ var lp = lastPiesaIndexFor(p); if(lp === -1) arr.push(st); else arr.splice(lp + 1, 0, st); }
    else { arr.push(st); }
    saveState();
  }
  function defaultLaneId(lanes){
    return (lanes && lanes[0]) ? lanes[0].id : null;
  }
  // Partitions ("lanes") within a station are per-project, not global — each project
  // starts with a copy of the station's default lanes, then can add/rename/remove its own
  // without affecting other projects' rows.
  function projectLanesFor(p, station){
    if(!p.laneDefs) p.laneDefs = {};
    if(!p.laneDefs[station.id]){
      p.laneDefs[station.id] = (station.lanes||[]).map(function(l){ return {id:l.id, name:l.name}; });
    }
    return p.laneDefs[station.id];
  }

  /* ---------------- derived helpers ---------------- */
  function urgencyLabel(project){
    if(!project.termen) return 'Fără termen';
    var d = daysBetween(todayDate(), parseDate(project.termen));
    if(d < 0) return 'Întârziat ' + Math.abs(d) + 'z';
    if(d === 0) return 'Termen azi';
    if(d === 1) return 'Termen mâine';
    return 'În ' + d + ' zile';
  }
  function matchesSearch(codOrClient1, codOrClient2){
    if(!searchQuery) return true;
    var q = searchQuery.toLowerCase();
    return (codOrClient1||'').toLowerCase().indexOf(q) > -1 || (codOrClient2||'').toLowerCase().indexOf(q) > -1;
  }
  /* faza in care e proiectul acum (culoarea pastilei + halo).
     Cartonasul de proiect sta mereu ori la o etapa de proiectare, ori la Montaj — deci
     "executie" (portocaliu) o deducem din piese: daca vreo piesa e intr-o etapa de piesa. */
  function currentStageInfo(p){
    if(!p || !p.stationId) return null;
    var a = stationsFor(p);
    var idx = a.findIndex(function(s){ return s.id === p.stationId; });
    if(idx === -1) return null;
    var cur = a[idx];
    var lp = lastPiesaIndexFor(p);
    if(cur.type === 'piesa') return { cls:'phase-piesa', name: cur.name };      // (defensiv) cartonasul chiar pe o etapa de piesa
    if(lp !== -1 && idx > lp) return { cls:'phase-montaj', name: cur.name };    // etapa de proiect dupa piese = Montaj -> rosu
    var piesaIds = {};
    a.forEach(function(s){ if(s.type === 'piesa') piesaIds[s.id] = true; });
    if((p.pieces || []).some(function(pc){ return piesaIds[pc.stationId]; }))
      return { cls:'phase-piesa', name:'Execuție' };                            // piese pe podea, desi cartonasul e la proiectare -> portocaliu
    return { cls:'phase-proiect', name: cur.name };                            // proiectare / anteproiect -> albastru
  }
  /* things that are "missing" on a project — surfaced as a loud warning on the folder */
  function projectWarnings(p){
    if(!p || p.finalizat) return [];
    var w = [];
    var orders = p.orders || [];
    if(orders.length){
      var missing = orders.filter(function(o){ return o.status !== 'primit'; }).length;
      if(missing) w.push('📋 ' + missing + (missing === 1 ? ' comandă neprimită' : ' comenzi neprimite'));
    }
    var nPre = 0, nOther = 0;
    (p.pieces || []).forEach(function(pc){ if(bucketFor(p, pc.stationId) === 'pregatire') nPre++; else nOther++; });
    if(nPre > 0 && nOther > 0) w.push('🔧 ' + nPre + (nPre === 1 ? ' piesă neîncepută' : ' piese neîncepute'));
    return w;
  }

  /* ---- reparații: legate de proiect prin projectId; cod-ul rămâne etichetă de rezervă ---- */
  function normCod(s){ return (s || '').trim().toLowerCase(); }
  function repairsFor(p){
    return (state.repairs || []).filter(function(r){
      return r.projectId ? r.projectId === p.id : normCod(r.cod) === normCod(p.cod);
    });
  }
  function openRepairsFor(p){ return repairsFor(p).filter(function(r){ return r.status !== 'rezolvata'; }); }

  /* ---- registru: găleată pe termen, semnal, severitate ---- */
  function regBucket(p){
    if(p.finalizat) return 'done';
    if(!p.termen) return 'none';
    var td = parseDate(p.termen); if(!td) return 'none';
    var n = daysBetween(todayDate(), td); // <0 = a trecut
    if(n < 0) return 'late';
    if(n <= 6) return 'w1';
    if(n <= 13) return 'w2';
    return 'later';
  }
  // faza proiectului ca cheie scurtă (tag + culoare margine)
  function regPhaseKey(p){
    if(p.finalizat) return 'done';
    var stg = currentStageInfo(p);
    if(!stg) return 'ante';
    return stg.cls === 'phase-piesa' ? 'exec' : (stg.cls === 'phase-montaj' ? 'montaj' : 'ante');
  }
  function regPhaseTag(k){ return k === 'ante' ? 'PRG' : (k === 'exec' ? 'EXE' : (k === 'montaj' ? 'MTJ' : 'LIV')); }

  // un singur semnal per rând: ce blochează → cât întârzie → unde e acum
  function regSignal(p){
    if(p.finalizat) return { t: 'livrat', k: 'done' };
    var td = p.termen ? parseDate(p.termen) : null;
    var late = !!(td && td.getTime() < todayDate().getTime());
    if(late) return { t: 'întârziat ' + Math.abs(daysBetween(todayDate(), td)) + 'z', k: 'late' };
    var w = projectWarnings(p);
    if(w.length) return { t: w[0].replace(/^[^\sA-Za-zĂÂÎȘȚ]+\s*/, ''), k: 'blk' };
    var stg = currentStageInfo(p);
    return { t: stg ? 'la ' + stg.name.toLowerCase() : '—', k: 'stage' };
  }
  function regSeverity(p){
    if(p.finalizat) return -100;
    var td = p.termen ? parseDate(p.termen) : null;
    var n = td ? daysBetween(todayDate(), td) : 30;
    var s = n < 0 ? -n * 4 : Math.max(0, 20 - n);
    s += projectWarnings(p).length * 9;
    s += openRepairsFor(p).length * 7;
    return s;
  }

  /* ---------------- render dispatcher ---------------- */
  function render(){
    var board = document.getElementById('board');
    board.className = 'board';
    board.style.display = 'flex';
    board.style.flexDirection = '';
    board.style.alignItems = '';
    board.style.height = '100%';
    board.style.minHeight = '';
    if(tab === 'hala') renderHala();
    else if(tab === 'comenzi') renderComenzi();
    updateUndoButtons();
  }

  /* ================= HARTĂ ATELIER ================= */

  /* ---------------- project orders (materiale de comandat) ---------------- */
  function furnizori(){ return state.workers.filter(function(w){ return w.kind === 'furnizor'; }); }
  function supplierById(id){ return furnizori().find(function(w){ return w.id === id; }) || null; }
  function supplierName(id){ var s = supplierById(id); return s ? (s.name || '—') : '— fără furnizor —'; }
  // placeholder = textul opțiunii goale; null îl scoate cu totul (util pentru filtre)
  function supplierOptionsHtml(selectedId, placeholder){
    var lbl = (typeof placeholder === 'undefined') ? '— furnizor —' : placeholder;
    var opts = (lbl === null) ? '' : '<option value=""' + (selectedId ? '' : ' selected') + '>' + esc(lbl) + '</option>';
    furnizori().forEach(function(w){
      opts += '<option value="' + w.id + '"' + (w.id === selectedId ? ' selected' : '') + '>' + esc(w.name) + '</option>';
    });
    return opts;
  }
  function findOrderByKey(key){
    var parts = String(key).split('::');
    var p = projectById(parts[0]);
    if(!p || !Array.isArray(p.orders)) return null;
    var o = p.orders.find(function(x){ return x.id === parts[1]; });
    return o ? { project: p, order: o } : null;
  }

  /* ---------------- comenzi: lista plată + evidența CMD ----------------
     Datele NU se mută: fiecare linie de necesar stă mai departe în p.orders[].
     allNeeds() doar aplatizează pentru randare; `_o` e referința vie prin care se scrie
     înapoi, `_p` e proiectul care o deține. */
  var UM_LIST = ['buc','m','kg','saci','role','tuburi','coli','L','set'];
  var ORDER_STATUS_CLS = { 'de-comandat':'need', 'comandat':'sent', 'primit':'recv' };
  var ZI_NAME = ['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];

  function allNeeds(){
    var out = [];
    state.projects.forEach(function(p){
      (p.orders || []).forEach(function(o){
        var row = {};
        Object.keys(o).forEach(function(k){ row[k] = o[k]; });
        row.text = o.text || '';
        row.qty = o.qty == null ? '' : o.qty;
        row.um = o.um || 'buc';
        row.supplierId = o.supplierId || '';
        row.altSupplierId = o.altSupplierId || '';
        row.status = o.status || 'de-comandat';
        row.cmdId = o.cmdId || null;
        row.key = p.id + '::' + o.id;
        row.projectId = p.id;
        row.projectCod = p.cod || '—';
        row._p = p;
        row._o = o;
        return out.push(row);
      });
    });
    return out;
  }
  function cmdById(id){ return (state.orders || []).find(function(o){ return o.id === id; }) || null; }
  function cmdLines(cmdId, needs){ return (needs || allNeeds()).filter(function(n){ return n.cmdId === cmdId; }); }

  // CMD-DDMM-NN — NN e 1 + câte comenzi există deja în ziua aia
  function mkCmdNr(dateIso){
    var d = parseDate(dateIso) || todayDate();
    var stamp = pad2(d.getDate()) + pad2(d.getMonth() + 1);
    var k = (state.orders || []).filter(function(o){ return String(o.nr || '').indexOf('CMD-' + stamp) === 0; }).length + 1;
    return 'CMD-' + stamp + '-' + pad2(k);
  }
  // prima zi de livrare de la azi înainte, pentru furnizorii cu zi fixă
  function nextDeliveryDate(supId){
    var s = supplierById(supId);
    if(!s || s.deliveryDay === null || typeof s.deliveryDay === 'undefined') return null;
    var d = todayDate(), guard = 0;
    while(d.getDay() !== s.deliveryDay && guard++ < 10) d = addDays(d, 1);
    return isoOf(d);
  }
  function deliveryLabel(supId){
    var s = supplierById(supId);
    if(!s) return 'atribuie un furnizor';
    var iso = nextDeliveryDate(supId);
    if(!iso) return (s.deliveryNote || '').trim() || 'livrare la comandă';
    var d = parseDate(iso);
    var k = daysBetween(todayDate(), d);
    return 'vine ' + ZI_NAME[d.getDay()] + ' ' + fmtShortDate(iso) + (k === 0 ? ' (azi)' : (k === 1 ? ' (mâine)' : ''));
  }
  function orderState(o, needs){
    var ls = cmdLines(o.id, needs);
    if(!ls.length) return { received:0, total:0, label:'goală', cls:'sent' };
    var r = ls.filter(function(n){ return n.status === 'primit'; }).length;
    return { received:r, total:ls.length,
      label: r === 0 ? 'trimisă' : (r < ls.length ? 'parțial' : 'completă'),
      cls: r === ls.length ? 'recv' : 'sent' };
  }
  // o comandă la care nu mai arată nicio linie e o fantomă în istoric — o scoatem
  function pruneOrders(){
    if(!Array.isArray(state.orders)){ state.orders = []; return; }
    var used = {};
    state.projects.forEach(function(p){ (p.orders || []).forEach(function(o){ if(o.cmdId) used[o.cmdId] = true; }); });
    state.orders = state.orders.filter(function(o){ return used[o.id]; });
  }
  // bate o comandă nouă și ștampilează liniile date (obiecte brute din p.orders[])
  function mintCmd(supplierId, rawLines){
    var lines = rawLines.filter(function(o){ return o && o.status === 'de-comandat'; });
    if(!lines.length) return null;
    if(!Array.isArray(state.orders)) state.orders = [];
    var today = isoToday();
    var cmd = { id: uid(), nr: mkCmdNr(today), supplierId: supplierId || '', date: today };
    state.orders.push(cmd);
    lines.forEach(function(o){
      if(!o.supplierId) o.supplierId = supplierId || '';
      o.status = 'comandat'; o.cmdId = cmd.id; o.orderedAt = today; o.receivedAt = null;
    });
    return cmd;
  }
  // singurul loc unde se schimbă starea unei linii — și din Comenzi, și din registru
  function setOrderStatus(o, st){
    if(st === 'de-comandat'){ o.status = 'de-comandat'; o.cmdId = null; o.orderedAt = null; o.receivedAt = null; }
    else if(st === 'comandat'){
      if(!o.cmdId) mintCmd(o.supplierId || '', [o]);
      else { o.status = 'comandat'; o.receivedAt = null; }
    } else {
      o.status = 'primit'; o.receivedAt = isoToday();
      if(!o.orderedAt) o.orderedAt = isoToday();
    }
    pruneOrders();
  }
  function cycleOrderStatus(o){
    var i = ORDER_STATUSES.indexOf(o.status);
    setOrderStatus(o, ORDER_STATUSES[(i + 1) % ORDER_STATUSES.length]);
  }
  function umOptionsHtml(cur){
    return UM_LIST.map(function(u){ return '<option value="' + u + '"' + (u === cur ? ' selected' : '') + '>' + u + '</option>'; }).join('');
  }
  function projectOptionsHtml(cur){
    return state.projects.map(function(p){
      return '<option value="' + p.id + '"' + (p.id === cur ? ' selected' : '') + '>' + esc(p.cod || '—') + '</option>';
    }).join('');
  }
  function newOrderLine(){
    return { id: uid(), text: '', qty: '', um: 'buc', supplierId: '', altSupplierId: '',
             status: 'de-comandat', cmdId: null, orderedAt: null, receivedAt: null };
  }
  // Just the order rows + "adaugă comandă" button — used by the registru row header.
  function renderOrdersRows(p){
    var orders = Array.isArray(p.orders) ? p.orders : [];
    var b = '<div class="side-list">';
    if(!orders.length){
      b += '<div class="col-empty" style="padding:6px 2px; text-align:left;">Nicio comandă încă.</div>';
    } else {
      orders.forEach(function(o){
        var key = p.id + '::' + o.id;
        b += '<div class="order-row">';
        b += '<button type="button" class="order-status order-status-' + o.status + '" data-order-status="' + key + '" title="Schimbă starea">' + ORDER_STATUS_LABEL[o.status] + '</button>';
        b += '<input class="order-text" data-order-edit="' + key + '" data-field="text" value="' + esc(o.text || '') + '" placeholder="Ce se comandă">';
        b += '<input class="order-qty" data-order-edit="' + key + '" data-field="qty" value="' + esc(o.qty || '') + '" placeholder="Cant.">';
        b += '<select class="order-qty" data-order-edit="' + key + '" data-field="um" title="Unitate de măsură">' + umOptionsHtml(o.um || 'buc') + '</select>';
        b += '<select class="order-supplier" data-order-edit="' + key + '" data-field="supplierId">' + supplierOptionsHtml(o.supplierId || '') + '</select>';
        b += '<button type="button" class="order-del" data-order-del="' + key + '" title="Șterge rândul">×</button>';
        b += '</div>';
      });
    }
    b += '</div>';
    b += '<button type="button" class="btn btn-xs btn-ghost order-add" data-order-add="' + p.id + '">+ Adaugă comandă</button>';
    return b;
  }
  function renderHala(){
    var board = document.getElementById('board');
    board.style.display = 'flex';
    board.style.flexDirection = 'column';
    board.style.alignItems = 'stretch';
    // registrul e o listă verticală care crește oricât — nu o cutie de înălțimea ecranului,
    // altfel rândurile de jos ies din board fără ca #main să poată derula
    board.style.height = 'auto';
    board.style.minHeight = '100%';

    if(state.projects.length === 0){
      board.innerHTML = '<div class="empty-state" style="margin-top:60px;"><h2>Atelier gol</h2><p>Adaugă primul proiect ca să începi.</p>' +
        '<div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;"><button class="btn btn-primary" id="empty-add">+ Proiect nou</button></div></div>';
      document.getElementById('empty-add').onclick = function(){ openProjectModal(null); };
      attachHalaEvents();
      return;
    }

    var html = '';

    // închis peste tot → coloană îngustă centrată; ceva deschis → lățime plină pentru pipeline
    var anyOpen = state.projects.some(function(p){ return registryOpen[p.id]; });
    html += '<div class="reg' + (anyOpen ? ' reg-wide' : '') + '">' + renderRegistru() + '</div>';

    board.innerHTML = html;
    attachHalaEvents();
  }
  // Registru desfășurător — înlocuiește harta canvas: o listă verticală de rânduri pliabile.
  var REG_BUCKETS = [['late','Întârziat'],['w1','Săptămâna asta'],['w2','Săptămâna viitoare'],['later','Mai târziu'],['none','Fără termen'],['done','Livrate']];
  var REG_PHASE_ORDER = { 'phase-proiect': 0, 'phase-piesa': 1, 'phase-montaj': 2 };
  function regTermKey(p){ return p.termen || '9999-99-99'; }
  function regCmp(a, b){
    var ca = String(a.cod == null ? '' : a.cod), cb = String(b.cod == null ? '' : b.cod);
    if(regSort === 'urgenta') return regSeverity(b) - regSeverity(a) || ca.localeCompare(cb);
    if(regSort === 'cod') return ca.localeCompare(cb);
    if(regSort === 'faza'){
      var ca = (currentStageInfo(a) || {}).cls, cb = (currentStageInfo(b) || {}).cls;
      return (REG_PHASE_ORDER[ca] || 0) - (REG_PHASE_ORDER[cb] || 0) || (regTermKey(a) < regTermKey(b) ? -1 : 1);
    }
    return regTermKey(a) < regTermKey(b) ? -1 : (regTermKey(a) > regTermKey(b) ? 1 : 0);
  }

  function renderRegistru(){
    var all = state.projects.filter(function(p){ return matchesSearch(p.cod, p.client); });
    var list = all.filter(function(p){
      if(regFilter === 'active') return !p.finalizat;
      if(regFilter === 'done') return p.finalizat;
      if(regFilter === 'reps') return openRepairsFor(p).length > 0;
      return true;
    });

    var out = '<div class="reg-toolbar">';
    out += '<span class="reg-filters">' + [['active','Active'],['done','Finalizate'],['reps','Cu reparații'],['all','Toate']].map(function(o){
      return '<button type="button" data-reg-filter="' + o[0] + '" class="' + (regFilter === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
    }).join('') + '</span>';
    out += '<span class="reg-sort"><label>sortare</label><select data-reg-sort>' + [['termen','Termen'],['urgenta','Urgență'],['cod','Cod'],['faza','Fază']].map(function(o){
      return '<option value="' + o[0] + '"' + (regSort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select></span>';
    out += '</div>';

    if(!list.length) return out + '<div class="empty-state" style="margin:26px 4px;"><p>Niciun proiect pentru filtrul curent.</p></div>';

    var byBucket = {};
    list.forEach(function(p){ var b = regBucket(p); (byBucket[b] = byBucket[b] || []).push(p); });
    REG_BUCKETS.forEach(function(bk){
      var g = byBucket[bk[0]];
      if(!g || !g.length) return;
      g.sort(regCmp);
      out += '<div class="reg-group">';
      out += '<div class="reg-ghead' + (bk[0] === 'late' ? ' late' : '') + '">' + bk[1] + ' <span class="n">' + g.length + '</span></div>';
      g.forEach(function(p){
        out += renderRegRow(p);
        if(registryOpen[p.id]) out += '<div class="reg-detail" id="reg-detail-' + p.id + '">' + renderRegHead(p) + renderRegPipe(p) + renderRegReps(p) + '</div>';
      });
      out += '</div>';
    });
    return out;
  }

  // rând strâns: margine + tag de fază · cod întreg · client · semnal · termen
  function renderRegRow(p){
    var sig = regSignal(p);
    var nr = openRepairsFor(p).length;
    var td = p.termen ? parseDate(p.termen) : null;
    var late = !!(td && td.getTime() < todayDate().getTime() && !p.finalizat);
    var pk = regPhaseKey(p);
    var att = (sig.k === 'late' || sig.k === 'blk' || sig.k === 'mat' || nr > 0);
    var h = '<button type="button" class="reg-row ph-' + pk + '" data-toggle-reg="' + p.id + '" aria-controls="reg-detail-' + p.id + '" aria-expanded="' + (!!registryOpen[p.id]) + '">';
    h += '<i class="rr-edge"></i>';
    h += '<span class="rr-tag">' + regPhaseTag(pk) + '</span>';
    h += '<span class="rr-cod">' + esc(p.cod) + (nr ? ' <span class="rr-rep">🔧' + nr + '</span>' : '') + '</span>';
    var cli = (p.client || '').trim();
    h += '<span class="rr-cli">' + (cli && cli !== '-' && cli !== '—' ? esc(cli) : '') + '</span>';
    h += '<span class="rr-sigwrap">' + (att ? '<i class="rr-dot"></i>' : '') + '<span class="rr-sig k-' + sig.k + '">' + esc(sig.t) + '</span></span>';
    h += '<span class="rr-term' + (late ? ' late' : '') + '">' + (p.finalizat ? (p.finalizatAt ? esc(fmtShortDate(p.finalizatAt.slice(0,10))) : '') : (td ? esc(fmtShortDate(p.termen)) : '')) + '</span>';
    h += '</button>';
    return h;
  }

  // firul de reparații din rândul desfășurat
  function renderRegReps(p){
    var reps = repairsFor(p);
    var h = '<div class="reg-reps">';
    h += '<div class="reg-reps-h">🔧 Reparații <span>(' + reps.length + ')</span></div>';
    if(!reps.length) h += '<div class="reg-reps-none">Nicio reparație.</div>';
    reps.forEach(function(r){
      var cls = r.status === 'deschisa' ? 'deschisa' : (r.status === 'in-lucru' ? 'lucru' : 'rezolvata');
      var lbl = r.status === 'deschisa' ? 'deschisă' : (r.status === 'in-lucru' ? 'în lucru' : 'rezolvată');
      h += '<div class="rep-line' + (r.status === 'rezolvata' ? ' res' : '') + '">';
      h += '<button type="button" class="rep-sb ' + cls + '" data-rep-cyc="' + r.id + '">' + lbl + '</button>';
      h += '<span class="rep-d">' + esc(r.descriere || '') + '</span>';
      h += '<button type="button" class="rep-del" data-rep-del="' + r.id + '" title="Șterge reparația">×</button>';
      h += '</div>';
    });
    h += '<div class="rep-add"><input type="text" class="rep-add-inp" data-rep-new="' + p.id + '" placeholder="problemă nouă la ' + esc(p.cod) + '…"><button type="button" class="btn btn-xs" data-rep-add="' + p.id + '">+ Reparație</button></div>';
    h += '</div>';
    return h;
  }

  // Antetul de proiect din rândul desfăcut al registrului: bandă de stare (A),
  // bandă de atenție (C, doar dacă e cazul), secundar ascuns sub ⋯.
  function renderRegHead(p){
    var stg = currentStageInfo(p);
    var warns = projectWarnings(p);
    var nP = 0, nE = 0, nM = 0;
    (p.pieces||[]).forEach(function(pc){ var b = bucketFor(p, pc.stationId); if(b === 'exec') nE++; else if(b === 'montaj') nM++; else nP++; });
    var totPieces = nP + nE + nM;
    var td = p.termen ? parseDate(p.termen) : null;
    var late = !!(td && td.getTime() < todayDate().getTime() && !p.finalizat);
    var orders = Array.isArray(p.orders) ? p.orders : [];
    var recv = orders.filter(function(o){ return o.status === 'primit'; }).length;
    var complete = orders.length && recv >= orders.length;
    var next = nextProiectStationFor(p, p.stationId);
    var finalizabil = isPostExecStationFor(p, p.stationId) || (!next && piesaStationsFor(p).length === 0);

    var h = '<div class="reg-detail-head">';
    h += '<div class="reg-strip">';

    // termen
    var termTxt;
    if(p.finalizat){
      termTxt = 'livrat' + (p.finalizatAt ? ' ' + fmtShortDate(p.finalizatAt.slice(0,10)) : '');
    } else if(td){
      termTxt = fmtShortDate(p.termen);
      if(late) termTxt += ' · întârziat ' + Math.abs(daysBetween(todayDate(), td)) + 'z';
    } else {
      termTxt = 'Fără termen';
    }
    h += '<span class="rs-k rs-term' + (late ? ' late' : '') + '">' + esc(termTxt) + '</span>';
    h += '<span class="rs-sep"></span>';

    // progres — doar numărul (bara e redundantă cu pipeline-ul de mai jos)
    h += '<span class="rs-k">' + (totPieces
      ? ('<b>' + totPieces + (totPieces === 1 ? ' piesă' : ' piese') + '</b> <span class="rs-dim">' + nP + ' pregătire · ' + nE + ' execuție · ' + nM + ' montaj</span>')
      : '<span class="rs-dim">fără piese</span>') + '</span>';
    h += '<span class="rs-sep"></span>';

    // etapa curentă
    h += '<span class="rs-k rs-dim">etapă: <b style="color:var(--ink)">' + esc(stg ? stg.name : '—') + '</b></span>';
    h += '<span class="rs-sep"></span>';

    // materiale: ACELAȘI buton toggle ca înainte
    var matLabel = orders.length ? (recv + '/' + orders.length + (complete ? '' : ' · incomplet')) : 'Materiale';
    h += '<button type="button" class="rs-k reg-orders-toggle" data-toggle-orders="' + p.id + '">📋 ' + esc(matLabel) + '</button>';
    h += '<span class="rs-grow"></span>';

    // acțiunea principală — avansul e doar prin drag; aici rămâne finalizarea / redeschiderea
    if(p.finalizat){
      h += '<button class="btn btn-sm" data-reopen-project="' + p.id + '">↩ Redeschide</button>';
    } else if(finalizabil){
      h += '<button class="btn btn-sm btn-primary" data-close-project="' + p.id + '">Finalizează ✓</button>';
    }
    h += '<button type="button" class="rs-more" data-reg-more="' + p.id + '" title="Detalii / editare">⋯</button>';
    h += '</div>'; // .reg-strip

    // rândurile de comandă, ascunse până la toggle (neschimbat)
    h += '<div class="reg-orders" id="reg-orders-' + p.id + '"' + (regOrdersOpen[p.id] ? '' : ' hidden') + '>' + renderOrdersRows(p) + '</div>';

    // C: banda de atenție, DOAR dacă projectWarnings(p).length
    if(warns.length){
      h += '<div class="reg-attn">⚠ ' + warns.map(function(x){ return esc(x); }).join(' <span style="opacity:.5">·</span> ') + '</div>';
    }

    // secundar, ascuns până la ⋯
    h += '<div class="reg-more-body" id="reg-more-' + p.id + '"' + (regMoreOpen[p.id] ? '' : ' hidden') + '>';
    if((p.notite || '').trim()) h += '<div class="card-notes">' + esc(p.notite) + '</div>';
    if((p.montajNotes || '').trim()) h += '<div class="card-orders-line">📦 Necesar montaj notat</div>';
    h += '<div class="card-actions">';
    h += '<button class="btn btn-sm" data-edit="' + p.id + '">Editează</button>';
    h += '<button class="btn btn-sm btn-danger-outline" data-del="' + p.id + '">Șterge</button>';
    h += '</div>';
    h += '</div>'; // .reg-more-body

    h += '</div>'; // .reg-detail-head
    return h;
  }

  // Pipeline-ul de etape din rândul desfăcut al registrului: coloane de etape, lane-uri,
  // carduri de piesă, drag&drop, controale de etapă.
  function renderRegPipe(p){
    var out = '<div class="reg-detail-pipe">';
    var pStations = stationsFor(p);
    pStations.forEach(function(station, sIdx){
      var projLanes = projectLanesFor(p, station);
      var hasLanes = projLanes.length > 0;
      // coloana Montaj (etapă de proiect după ultima etapă de piesă) — arată și piesele trimise la montaj
      var isMontajCol = station.type === 'proiect' && isPostExecStationFor(p, station.id);
      var montajPieces = isMontajCol ? (p.pieces||[]).filter(function(pc){ return pc.stationId === PIECE_MONTAJ; }) : [];
      var isHere = (p.stationId === station.id); // cartonașul poate sta pe orice etapă acum
      // coloană „goală" — se subțiază: fără piese aici, fără piese la montaj, nu e etapa curentă
      var piecesHere = (p.pieces||[]).filter(function(pc){ return pc.stationId === station.id; });
      var pieceCount = piecesHere.length + montajPieces.length;
      var hasPieces = pieceCount > 0;
      var thin = !isHere && !hasPieces;
      out += '<div class="proj-stage-box ' + station.type + (isHere ? ' is-here' : '') + (thin ? ' thin' : '') + (hasPieces ? ' has-pieces' : '') + (pieceCount >= 4 ? ' has-many' : '') + '">';
      out += '<div class="proj-stage-head"' + (isHere ? ' draggable="true" data-proj-drag="' + p.id + '" title="Trage ca să muți proiectul în altă etapă"' : '') + '><span>' + esc(station.name) + '</span>';
      if(!thin){
        out += '<div class="col-actions">';
        if(sIdx > 0) out += '<button data-act="left" data-station="' + station.id + '" data-project="' + p.id + '" title="Mută etapa la stânga">‹</button>';
        if(sIdx < pStations.length - 1) out += '<button data-act="right" data-station="' + station.id + '" data-project="' + p.id + '" title="Mută etapa la dreapta">›</button>';
        out += '<button data-act="addlane" data-station="' + station.id + '" data-project="' + p.id + '" title="Adaugă o partiție">⊞</button>';
        out += '<button data-act="del" data-station="' + station.id + '" data-project="' + p.id + '" title="Șterge etapa">✕</button>';
        out += '</div>';
      }
      out += '</div>';
      if(hasLanes && !thin){
        out += '<div class="lanes-row">';
        projLanes.forEach(function(lane){
          var items = [];
          if(station.type === 'proiect'){
            // etapa curentă a proiectului e marcată de bara accent din capul coloanei, nu ca item în lane — nu-l numărăm
            (p.pieces||[]).forEach(function(pc){ if(pc.stationId === station.id && (pc.lane||defaultLaneId(projLanes)) === lane.id) items.push(pc); });
            montajPieces.forEach(function(pc){ if((pc.lane||defaultLaneId(projLanes)) === lane.id) items.push(pc); });
          } else {
            (p.pieces||[]).forEach(function(pc){ if(pc.stationId === station.id && (pc.lane||defaultLaneId(projLanes)) === lane.id) items.push(pc); });
          }
          out += '<div class="lane">';
          out += '<div class="lane-head"><input class="lane-title" data-station="' + station.id + '" data-lane="' + lane.id + '" data-project="' + p.id + '" value="' + esc(lane.name) + '"><span class="col-count">' + items.length + '</span><button class="lane-del" data-act="lanedel" data-station="' + station.id + '" data-lane="' + lane.id + '" data-project="' + p.id + '" title="Șterge partiția">✕</button></div>';
          out += '<div class="col-body lane-body" data-station="' + station.id + '" data-kind="' + station.type + '" data-lane="' + lane.id + '">';
          if(items.length === 0){ if(!thin) out += '<div class="col-empty">—</div>'; }
          else if(station.type === 'proiect'){
            (p.pieces||[]).forEach(function(pc){ if(pc.stationId === station.id && (pc.lane||defaultLaneId(projLanes)) === lane.id) out += renderPieceCard(pc, p); });
            montajPieces.forEach(function(pc){ if((pc.lane||defaultLaneId(projLanes)) === lane.id) out += renderPieceCard(pc, p); });
          }
          else items.forEach(function(pc){ out += renderPieceCard(pc, p); });
          out += '</div></div>';
        });
        out += '</div>';
      } else {
      out += '<div class="col-body" data-station="' + station.id + '" data-kind="' + station.type + '">';
      if(station.type === 'proiect'){
        var parked = (p.pieces||[]).filter(function(pc){ return pc.stationId === station.id; });
        parked.forEach(function(pc){ out += renderPieceCard(pc, p); });
        montajPieces.forEach(function(pc){ out += renderPieceCard(pc, p); });
        if(!thin && p.stationId !== station.id && !parked.length && !montajPieces.length) out += '<div class="col-empty">—</div>';
      } else {
        var pieces = (p.pieces||[]).filter(function(pc){ return pc.stationId === station.id; });
        if(pieces.length) pieces.forEach(function(pc){ out += renderPieceCard(pc, p); });
        else if(!thin) out += '<div class="col-empty">—</div>';
      }
      out += '</div>';
      }
      out += '</div>';
    });
    out += '</div>'; // close .reg-detail-pipe
    return out;
  }

  function renderPieceCard(piece, project){
    var flow = pieceFlowFor(project);
    var flowIdx = flow.findIndex(function(s){ return s.id === piece.stationId; });
    var curStation = stationByIdFor(project, piece.stationId);
    var inProiectStage = !!(curStation && curStation.type === 'proiect');
    var isBack = flowIdx === 0 && inProiectStage; // la prima etapă din flux, etapă de proiect
    // card slim: doar nume + cod culoare — codul/clientul proiectului sunt deja în antetul rândului.
    // Poziția (coloana) + culoarea marginii spun etapa. Se mută doar prin drag.
    var html = '<div class="piece-card' + (isBack ? ' back-to-design' : '') + '" draggable="true" data-piece="' + project.id + '::' + piece.id + '">';
    html += '<div class="p-name">' + esc(piece.name) + '</div>';
    if(piece.colorCode) html += '<div class="p-color">' + esc(piece.colorCode) + '</div>';
    html += '</div>';
    return html;
  }

  function attachHalaEvents(){
    document.querySelectorAll('.col-title').forEach(function(inp){
      inp.addEventListener('change', function(){
        var st = stationById(inp.dataset.station);
        if(st){ st.name = inp.value.trim() || st.name; saveState(); }
      });
    });
    document.querySelectorAll('.lane-title').forEach(function(inp){
      inp.addEventListener('change', function(){
        var projId = inp.dataset.project;
        if(projId){
          var proj = state.projects.find(function(x){ return x.id===projId; });
          var lanes = proj && proj.laneDefs && proj.laneDefs[inp.dataset.station];
          var lane = lanes && lanes.find(function(l){ return l.id === inp.dataset.lane; });
          if(lane){ lane.name = inp.value.trim() || lane.name; saveState(); }
          return;
        }
        var st = stationById(inp.dataset.station);
        if(!st || !st.lanes) return;
        var lane = st.lanes.find(function(l){ return l.id === inp.dataset.lane; });
        if(lane){ lane.name = inp.value.trim() || lane.name; saveState(); }
      });
    });
    document.querySelectorAll('.lane-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var projId = btn.dataset.project;
        var laneId = btn.dataset.lane;
        if(projId){
          var proj = state.projects.find(function(x){ return x.id===projId; });
          if(!proj || !proj.laneDefs || !proj.laneDefs[btn.dataset.station]) return;
          var lanes = proj.laneDefs[btn.dataset.station];
          var remaining = lanes.filter(function(l){ return l.id !== laneId; });
          var fallbackId = remaining[0] ? remaining[0].id : null;
          var st0 = stationByIdFor(proj, btn.dataset.station);
          if(st0 && st0.type === 'proiect'){
            if(proj.stationId===btn.dataset.station && proj.lane===laneId) proj.lane = fallbackId;
          } else {
            (proj.pieces||[]).forEach(function(pc){ if(pc.stationId===btn.dataset.station && pc.lane===laneId) pc.lane = fallbackId; });
          }
          proj.laneDefs[btn.dataset.station] = remaining;
          saveState(); render();
          return;
        }
        var st = stationById(btn.dataset.station);
        if(!st || !st.lanes) return;
        var remaining = st.lanes.filter(function(l){ return l.id !== laneId; });
        var fallbackId = remaining[0] ? remaining[0].id : null;
        if(st.type === 'proiect'){
          state.projects.forEach(function(p){ if(p.stationId===st.id && p.lane===laneId) p.lane = fallbackId; });
        } else {
          state.projects.forEach(function(p){ (p.pieces||[]).forEach(function(pc){ if(pc.stationId===st.id && pc.lane===laneId) pc.lane = fallbackId; }); });
        }
        st.lanes = remaining;
        saveState(); render();
      });
    });
    document.querySelectorAll('.col-actions button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.station;
        var act = btn.dataset.act;
        var proj = btn.dataset.project ? projectById(btn.dataset.project) : null;
        // the flow of stages is per-project now — a project scopes to its own p.stations
        var arr = proj ? forkProjectStations(proj) : state.stations;
        var idx = arr.findIndex(function(s){ return s.id === id; });
        var st = arr[idx];
        if(act === 'addlane'){
          if(proj){
            var stP = stationByIdFor(proj, id);
            if(!stP) return;
            var existing = projectLanesFor(proj, stP);
            var laneNameP = prompt('Denumire partiție nouă:', existing.length ? '' : 'Atelier');
            if(!laneNameP || !laneNameP.trim()) return;
            existing.push({id: uid(), name: laneNameP.trim()});
            saveState(); render();
            return;
          }
          var stA = stationById(id);
          var laneName = prompt('Denumire coloană nouă:', stA.lanes && stA.lanes.length ? '' : 'Atelier');
          if(!laneName || !laneName.trim()) return;
          if(!stA.lanes) stA.lanes = [];
          stA.lanes.push({id: uid(), name: laneName.trim()});
          saveState(); render();
        } else if(act === 'left' && idx > 0){
          var t = arr[idx-1]; arr[idx-1]=arr[idx]; arr[idx]=t; saveState(); render();
        } else if(act === 'right' && idx < arr.length-1){
          var t2 = arr[idx+1]; arr[idx+1]=arr[idx]; arr[idx]=t2; saveState(); render();
        } else if(act === 'del'){
          if(!st) return;
          var sameType = arr.filter(function(s){ return s.type===st.type; });
          if(sameType.length <= 1){ alert('Trebuie să existe cel puțin o etapă de tip ' + (st.type==='piesa'?'piesă':'proiect') + '.'); return; }
          var remaining = arr.filter(function(s){ return s.id !== id; });
          var fallback = remaining.filter(function(s){ return s.type===st.type; })[0];
          if(proj){
            var affected = st.type==='proiect'
              ? (proj.stationId===id ? 1 : 0)
              : (proj.pieces||[]).filter(function(pc){ return pc.stationId===id; }).length;
            if(affected > 0 && !confirm('Etapa are ' + affected + (st.type==='piesa'?' piese':' proiect') + ' aici. Se mută în altă etapă. Continui?')) return;
            if(st.type==='proiect'){ if(proj.stationId===id){ proj.stationId = fallback.id; proj.lane = null; } }
            else { (proj.pieces||[]).forEach(function(pc){ if(pc.stationId===id){ pc.stationId = fallback.id; pc.lane = null; } }); }
            proj.stations = remaining;
            saveState(); render();
            return;
          }
          var affectedCount = st.type==='proiect'
            ? state.projects.filter(function(p){ return p.stationId===id; }).length
            : state.projects.reduce(function(a,p){ return a + (p.pieces||[]).filter(function(pc){ return pc.stationId===id; }).length; }, 0);
          if(affectedCount > 0 && !confirm('Etapa are ' + affectedCount + ' ' + (st.type==='piesa'?'piese':'proiect(e)') + '. Se mută în etapa anterioară de același tip. Continui?')) return;
          if(st.type==='proiect'){
            state.projects.forEach(function(p){ if(p.stationId===id){ p.stationId = fallback.id; p.lane = null; } });
          } else {
            state.projects.forEach(function(p){ (p.pieces||[]).forEach(function(pc){ if(pc.stationId===id){ pc.stationId = fallback.id; pc.lane = null; } }); });
          }
          state.stations = remaining;
          saveState(); render();
        }
      });
    });
    document.querySelectorAll('[data-close-project]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var p = state.projects.find(function(x){ return x.id===btn.dataset.closeProject; });
        if(p && !p.finalizat){ p.finalizat = true; p.finalizatAt = new Date().toISOString(); logEvent('finalizat', p.cod + ' · ' + p.client); saveState(); render(); }
      });
    });
    document.querySelectorAll('[data-reopen-project]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var p = state.projects.find(function(x){ return x.id===btn.dataset.reopenProject; });
        if(p && p.finalizat){ p.finalizat = false; logEvent('redeschis', p.cod + ' · ' + p.client); saveState(); render(); }
      });
    });
    document.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ openProjectModal(btn.dataset.edit); });
    });
    document.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var proj = state.projects.find(function(p){ return p.id === btn.dataset.del; });
        if(proj && confirm('Ștergi proiectul ' + proj.cod + ' (' + proj.client + ')?')){
          state.projects = state.projects.filter(function(p){ return p.id !== proj.id; });
          state.repairs = (state.repairs || []).filter(function(r){ return r.projectId !== proj.id && normCod(r.cod) !== normCod(proj.cod); });
          delete registryOpen[proj.id];
          saveState(); render();
        }
      });
    });
    // drag & drop — the project itself, dragged by the head of its current "proiect" stage column
    document.querySelectorAll('[data-proj-drag]').forEach(function(el){
      el.addEventListener('dragstart', function(e){
        var payload = 'PRJ::' + el.dataset.projDrag;
        draggingData = payload;
        el.closest('.proj-stage-box').classList.add('dragging');
        e.dataTransfer.setData('text/plain', payload);
      });
      el.addEventListener('dragend', function(){
        el.closest('.proj-stage-box') && el.closest('.proj-stage-box').classList.remove('dragging');
        draggingData = null;
      });
    });
    // drag & drop — piece cards
    document.querySelectorAll('.piece-card[draggable="true"]').forEach(function(card){
      card.addEventListener('dragstart', function(e){
        var payload = 'PC::' + card.dataset.piece;
        draggingData = payload;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', payload);
      });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); draggingData=null; });
    });

    // project orders panel — materiale de comandat
    document.querySelectorAll('[data-order-add]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var p = projectById(btn.dataset.orderAdd);
        if(!p) return;
        if(!Array.isArray(p.orders)) p.orders = [];
        p.orders.push(newOrderLine());
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-order-status]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var found = findOrderByKey(btn.dataset.orderStatus);
        if(!found) return;
        cycleOrderStatus(found.order);
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-order-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var found = findOrderByKey(btn.dataset.orderDel);
        if(!found) return;
        if(found.order.text && !confirm('Ștergi rândul „' + found.order.text + '”?')) return;
        found.project.orders = found.project.orders.filter(function(x){ return x.id !== found.order.id; });
        pruneOrders();
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-order-edit]').forEach(function(inp){
      inp.addEventListener('mousedown', function(e){ e.stopPropagation(); });
      inp.addEventListener('change', function(){
        var found = findOrderByKey(inp.dataset.orderEdit);
        if(!found) return;
        // trim free text, but leave the supplier <select> value untouched
        found.order[inp.dataset.field] = inp.tagName === 'SELECT' ? inp.value : inp.value.trim();
        saveState(); // no re-render: the summary badge only tracks count + status, not these fields
      });
    });

    // drop zones — station bodies (projects/pieces)
    document.querySelectorAll('.col-body').forEach(function(zone){
      zone.addEventListener('dragover', function(e){
        e.preventDefault(); zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', function(){ zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', function(e){
        e.preventDefault(); // înainte de orice verificare — altfel un fișier scăpat pe zonă navighează pagina
        var data = e.dataTransfer.getData('text/plain') || draggingData;
        if(!data) return;
        zone.classList.remove('drag-over');
        if(data.indexOf('PC::') === 0){
          var parts = data.slice(4).split('::');
          var p = state.projects.find(function(x){ return x.id === parts[0]; });
          if(!p) return;
          var pc = p.pieces.find(function(x){ return x.id === parts[1]; });
          if(!pc) return;
          // piesele se mută liber pe orice etapă (proiect sau piesă)
          pc.stationId = zone.dataset.station; pc.lane = zone.dataset.lane || null;
          saveState(); render();
        } else if(data.indexOf('PRJ::') === 0){
          var proj = state.projects.find(function(x){ return x.id === data.slice(5); });
          if(proj){
            // cartonașul proiectului se mută liber pe orice etapă
            proj.stationId = zone.dataset.station; proj.lane = zone.dataset.lane || null;
            saveState(); render();
          }
        }
      });
    });

    // registru — toggle rând pliat
    document.querySelectorAll('[data-toggle-reg]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.toggleReg;
        if(registryOpen[id]) delete registryOpen[id]; else registryOpen[id] = true;
        render();
      });
    });
    document.querySelectorAll('[data-toggle-orders]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.toggleOrders;
        regOrdersOpen[id] = !regOrdersOpen[id];
        var box = document.getElementById('reg-orders-' + id);
        if(box) box.hidden = !regOrdersOpen[id];
      });
    });
    document.querySelectorAll('[data-reg-more]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.regMore;
        regMoreOpen[id] = !regMoreOpen[id];
        var box = document.getElementById('reg-more-' + id);
        if(box) box.hidden = !regMoreOpen[id];
      });
    });

    // registru — filtru + sortare
    document.querySelectorAll('[data-reg-filter]').forEach(function(b){
      b.addEventListener('click', function(){ regFilter = b.dataset.regFilter; render(); });
    });
    var sortSel = document.querySelector('[data-reg-sort]');
    if(sortSel) sortSel.addEventListener('change', function(){ regSort = sortSel.value; render(); });

    // registru — fir de reparații
    document.querySelectorAll('[data-rep-cyc]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var r = (state.repairs || []).find(function(x){ return x.id === b.dataset.repCyc; });
        if(!r) return;
        r.status = r.status === 'deschisa' ? 'in-lucru' : (r.status === 'in-lucru' ? 'rezolvata' : 'deschisa');
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-rep-del]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var r = (state.repairs || []).find(function(x){ return x.id === b.dataset.repDel; });
        if(!r) return;
        if(!confirm('Ștergi reparația „' + (r.descriere || r.cod) + '”?')) return;
        state.repairs = state.repairs.filter(function(x){ return x.id !== r.id; });
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-rep-add]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var pid = b.dataset.repAdd;
        var p = state.projects.find(function(x){ return x.id === pid; });
        var inp = document.querySelector('[data-rep-new="' + pid + '"]');
        var v = inp ? inp.value.trim() : '';
        if(!v){ if(inp) inp.classList.add('bad'); return; }
        if(!Array.isArray(state.repairs)) state.repairs = [];
        state.repairs.push({ id: uid(), projectId: pid, cod: p ? p.cod : '', client: p ? p.client : '', descriere: v, data: isoToday(), status: 'deschisa' });
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-rep-new]').forEach(function(inp){
      inp.addEventListener('keydown', function(e){
        if(e.key !== 'Enter') return;
        e.preventDefault();
        var btn = document.querySelector('[data-rep-add="' + inp.dataset.repNew + '"]');
        if(btn) btn.click();
      });
      inp.addEventListener('click', function(e){ e.stopPropagation(); });
    });
  }

  /* ================= COMENZI (toate materialele de aprovizionat) ================= */
  var comenziFurnizoriOpen = false;

  function renderFurnizoriPanel(){
    var sup = state.workers.filter(function(w){ return w.kind === 'furnizor'; }).slice();
    sup.sort(function(a, b){ return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()); });
    var open = comenziFurnizoriOpen;
    var h = '<div class="furn-panel' + (open ? ' open' : '') + '">';
    h += '<button type="button" class="furn-panel-head" data-furn-toggle aria-expanded="' + (open ? 'true' : 'false') + '">';
    h += '<span>Furnizori</span> <span class="furn-count">(' + sup.length + ')</span>';
    h += '<span class="furn-chev">▸</span>';
    h += '</button>';
    h += '<div class="furn-panel-body"' + (open ? '' : ' hidden') + '>';
    h += '<div class="furn-row furn-row-head"><span>Nume</span><span>Contact</span><span>Zi livrare</span><span>Notă livrare</span><span>Note</span><span></span></div>';
    sup.forEach(function(w){
      var inUse = state.projects.some(function(p){ return (p.orders || []).some(function(o){ return o.supplierId === w.id || o.altSupplierId === w.id; }); });
      h += '<div class="furn-row">';
      h += '<input class="furn-inp" data-furn-edit="' + w.id + '" data-field="name" value="' + esc(w.name || '') + '" placeholder="Nume furnizor">';
      h += '<input class="furn-inp" data-furn-edit="' + w.id + '" data-field="contact" value="' + esc(w.contact || '') + '" placeholder="telefon / email">';
      h += '<select class="furn-inp" data-furn-edit="' + w.id + '" data-field="deliveryDay" title="Ziua în care livrează">' +
        '<option value=""' + (w.deliveryDay === null || typeof w.deliveryDay === 'undefined' ? ' selected' : '') + '>fără zi fixă</option>' +
        ZI_NAME.map(function(z, i){ return '<option value="' + i + '"' + (w.deliveryDay === i ? ' selected' : '') + '>' + z + '</option>'; }).join('') +
        '</select>';
      h += '<input class="furn-inp" data-furn-edit="' + w.id + '" data-field="deliveryNote" value="' + esc(w.deliveryNote || '') + '" placeholder="ex. ridicare oricând">';
      h += '<input class="furn-inp" data-furn-edit="' + w.id + '" data-field="taskNote" value="' + esc(w.taskNote || '') + '" placeholder="ce furnizează">';
      h += '<button type="button" class="furn-del" data-furn-del="' + w.id + '"' +
        (inUse ? ' disabled title="Are comenzi legate — nu se poate șterge"' : ' title="Șterge"') + '>×</button>';
      h += '</div>';
    });
    h += '<button type="button" class="btn btn-xs btn-ghost" data-furn-add>+ furnizor nou</button>';
    h += '</div></div>';
    return h;
  }

  function attachFurnizoriEvents(){
    var t = document.querySelector('[data-furn-toggle]');
    if(t) t.addEventListener('click', function(){ comenziFurnizoriOpen = !comenziFurnizoriOpen; render(); });
    document.querySelectorAll('[data-furn-edit]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var w = state.workers.find(function(x){ return x.id === inp.dataset.furnEdit; });
        if(!w) return;
        var f = inp.dataset.field;
        if(f === 'deliveryDay'){
          w.deliveryDay = inp.value === '' ? null : parseInt(inp.value, 10);
          saveState(); render();
          return;
        }
        var v = inp.value.trim();
        if(f === 'name' && !v){ inp.value = w.name; return; }
        if(f === 'deliveryNote'){ w.deliveryNote = v || null; saveState(); render(); return; }
        w[f] = v;
        saveState(); render(); // re-randăm ca numele să apară în meniul de furnizor + anteturile de grup din tabelul de comenzi
      });
    });
    document.querySelectorAll('[data-furn-add]').forEach(function(b){
      b.addEventListener('click', function(){
        state.workers.push({ id: uid(), name: 'Furnizor nou', kind: 'furnizor', taskNote: '', contact: '', deliveryDay: null, deliveryNote: null });
        comenziFurnizoriOpen = true;
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-furn-del]').forEach(function(b){
      b.addEventListener('click', function(){
        if(b.disabled) return;
        var w = state.workers.find(function(x){ return x.id === b.dataset.furnDel; });
        if(!w) return;
        if(!confirm('Ștergi furnizorul „' + w.name + '”?')) return;
        state.workers = state.workers.filter(function(x){ return x.id !== w.id; });
        saveState(); render();
      });
    });
  }

  /* ---------------- Comenzi: stare de interfață (tranzitorie, nu se salvează) ---------------- */
  var cmzSort = 'sup', cmzDir = 1, cmzQ = '', cmzFs = '', cmzFp = '', cmzFst = '',
      cmzUrg = false, cmzGroup = true, cmzFcmd = '', cmzSel = {}, cmzHist = false,
      cmzAddOpen = false, cmzFlash = null, cmzFocus = null, cmzEventsOn = false;

  function cmzLateDays(p){
    if(!p || !p.termen || p.finalizat) return 0;
    var d = daysBetween(todayDate(), parseDate(p.termen));
    return d < 0 ? -d : 0;
  }
  function cmzSoonDays(p){
    if(!p || !p.termen) return null;
    return daysBetween(todayDate(), parseDate(p.termen));
  }
  // urgent = proiectul e întârziat sau are termen în ≤7 zile, iar linia încă n-a plecat
  function cmzIsUrgent(n){
    if(n.status !== 'de-comandat') return false;
    var p = n._p;
    if(!p || p.finalizat || !p.termen) return false;
    return daysBetween(todayDate(), parseDate(p.termen)) <= 7;
  }
  function cmzStatePill(n){
    return '<button type="button" class="cmz-pill ' + ORDER_STATUS_CLS[n.status] + '" data-cmz="cycle" data-cmzk="' +
      n.key + '" title="Schimbă starea">' + ORDER_STATUS_LABEL[n.status] + '</button>';
  }
  function cmzQtyHtml(n){
    return '<span class="cmz-qty">' + esc(n.qty === '' ? '—' : n.qty) + '<small>' + esc(n.um) + '</small></span>';
  }
  function cmzProjChip(n){
    var p = n._p; if(!p) return '';
    var L = cmzLateDays(p), s = cmzSoonDays(p);
    var cls = L ? ' late' : (n.status === 'de-comandat' && s !== null && s <= 4 ? ' soon' : '');
    return '<span class="cmz-chip' + cls + '">' + esc(p.cod || '—') + (L ? ' · întârziat ' + L + 'z' : '') + '</span>';
  }

  /* ---- banda registru: cine stă după material ---- */
  function cmzSignalHtml(needs){
    var by = {}, list = [];
    needs.forEach(function(n){
      if(n.status !== 'de-comandat') return;
      var p = n._p;
      if(!p || p.finalizat || !p.termen) return;
      if(!by[p.id]){ by[p.id] = { p: p, k: 0 }; list.push(by[p.id]); }
      by[p.id].k++;
    });
    list.sort(function(a, b){ return a.p.termen < b.p.termen ? -1 : (a.p.termen > b.p.termen ? 1 : 0); });
    if(!list.length){
      return '<div class="cmz-signal clear"><span class="cmz-sg-t">Registru</span>' +
        '<span class="cmz-note">Niciun proiect nu mai stă după material — tot ce e pe listă e comandat sau primit.</span></div>';
    }
    var h = '<div class="cmz-signal"><span class="cmz-sg-t">Blochează în registru</span>';
    list.slice(0, 5).forEach(function(it){
      var L = cmzLateDays(it.p), s = cmzSoonDays(it.p);
      h += '<button type="button" class="cmz-sg-i" data-cmz="f-prj" data-cmzv="' + it.p.id + '" title="Filtrează tabelul pe proiect">' +
        '<b>' + esc(it.p.cod || '—') + '</b><span class="d">' + (L ? 'întârziat ' + L + 'z' : 'termen în ' + s + 'z') + '</span>' +
        '<span class="cmz-note">· ' + it.k + ' necomandat' + (it.k > 1 ? 'e' : '') + '</span></button>';
    });
    if(list.length > 5) h += '<span class="cmz-note">+' + (list.length - 5) + ' alte proiecte</span>';
    return h + '</div>';
  }

  function cmzFlashHtml(){
    if(!cmzFlash) return '';
    return '<div class="cmz-flash"><b>' + esc(cmzFlash.title) + '</b><span>' + esc(cmzFlash.body) + '</span>' +
      '<span class="sp"></span>' +
      (cmzFlash.cmdId ? '<button type="button" class="btn btn-xs" data-cmz="f-cmd" data-cmzv="' + cmzFlash.cmdId + '">vezi comanda</button>' : '') +
      '<button type="button" class="cmz-icob" data-cmz="flash-x" title="Închide">×</button></div>';
  }

  /* ---- bara de unelte ---- */
  function cmzToolbarHtml(needs){
    var cnt = { '': needs.length };
