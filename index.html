  function openWorkerModal(workerId){
    var w = state.workers.find(function(x){ return x.id === workerId; });

    var links = workerAssignments(w.id);

    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>' + (w.kind==='furnizor' ? 'Furnizor' : 'Persoană') + '</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field"><label>Nume</label><input id="wf-name" value="'+esc(w.name)+'"></div>';
    html += '<div class="field-row"><div class="field" style="flex:0 0 90px;"><label>Culoare</label><input type="color" id="wf-color" value="'+esc(workerColor(w))+'" style="height:40px; padding:4px; cursor:pointer;"></div>';
    html += '<div class="field" style="flex:1; justify-content:flex-end; display:flex; flex-direction:column;"><label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:13px; margin-bottom:0;"><input type="checkbox" id="wf-furnizor" style="width:auto;" '+(w.kind==='furnizor'?'checked':'')+'> Furnizor extern (nu angajat)</label></div></div>';
    if((state.colorHistory||[]).length){
      html += '<div class="field"><label>Culori folosite</label><div class="color-history">' + state.colorHistory.map(function(c){
        return '<button type="button" class="color-swatch" data-pick-color="'+esc(c)+'" style="background:'+esc(c)+'" title="'+esc(c)+'"></button>';
      }).join('') + '</div></div>';
    }
    html += '<div class="field"><label>Task-uri legate</label>';
    if(links.length === 0){
      html += '<div class="field-hint">Niciunul încă — trage-l direct peste un card de proiect sau piesă, ca să-l legi.</div>';
    } else {
      html += '<div class="pieces-editor">';
      links.forEach(function(a){
        html += '<div class="piece-row"><input class="piece-name" disabled value="'+esc(assignmentLabel(a))+'"><button type="button" class="btn-remove-piece" data-unlink-modal="'+a.id+'">×</button></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="field"><label>Notă generală</label><input id="wf-note" value="'+esc(w.taskNote||'')+'" placeholder="ex: liber după ora 14"></div>';
    html += '</div>';
    html += '<div class="modal-foot"><div class="left"><button class="btn btn-danger-outline" id="btn-del-worker">Șterge</button></div>';
    html += '<div><button class="btn btn-ghost" id="btn-cancel">Anulează</button> <button class="btn btn-primary" id="btn-save-worker">Salvează</button></div></div>';
    html += '</div></div>';
    root.innerHTML = html;

    document.querySelectorAll('[data-unlink-modal]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.assignments = state.assignments.filter(function(a){ return a.id !== btn.dataset.unlinkModal; });
        saveState(); openWorkerModal(workerId);
      });
    });
    document.querySelectorAll('[data-pick-color]').forEach(function(sw){
      sw.addEventListener('click', function(){ document.getElementById('wf-color').value = sw.dataset.pickColor; });
    });

    function close(){ root.innerHTML = ''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);

      if(confirm('Ștergi pe '+w.name+'?')){
        state.workers = state.workers.filter(function(x){ return x.id !== w.id; });
        state.assignments = state.assignments.filter(function(a){ return a.workerId !== w.id; });
        saveState(); close(); render();
      }
    });
    document.getElementById('btn-save-worker').addEventListener('click', function(){
      var name = document.getElementById('wf-name').value.trim();
      if(!name){ alert('Adaugă un nume.'); return; }
      w.name = name;
      w.kind = document.getElementById('wf-furnizor').checked ? 'furnizor' : 'intern';
      w.color = document.getElementById('wf-color').value;
      addToColorHistory(w.color);
      w.taskNote = document.getElementById('wf-note').value.trim();
      saveState(); close(); render();
    });
  }

  /* ================= GANTT ================= */
  function ganttDayWidth(){ return ganttZoom === 'day' ? 40 : (ganttZoom === 'month' ? 6 : 15); }
  // end date of the whole project = end of its last phase (dragged), else termen, else a week out
  function ganttEnd(p, start){
    var f = p.faze || {};
    return parseDate(f.montaj) || parseDate(f.exec) || parseDate(f.ante) || parseDate(p.termen) || addDays(start, 7);
  }
  // resolve each phase's [start,end] for a project: user-dragged dates from p.faze, else a
  // proportional default split of createdAt..(termen or +14d) by stage count.
  var GANTT_PHASE_ORDER = ['ante', 'exec', 'montaj'];
  var GANTT_PHASE_LABEL = { ante:'Anteproiect', exec:'Execuție', montaj:'Montaj' };
  function ganttPhaseDates(p){
    var sp = ganttPhaseSpans(p);
    var start = parseDate(p.createdAt) || todayDate();
    var termen = parseDate(p.termen);
    var endRef = (termen && termen > start) ? termen : addDays(start, 14);
    var totalDays = Math.max(3, daysBetween(start, endRef));
    var nBy = { ante: sp.ante, exec: sp.exec, montaj: sp.montaj };
    var kinds = GANTT_PHASE_ORDER.filter(function(k){ return nBy[k] > 0; });
    var faze = p.faze || {};
    var res = [], cursor = start, acc = 0;
    kinds.forEach(function(k, i){
      acc += nBy[k];
      var defEnd = (i === kinds.length - 1) ? endRef : addDays(start, Math.round(totalDays * acc / sp.total));
      var end = faze[k] ? parseDate(faze[k]) : defEnd;
      if(end <= cursor) end = addDays(cursor, 1);
      res.push({ kind: k, start: cursor, end: end, n: nBy[k] });
      cursor = end;
    });
    return res;
  }
  // how many stages fall in each of the 3 phases — used to split the bar proportionally.
  // anteproiect = etapele de proiect dinaintea pieselor (include proiectarea); execuție = etapele de piesă;
  // montaj = etapele de proiect de după piese.
  function ganttPhaseSpans(p){
    var a = stationsFor(p);
    var fp = a.findIndex(function(s){ return s.type === 'piesa'; });
    var lp = -1; for(var i=a.length-1;i>=0;i--){ if(a[i].type==='piesa'){ lp=i; break; } }
    var ante = (fp === -1) ? a.length : fp;
    var exec = (fp === -1) ? 0 : (lp - fp + 1);
    var montaj = (lp === -1) ? 0 : (a.length - lp - 1);
    return { ante: ante, exec: exec, montaj: montaj, total: Math.max(1, ante + exec + montaj) };
  }
  function renderGantt(){
    var board = document.getElementById('board');
    board.className = ''; board.style.display = 'block'; board.style.height = '100%';

    var projects = state.projects.filter(function(p){ return !p.finalizat && matchesSearch(p.cod, p.client); })
      .slice().sort(function(a,b){ return (a.termen||'9999') < (b.termen||'9999') ? -1 : 1; });

    if(projects.length === 0){
      board.innerHTML = '<div class="empty-state gantt-empty"><h2>Nimic pe Gantt</h2><p>Proiectele active apar aici ca bare pe timp, de la deschidere până la data estimată de gata.</p></div>';
      return;
    }

    var today = todayDate();
    var dayW = ganttDayWidth();

    var minDate = today, maxDate = addDays(today, 14);
    projects.forEach(function(p){
      var s = parseDate(p.createdAt) || today;
      var e = ganttEnd(p, s);
      if(s < minDate) minDate = s;
      if(e > maxDate) maxDate = e;
    });
    minDate = addDays(minDate, -3);
    maxDate = addDays(maxDate, ganttZoom === 'month' ? 21 : 7);
    var numDays = Math.max(14, daysBetween(minDate, maxDate));
    var trackW = numDays * dayW;
    function x(d){ return daysBetween(minDate, d) * dayW; }
    var todayX = x(today);

    // ---- time header ----
    var headCells = '';
    if(ganttZoom === 'day'){
      for(var i=0;i<numDays;i++){
        var d = addDays(minDate, i);
        headCells += '<div class="gantt-daycell'+(sameDay(d,today)?' is-today':'')+'" style="width:'+dayW+'px">'+d.getDate()+
          ((d.getDate()===1||i===0)?'<span class="g-month">'+MONTHS[d.getMonth()]+'</span>':'')+'</div>';
      }
    } else if(ganttZoom === 'week'){
      for(var w=0; w<numDays; w+=7){
        var d0 = addDays(minDate, w);
        var ww = Math.min(7, numDays - w);
        headCells += '<div class="gantt-daycell" style="width:'+(ww*dayW)+'px">'+d0.getDate()+' '+MONTHS[d0.getMonth()]+'</div>';
      }
    } else {
      var cur = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
      while(cur < maxDate){
        var nx = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
        var from = Math.max(0, x(cur)), to = Math.min(trackW, x(nx));
        headCells += '<div class="gantt-daycell" style="width:'+Math.max(0,(to-from))+'px">'+MONTHS[cur.getMonth()]+' '+cur.getFullYear()+'</div>';
        cur = nx;
      }
    }

    // ---- rows ----
    var rows = '';
    projects.forEach(function(p){
      var termen = parseDate(p.termen);
      var curKind = currentPhaseKind(p);
      var planned = ganttPhaseDates(p);
      var curIdx = planned.findIndex(function(ph){ return ph.kind === curKind; });
      if(curIdx === -1) curIdx = 0;

      var createdD = parseDate(p.createdAt) || today;
      var sinceD = p.phaseSince ? new Date(p.phaseSince) : null;
      if(sinceD && !isNaN(sinceD)) sinceD.setHours(0,0,0,0); else sinceD = null;
      // prima fază e activă de la deschiderea proiectului; celelalte, de când s-a intrat în ele
      var curStart = (curIdx === 0) ? createdD : (sinceD || planned[curIdx].start);
      if(curStart < createdD) curStart = createdD;

      // rebuild the phases anchored to reality: done phases fill [creat .. faza curentă a început],
      // faza curentă [start real .. capăt planificat], fazele viitoare înlănțuite după.
      var real = [];
      var doneNTot = 0; for(var di=0; di<curIdx; di++) doneNTot += planned[di].n;
      var spanDone = Math.max(0, daysBetween(createdD, curStart));
      var accD = 0;
      for(var i=0; i<curIdx; i++){
        accD += planned[i].n;
        var s = (i === 0) ? createdD : real[i-1].end;
        var e = (i === curIdx-1) ? curStart : addDays(createdD, Math.round(spanDone * accD / Math.max(1, doneNTot)));
        if(e < s) e = s;
        real.push({ kind: planned[i].kind, start: s, end: e, status: 'done' });
      }
      var curEnd = (p.faze && p.faze[curKind]) ? parseDate(p.faze[curKind]) : planned[curIdx].end;
      if(curEnd <= curStart) curEnd = addDays(curStart, 1);
      real.push({ kind: curKind, start: curStart, end: curEnd, status: 'current' });
      var runEnd = curEnd;
      for(var j=curIdx+1; j<planned.length; j++){
        var dur = Math.max(1, daysBetween(planned[j].start, planned[j].end));
        real.push({ kind: planned[j].kind, start: runEnd, end: addDays(runEnd, dur), status: 'future' });
        runEnd = addDays(runEnd, dur);
      }

      var projEnd = real[real.length - 1].end;
      var curOverdue = today > curEnd;
      // un proiect neterminat nu se poate încheia în trecut — podim la azi pentru decalaj
      var effEnd = (projEnd < today) ? today : projEnd;

      var slipTxt = '', slipCol = '';
      if(termen){
        var slip = daysBetween(termen, effEnd);
        if(slip > 0){ slipTxt = '+'+slip+(slip===1?' zi':' zile')+' peste termen'; slipCol = '#a8483a'; }
        else if(slip === 0){ slipTxt = 'fix pe termen'; slipCol = '#3d7a52'; }
        else { slipTxt = (-slip)+(slip===-1?' zi':' zile')+' în avans'; slipCol = '#3d7a52'; }
      }

      var segHtml = '';
      real.forEach(function(ph, i){
        var l = x(ph.start), w = Math.max(3, x(ph.end) - l);
        var shape = real.length === 1 ? ' seg-only' : (i === 0 ? ' seg-first' : (i === real.length - 1 ? ' seg-last' : ''));
        var cls = 'gantt-seg seg-'+ph.kind+shape + (ph.status==='current' ? ' is-current' : '') + (ph.status==='done' ? ' seg-done' : '');
        var inner = (w > 56 ? GANTT_PHASE_LABEL[ph.kind] : '');
        if(ph.status === 'current' && !curOverdue && today > ph.start){
          // wash out the part not done yet (today → end of phase)
          var doneW = Math.min(w, Math.max(0, x(today) - l));
          inner += '<span class="gantt-seg-remain" style="left:'+doneW+'px; right:0"></span>';
        }
        segHtml += '<div class="'+cls+'" data-open="'+p.id+'" style="left:'+l+'px; width:'+w+'px" title="'+
          esc(GANTT_PHASE_LABEL[ph.kind]+' · '+(ph.status==='done'?'gata':ph.status==='current'?'în lucru':'de făcut')+' · '+isoOf(ph.start)+' → '+isoOf(ph.end))+'">'+inner+'</div>';
        if(ph.status !== 'done'){
          segHtml += '<div class="gantt-handle" data-handle="'+p.id+'" data-phase="'+ph.kind+'" style="left:'+x(ph.end)+'px" title="Trage capătul fazei '+esc(GANTT_PHASE_LABEL[ph.kind])+'"></div>';
        }
      });

      rows += '<div class="gantt-row">';
      rows += '<div class="gantt-label" data-open="'+p.id+'"><span class="g-code">'+esc(p.cod)+'</span><span class="g-client">'+esc(p.client)+'</span>'+
        (slipTxt ? '<span class="g-slip" style="color:'+slipCol+'">'+slipTxt+'</span>' : '')+'</div>';
      rows += '<div class="gantt-track" style="width:'+trackW+'px; height:40px;">';
      rows += '<div class="gantt-today-line" style="left:'+todayX+'px"></div>';
      rows += segHtml;
      if(curOverdue){
        rows += '<div class="gantt-overdue" style="left:'+x(curEnd)+'px; width:'+Math.max(3,(x(today)-x(curEnd)))+'px" title="Faza a depășit planul cu '+daysBetween(curEnd,today)+' zile"></div>';
      }
      if(termen && effEnd > termen){
        rows += '<div class="gantt-overshoot" style="left:'+x(termen)+'px; width:'+(x(effEnd)-x(termen))+'px">+'+daysBetween(termen,effEnd)+'z</div>';
      }
      if(termen) rows += '<div class="gantt-deadline" style="left:'+x(termen)+'px"></div>';
      rows += '</div></div>';
    });

    var toolbar = '<div class="gantt-toolbar"><div class="gantt-zoom">'+
      '<button data-gz="day" class="'+(ganttZoom==='day'?'active':'')+'">Zi</button>'+
      '<button data-gz="week" class="'+(ganttZoom==='week'?'active':'')+'">Săptămână</button>'+
      '<button data-gz="month" class="'+(ganttZoom==='month'?'active':'')+'">Lună</button>'+
      '</div><span class="gantt-hint">Fazele terminate (hașurat) și cea în lucru se iau din hartă; fazele viitoare le tragi de mâner. Dungă roșie = faza a depășit planul · ⚑ termen · linia roșie verticală = azi.</span></div>';

    var html = toolbar + '<div class="gantt-wrap"><div style="min-width:'+(210+trackW)+'px;">';
    html += '<div class="gantt-row gantt-row-header"><div class="gantt-label"><span class="g-code">Proiect</span></div>';
    html += '<div class="gantt-header-days" style="width:'+trackW+'px;">'+headCells+'</div></div>';
    html += rows + '</div></div>';
    board.innerHTML = html;

    ganttDragCtx = { minDate: minDate, dayW: dayW };
    document.querySelectorAll('[data-gz]').forEach(function(b){
      b.addEventListener('click', function(){ ganttZoom = b.dataset.gz; render(); });
    });
    document.querySelectorAll('.gantt-label[data-open], .gantt-seg[data-open]').forEach(function(el){
      el.addEventListener('click', function(e){ if(e.target.closest('.gantt-handle')) return; openProjectModal(el.dataset.open); });
    });
    document.querySelectorAll('.gantt-handle[data-handle]').forEach(function(h){
      h.addEventListener('mousedown', function(e){
        e.preventDefault();
        ganttDrag = { id: h.dataset.handle, phase: h.dataset.phase, el: h, startX: e.clientX, origLeft: parseFloat(h.style.left) || 0 };
        var tip = document.createElement('div'); tip.className = 'gantt-drag-tip'; tip.id = 'gantt-drag-tip';
        document.body.appendChild(tip);
        document.body.style.userSelect = 'none';
        ganttDragMove(e);
      });
    });
  }
  function ganttDragIso(px){
    var days = Math.max(0, Math.round(px / ganttDragCtx.dayW));
    return isoOf(addDays(ganttDragCtx.minDate, days));
  }
  function ganttDragMove(e){
    if(!ganttDrag || !ganttDragCtx) return;
    var p = state.projects.find(function(x){ return x.id === ganttDrag.id; });
    if(!p) return;
    var newLeft = Math.max(0, ganttDrag.origLeft + (e.clientX - ganttDrag.startX));
    ganttDrag.el.style.left = newLeft + 'px';
    var d = parseDate(ganttDragIso(newLeft)), termen = parseDate(p.termen);
    var label = (GANTT_PHASE_LABEL[ganttDrag.phase] || 'Fază') + ' până la: ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    var lastKind = (ganttPhaseDates(p).slice(-1)[0] || {}).kind;
    if(termen && ganttDrag.phase === lastKind){
      var slip = daysBetween(termen, d);
      label += slip > 0 ? '  ·  +' + slip + 'z peste termen' : (slip === 0 ? '  ·  pe termen' : '  ·  ' + (-slip) + 'z în avans');
    }
    var tip = document.getElementById('gantt-drag-tip');
    if(tip){ tip.textContent = label; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 12) + 'px'; }
  }
  window.addEventListener('mousemove', ganttDragMove);
  window.addEventListener('mouseup', function(e){
    if(!ganttDrag) return;
    var p = state.projects.find(function(x){ return x.id === ganttDrag.id; });
    var newLeft = parseFloat(ganttDrag.el.style.left) || 0;
    if(p){
      var k = ganttDrag.phase, order = GANTT_PHASE_ORDER, ki = order.indexOf(k);
      var before = ganttPhaseDates(p);                    // effective phase ends before this drag
      var oldEnd = {}; before.forEach(function(ph){ oldEnd[ph.kind] = ph.end; });
      if(!p.faze) p.faze = {};
      // floor: not before the project start, nor before the previous phase's end
      var floorDate = parseDate(p.createdAt || isoToday());
      for(var a = ki - 1; a >= 0; a--){ if(oldEnd[order[a]]){ floorDate = oldEnd[order[a]]; break; } }
      var val = parseDate(ganttDragIso(newLeft));
      if(val <= floorDate) val = addDays(floorDate, 1);
      var deltaMs = val.getTime() - (oldEnd[k] ? oldEnd[k].getTime() : val.getTime());
      p.faze[k] = isoOf(val);
      // shift every later phase by the same amount, keeping its length (the delay ripples down the project)
      var prevEnd = val;
      for(var b = ki + 1; b < order.length; b++){
        var kk = order[b];
        if(!oldEnd[kk]) continue;                          // that phase doesn't exist here
        var shifted = new Date(oldEnd[kk].getTime() + deltaMs);
        var minEnd = addDays(prevEnd, 1);
        if(shifted < minEnd) shifted = minEnd;
        p.faze[kk] = isoOf(shifted);
        prevEnd = shifted;
      }
      saveState();
    }
    var tip = document.getElementById('gantt-drag-tip'); if(tip) tip.remove();
    document.body.style.userSelect = '';
    ganttDrag = null;
    render();
  });

  /* ================= COMENZI (toate materialele de aprovizionat) ================= */
  var comenziShowPrimit = false;
  function renderComenzi(){
    var board = document.getElementById('board');
    board.className = ''; board.style.display = 'block'; board.style.height = '100%';

    var rows = [];
    state.projects.forEach(function(p){
      if(p.finalizat) return;
      (p.orders || []).forEach(function(o){
        if(!comenziShowPrimit && o.status === 'primit') return;
        rows.push({ p: p, o: o });
      });
    });
    // group by supplier
    var groups = {}, order = [];
    rows.forEach(function(r){
      var w = r.o.supplierId ? state.workers.find(function(x){ return x.id === r.o.supplierId; }) : null;
      var key = w ? w.id : '__none__';
      var name = w ? w.name : '— fără furnizor —';
      if(!groups[key]){ groups[key] = { name: name, rows: [] }; order.push(key); }
      groups[key].rows.push(r);
    });
    order.sort(function(a, b){
      if(a === '__none__') return 1; if(b === '__none__') return -1;
      return groups[a].name.localeCompare(groups[b].name);
    });

    var total = rows.length;
    var toBuy = rows.filter(function(r){ return r.o.status === 'de-comandat'; }).length;

    var html = '<div class="toolbar-row"><strong>Comenzi materiale</strong> — ' + total + ' rânduri, ' + toBuy + ' de comandat' +
      '<label style="margin-left:16px;"><input type="checkbox" id="cmz-primit" ' + (comenziShowPrimit ? 'checked' : '') + '> Arată și primite</label></div>';

    if(!total){
      html += '<div class="empty-state" style="margin-top:20px;"><h2>Nicio comandă</h2><p>Adaugă materiale în panoul „Comenzi materiale" al fiecărui proiect (marginea stângă a dosarului).</p></div>';
      board.innerHTML = html;
      var cb0 = document.getElementById('cmz-primit');
      if(cb0) cb0.addEventListener('change', function(e){ comenziShowPrimit = e.target.checked; render(); });
      return;
    }

    html += '<div class="table-wrap"><table class="proj-table comenzi-table">';
    html += '<thead><tr><th>Stare</th><th>Ce se comandă</th><th>Cant.</th><th>Furnizor</th><th>Proiect</th><th></th></tr></thead>';
    order.forEach(function(gk){
      var g = groups[gk];
      html += '<tbody><tr class="comenzi-group"><td colspan="6">' + esc(g.name) + ' <span class="comenzi-group-n">' + g.rows.length + '</span></td></tr>';
      g.rows.forEach(function(r){
        var key = r.p.id + '::' + r.o.id;
        html += '<tr>';
        html += '<td><button type="button" class="order-status order-status-' + r.o.status + '" data-order-status="' + key + '" title="Schimbă starea">' + ORDER_STATUS_LABEL[r.o.status] + '</button></td>';
        html += '<td><input class="cmz-inp" data-order-edit="' + key + '" data-field="text" value="' + esc(r.o.text || '') + '" placeholder="Ce se comandă"></td>';
        html += '<td style="width:80px;"><input class="cmz-inp" data-order-edit="' + key + '" data-field="qty" value="' + esc(r.o.qty || '') + '" placeholder="Cant."></td>';
        html += '<td style="width:150px;"><select class="cmz-inp" data-order-edit="' + key + '" data-field="supplierId">' + supplierOptionsHtml(r.o.supplierId || '') + '</select></td>';
        html += '<td class="cmz-proj" data-open-project="' + r.p.id + '"><span class="t-code">' + esc(r.p.cod) + '</span><span class="traseu-client">' + esc(r.p.client) + '</span></td>';
        html += '<td style="width:34px;"><button type="button" class="order-del" data-order-del="' + key + '" title="Șterge rândul">×</button></td>';
        html += '</tr>';
      });
      html += '</tbody>';
    });
    html += '</table></div>';
    board.innerHTML = html;

    var cb = document.getElementById('cmz-primit');
    if(cb) cb.addEventListener('change', function(e){ comenziShowPrimit = e.target.checked; render(); });
    board.querySelectorAll('[data-order-status]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var f = findOrderByKey(btn.dataset.orderStatus);
        if(!f) return;
        var i = ORDER_STATUSES.indexOf(f.order.status);
        f.order.status = ORDER_STATUSES[(i + 1) % ORDER_STATUSES.length];
        saveState(); render();
      });
    });
    board.querySelectorAll('[data-order-edit]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var f = findOrderByKey(inp.dataset.orderEdit);
        if(!f) return;
        f.order[inp.dataset.field] = inp.tagName === 'SELECT' ? inp.value : inp.value.trim();
        saveState();
        if(inp.dataset.field === 'supplierId') render(); // moves between groups
      });
    });
    board.querySelectorAll('[data-order-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var f = findOrderByKey(btn.dataset.orderDel);
        if(!f) return;
        if(f.order.text && !confirm('Ștergi rândul „' + f.order.text + '”?')) return;
        f.project.orders = f.project.orders.filter(function(x){ return x.id !== f.order.id; });
        saveState(); render();
      });
    });
    board.querySelectorAll('[data-open-project]').forEach(function(td){
      td.addEventListener('click', function(){ openProjectModal(td.dataset.openProject); });
    });
  }

  /* ================= FINALIZATE + ISTORIC ================= */
  function renderFinalizatDetail(p){
    var h = '<div class="fin-detail-box">';
    if((p.pieces||[]).length){
      h += '<div class="fin-sec"><b>Piese:</b> ' + (p.pieces||[]).map(function(pc){
        var loc = pc.stationId === PIECE_MONTAJ ? 'montaj' : ((stationByIdFor(p, pc.stationId) || {}).name || 'proiectare');
        return esc(pc.name) + (pc.colorCode ? ' (' + esc(pc.colorCode) + ')' : '') + ' — ' + esc(loc);
      }).join(' · ') + '</div>';
    }
    var team = assignmentsForTask(p.id, MONTAJ_TEAM).map(function(a){
      var w = state.workers.find(function(x){ return x.id === a.workerId; }); return w ? w.name : null;
    }).filter(Boolean);
    if(team.length) h += '<div class="fin-sec"><b>Echipă montaj:</b> ' + esc(team.join(', ')) + '</div>';
    if((p.orders||[]).length){
      h += '<div class="fin-sec"><b>Comenzi:</b> ' + (p.orders||[]).map(function(o){
        var s = state.workers.find(function(x){ return x.id === o.supplierId; });
        return esc(o.text || '?') + (o.qty ? ' (' + esc(o.qty) + ')' : '') + (s ? ' — ' + esc(s.name) : '') + ' [' + esc(ORDER_STATUS_LABEL[o.status] || o.status || '') + ']';
      }).join(' · ') + '</div>';
    }
    if((p.montajNotes||'').trim()) h += '<div class="fin-sec"><b>Necesar montaj:</b><br>' + esc(p.montajNotes).replace(/\n/g,'<br>') + '</div>';
    if((p.notite||'').trim()) h += '<div class="fin-sec"><b>Notițe:</b> ' + esc(p.notite) + '</div>';
    h += '<div class="field-hint">Creat: ' + esc(p.createdAt || '?') + (p.tip ? ' · ' + esc(p.tip) : '') + '</div>';
    h += '</div>';
    return h;
  }
  function loadFinLog(){
    var box = document.getElementById('fin-log');
    if(!box) return;
    if(!hasFirebase){ box.innerHTML = '<div class="col-empty" style="padding:16px;">Istoric indisponibil (fără Firebase).</div>'; return; }
    logUrl().then(function(u){ return fetch(u); }).then(function(r){ return r.json(); }).then(function(raw){
      var entries = [];
      if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
      entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? 1 : -1; });
      if(!entries.length){ box.innerHTML = '<div class="col-empty" style="padding:16px;">Nimic în istoric încă.</div>'; return; }
      box.innerHTML = '<table class="proj-table"><tbody>' + entries.slice(0, 400).map(function(e){
        return '<tr><td style="white-space:nowrap; color:var(--ink-faint); font-size:11.5px;">' + esc(fmtDateTime(e.ts)) + '</td>' +
          '<td style="white-space:nowrap;"><span class="fin-log-type">' + esc(LOG_LABEL[e.type] || e.type || '') + '</span></td>' +
          '<td>' + esc(e.text || '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    }).catch(function(){ box.innerHTML = '<div class="col-empty" style="padding:16px;">Nu s-a putut încărca istoricul.</div>'; });
  }
  function renderFinalizate(){
    var board = document.getElementById('board');
    board.className = ''; board.style.display = 'block'; board.style.height = '100%';
    var list = state.projects.filter(function(p){ return p.finalizat; }).slice()
      .sort(function(a, b){
        var ka = a.finalizatAt || a.createdAt || '', kb = b.finalizatAt || b.createdAt || '';
        return ka < kb ? 1 : (ka > kb ? -1 : 0);
      });

    var html = '<div class="toolbar-row"><strong>Proiecte finalizate</strong> — ' + list.length + '</div>';
    if(!list.length){
      html += '<div class="empty-state" style="margin-top:16px;"><h2>Niciun proiect finalizat</h2><p>Când apeși „Finalizează proiect ✓" pe un dosar, ajunge aici.</p></div>';
    } else {
      html += '<div class="table-wrap" style="max-height:50vh;"><table class="proj-table"><thead><tr><th>Cod</th><th>Client</th><th>Termen</th><th>Finalizat</th><th></th></tr></thead><tbody>';
      list.forEach(function(p){
        html += '<tr><td class="t-code">' + esc(p.cod) + '</td><td>' + esc(p.client) + '</td><td>' + esc(p.termen || '—') + '</td><td>' + (p.finalizatAt ? esc(fmtDateTime(p.finalizatAt)) : '—') + '</td>' +
          '<td style="white-space:nowrap;"><button class="btn btn-xs" data-fin-view="' + p.id + '">Vezi</button> <button class="btn btn-xs btn-ghost" data-reopen-fin="' + p.id + '">Redeschide</button></td></tr>';
        html += '<tr class="fin-detail" data-fin-detail="' + p.id + '" style="display:none;"><td colspan="5">' + renderFinalizatDetail(p) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="toolbar-row" style="margin-top:20px;"><strong>Istoric</strong><button class="btn btn-xs btn-ghost" id="fin-log-export" style="margin-left:auto;">Exportă (.txt)</button></div>';
    html += '<div class="table-wrap" id="fin-log" style="max-height:40vh;"><div class="col-empty" style="padding:16px;">Se încarcă…</div></div>';
    board.innerHTML = html;

    board.querySelectorAll('[data-fin-view]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var d = board.querySelector('.fin-detail[data-fin-detail="' + btn.dataset.finView + '"]');
        if(d) d.style.display = (d.style.display === 'none') ? '' : 'none';
      });
    });
    board.querySelectorAll('[data-reopen-fin]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var p = projectById(btn.dataset.reopenFin);
        if(!p) return;
        p.finalizat = false;
        logEvent('redeschis', p.cod + ' · ' + p.client);
        saveState(); render();
      });
    });
    var exp = document.getElementById('fin-log-export');
    if(exp) exp.addEventListener('click', function(){
      if(!hasFirebase){ alert('Istoric indisponibil — fără Firebase.'); return; }
      logUrl().then(function(u){ return fetch(u); }).then(function(r){ return r.json(); }).then(function(raw){
        var entries = [];
        if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
        entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? -1 : 1; });
        var lines = entries.length
          ? entries.map(function(e){ return fmtDateTime(e.ts) + '  [' + (LOG_LABEL[e.type] || e.type || '') + ']  ' + (e.text || ''); })
          : ['Istoric gol.'];
        var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'istoric-atelier-' + isoToday() + '.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(){ alert('Nu s-a putut încărca istoricul.'); });
    });
    loadFinLog();
  }

  /* ================= REPARAȚII ================= */
  var REPAIR_STATUSES = [
    {id:'deschisa', name:'Deschisă'},
    {id:'in-lucru', name:'În lucru'},
    {id:'rezolvata', name:'Rezolvată'}
  ];
  function renderReparatii(){
    var board = document.getElementById('board');
    board.style.display='flex'; board.className='board';

    if(state.repairs.length === 0){
      board.innerHTML = '<div class="empty-state" style="margin:auto;"><h2>Nicio reparație înregistrată</h2><p>Când un proiect vechi are o problemă — balama cedată, vopsea zgâriată — deschide o reparație aici, legată de codul proiectului original.</p><button class="btn btn-primary" id="empty-add-r">+ Reparație nouă</button></div>';
      document.getElementById('empty-add-r').onclick = function(){ openRepairModal(null); };
      return;
    }

    var html = '';
    REPAIR_STATUSES.forEach(function(status, idx){
      var items = state.repairs.filter(function(r){ return r.status===status.id && matchesSearch(r.cod, r.client); });
      html += '<div class="column proiect" data-rstatus="'+status.id+'" style="animation-delay:'+(idx*40)+'ms">';
      html += '<div class="col-head"><div class="col-title" style="padding:2px 0;">'+esc(status.name)+'</div><span class="col-count">'+items.length+'</span></div>';
      html += '<div class="col-body" data-rstatus="'+status.id+'">';
      if(items.length===0) html += '<div class="col-empty">Nimic aici.</div>';
      else items.forEach(function(r){
        var si = REPAIR_STATUSES.findIndex(function(s){ return s.id===r.status; });
        html += '<div class="repair-card" draggable="true" data-repair="'+r.id+'">';
        html += '<div class="r-code">'+esc(r.cod)+'</div><div class="r-client">'+esc(r.client)+'</div>';
        html += '<div class="r-desc">'+esc(r.descriere)+'</div><div class="r-date">'+esc(r.data)+'</div>';
        html += '<div class="piece-nav">';
        html += '<button data-rmove="'+r.id+'" data-dir="prev" '+(si>0?'':'disabled')+'>‹ înapoi</button>';
        html += '<button data-rmove="'+r.id+'" data-dir="next" '+(si<REPAIR_STATUSES.length-1?'':'disabled')+'>înainte ›</button>';
        html += '</div>';
        html += '<div class="card-actions" style="margin-top:8px;"><button class="btn btn-xs" data-redit="'+r.id+'">Editează</button><button class="btn btn-xs btn-danger-outline" data-rdel="'+r.id+'">Șterge</button></div>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    board.innerHTML = html;

    document.querySelectorAll('[data-rmove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var r = state.repairs.find(function(x){ return x.id===btn.dataset.rmove; });
        if(!r) return;
        var idx = REPAIR_STATUSES.findIndex(function(s){ return s.id===r.status; });
        var newIdx = btn.dataset.dir==='next' ? idx+1 : idx-1;
        if(newIdx>=0 && newIdx<REPAIR_STATUSES.length){ r.status = REPAIR_STATUSES[newIdx].id; saveState(); render(); }
      });
    });
    document.querySelectorAll('[data-redit]').forEach(function(btn){ btn.addEventListener('click', function(){ openRepairModal(btn.dataset.redit); }); });
    document.querySelectorAll('[data-rdel]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var r = state.repairs.find(function(x){ return x.id===btn.dataset.rdel; });
        if(r && confirm('Ștergi reparația pentru '+r.cod+'?')){ state.repairs = state.repairs.filter(function(x){ return x.id!==r.id; }); saveState(); render(); }
      });
    });
    document.querySelectorAll('.repair-card[draggable="true"]').forEach(function(card){
      card.addEventListener('dragstart', function(e){ draggingData = card.dataset.repair; card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.repair); });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); draggingData=null; });
    });
    document.querySelectorAll('.col-body[data-rstatus]').forEach(function(col){
      col.addEventListener('dragover', function(e){ e.preventDefault(); col.closest('.column').classList.add('drag-over'); });
      col.addEventListener('dragleave', function(){ col.closest('.column').classList.remove('drag-over'); });
      col.addEventListener('drop', function(e){
        e.preventDefault();
        col.closest('.column').classList.remove('drag-over');
        var id = e.dataTransfer.getData('text/plain') || draggingData;
        var r = state.repairs.find(function(x){ return x.id===id; });
        if(r){ r.status = col.dataset.rstatus; saveState(); render(); }
      });
    });
  }

  function openRepairModal(repairId){
    var editing = !!repairId;
    var r = editing ? state.repairs.find(function(x){ return x.id===repairId; }) : null;
    var root = document.getElementById('modal-root');
    var codes = state.projects.map(function(p){ return p.cod; });

    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>'+(editing?'Editează reparație':'Reparație nouă')+'</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field"><label>Cod proiect original</label><input id="rf-cod" list="codes-list" value="'+esc(editing?r.cod:'')+'" placeholder="ex: P-2026-004"><datalist id="codes-list">'+codes.map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div>';
    html += '<div class="field"><label>Client</label><input id="rf-client" value="'+esc(editing?r.client:'')+'"></div>';
    html += '<div class="field"><label>Descriere problemă</label><textarea id="rf-desc" placeholder="ex: balama cedată la poarta din curte">'+esc(editing?r.descriere:'')+'</textarea></div>';
    html += '</div><div class="modal-foot"><div class="left">';
    if(editing) html += '<button class="btn btn-danger-outline" id="btn-del-repair">Șterge</button>';
    html += '</div><div><button class="btn btn-ghost" id="btn-cancel">Anulează</button> <button class="btn btn-primary" id="btn-save-repair">'+(editing?'Salvează':'Adaugă reparație')+'</button></div></div></div></div>';
    root.innerHTML = html;

    var codeInput = document.getElementById('rf-cod');
    codeInput.addEventListener('change', function(){
      if(editing) return;
      var match = state.projects.find(function(p){ return p.cod === codeInput.value.trim(); });
      if(match) document.getElementById('rf-client').value = match.client;
    });

    function close(){ root.innerHTML=''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează
    if(editing) document.getElementById('btn-del-repair').addEventListener('click', function(){
      if(confirm('Ștergi această reparație?')){ state.repairs = state.repairs.filter(function(x){ return x.id!==r.id; }); saveState(); close(); render(); }
    });
    document.getElementById('btn-save-repair').addEventListener('click', function(){
      var cod = document.getElementById('rf-cod').value.trim();
      var client = document.getElementById('rf-client').value.trim();
      var desc = document.getElementById('rf-desc').value.trim();
      if(!cod || !client || !desc){ alert('Completează cod, client și descrierea problemei.'); return; }
      if(editing){ r.cod=cod; r.client=client; r.descriere=desc; }
      else state.repairs.push({id:uid(), cod:cod, client:client, descriere:desc, data:isoToday(), status:'deschisa'});
      saveState(); close(); render();
    });
  }

  /* ================= MODAL: feedback ================= */
  function openFeedbackModal(){
    var root = document.getElementById('modal-root');
    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>Feedback</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field"><label>Mesajul tău</label><textarea id="fb-text" placeholder="Ce observi, ce ai vrea schimbat, ce nu merge…" style="min-height:110px;"></textarea></div>';
    html += '<div class="field-hint" id="fb-status" style="margin:0;"></div>';
    html += '</div><div class="modal-foot"><div class="left"><button class="btn btn-ghost btn-sm" id="fb-export">Exportă tot (.txt)</button></div>';
    html += '<div><button class="btn btn-ghost" id="btn-cancel">Închide</button> <button class="btn btn-primary" id="fb-send">Trimite</button></div></div></div></div>';
    root.innerHTML = html;

    function close(){ root.innerHTML=''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează

    document.getElementById('fb-send').addEventListener('click', function(){
      var text = document.getElementById('fb-text').value.trim();
      var statusEl = document.getElementById('fb-status');
      if(!text) return;
      if(!hasFirebase){ statusEl.textContent = 'Feedback indisponibil — nu e configurat Firebase.'; return; }
      var sendBtn = document.getElementById('fb-send');
      sendBtn.disabled = true;
      feedbackUrl().then(function(url){
        return fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({text: text, ts: new Date().toISOString()})
        });
      }).then(function(res){
        if(!res.ok) throw new Error('feedback send failed');
        close();
        showToast('✓');
      }).catch(function(){
        statusEl.textContent = 'Nu s-a putut trimite. Încearcă din nou.';
        sendBtn.disabled = false;
      });
    });

    document.getElementById('fb-export').addEventListener('click', function(){
      if(!hasFirebase){ alert('Feedback indisponibil — nu e configurat Firebase.'); return; }
      feedbackUrl().then(function(url){ return fetch(url); }).then(function(res){ return res.json(); }).then(function(raw){
        var entries = [];
        if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
        entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? -1 : 1; });
        var lines = entries.length
          ? entries.map(function(e){ return '[' + (e.ts||'?') + ']\n' + (e.text||'') + '\n'; })
          : ['Niciun feedback trimis încă.'];
        var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'feedback-atelier-' + isoToday() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(){ alert('Nu s-a putut încărca feedback-ul.'); });
    });
  }

  /* ================= MODAL: proiect ================= */
  function openProjectModal(projectId){
    var editing = !!projectId;
    var proj = editing ? state.projects.find(function(p){ return p.id===projectId; }) : null;
    var nextNum = state.projects.length + 1;
    var suggestedCode = 'P-' + new Date().getFullYear() + '-' + (nextNum<10?'0'+nextNum:nextNum);

    var root = document.getElementById('modal-root');

    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>'+(editing?'Editează proiect':'Proiect nou')+'</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field-row"><div class="field"><label>Cod proiect</label><input id="f-cod" value="'+esc(editing?proj.cod:suggestedCode)+'"></div>';
    html += '<div class="field"><label>Termen limită</label><input type="date" id="f-termen" value="'+esc(editing?proj.termen:'')+'"></div></div>';
    html += '<div class="field"><label>Client</label><input id="f-client" value="'+esc(editing?proj.client:'')+'" placeholder="Nume client"></div>';

    var proiectStations = (editing ? stationsFor(proj) : state.stations).filter(function(s){ return s.type==='proiect'; });
    var showStageField = (!editing) || !proj.finalizat;
    if(showStageField && proiectStations.length){
      html += '<div class="field"><label>Etapă curentă</label><select id="f-stage">' + proiectStations.map(function(s){
        var sel = editing ? (proj.stationId===s.id) : (s.id===proiectStations[0].id);
        return '<option value="'+s.id+'" '+(sel?'selected':'')+'>'+esc(s.name)+'</option>';
      }).join('') + '</select><div class="field-hint">Poți defini piesele acum, chiar dacă proiectul e încă la ofertare — piesele pornesc spre producție doar cele pe care le trimiți tu, una câte una.</div></div>';
    }

    html += '<div class="field"><label>Tip lucrare</label><input id="f-tip" value="'+esc(editing?(proj.tip||''):'')+'" placeholder="ex: Balustradă, Poartă, Tâmplărie ușă…"></div>';

    html += '<div class="field"><label>Notițe</label><textarea id="f-notite" placeholder="Detalii, cotă, observații…">'+esc(editing?(proj.notite||''):'')+'</textarea></div>';
    html += '<div class="field"><label>Listă piese</label><div class="pieces-editor" id="pieces-editor"></div>';
    html += '<button type="button" class="btn btn-sm btn-ghost" id="btn-add-piece" style="margin-top:8px;">+ Adaugă piesă</button>';
    html += '<div class="field-hint">Piesele pornesc „La proiectare" — le trimiți individual în producție din sublista de pe cardul proiectului, când sunt gata.</div>';
    html += '</div></div>';

    html += '<div class="modal-foot"><div class="left">';
    if(editing) html += '<button class="btn btn-danger-outline" id="btn-del-project">Șterge proiect</button>';
    html += '</div><div><button class="btn btn-ghost" id="btn-cancel">Anulează</button> <button class="btn btn-primary" id="btn-save">'+(editing?'Salvează':'Adaugă proiect')+'</button></div></div></div></div>';
    root.innerHTML = html;

    var piecesEditor = document.getElementById('pieces-editor');
    function addPieceRow(pieceId, name, stationId, colorCode){
      var row = document.createElement('div');
      row.className = 'piece-row';
      row.dataset.id = pieceId || uid();
      row.dataset.stationId = stationId || '';
      row.innerHTML = '<input class="piece-name" value="'+esc(name||'')+'" placeholder="Denumire piesă (ex: stâlp 40x40, 1.2m)"><input class="piece-color" value="'+esc(colorCode||'')+'" placeholder="Cod culoare"><button type="button" class="btn-remove-piece">×</button>';
      row.querySelector('.btn-remove-piece').addEventListener('click', function(){ row.remove(); });
      piecesEditor.appendChild(row);
      return row;
    }
    if(editing && proj.pieces && proj.pieces.length) proj.pieces.forEach(function(pc){ addPieceRow(pc.id, pc.name, pc.stationId, pc.colorCode); });
    document.getElementById('btn-add-piece').addEventListener('click', function(){ addPieceRow(null,'').querySelector('input').focus(); });

    function close(){ root.innerHTML=''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează
    if(editing) document.getElementById('btn-del-project').addEventListener('click', function(){
      if(confirm('Ștergi proiectul '+proj.cod+'?')){ state.projects = state.projects.filter(function(p){ return p.id!==proj.id; }); saveState(); close(); render(); }
    });

    document.getElementById('btn-save').addEventListener('click', function(){
      var cod = document.getElementById('f-cod').value.trim();
      var client = document.getElementById('f-client').value.trim();
      var termen = document.getElementById('f-termen').value;
      if(!cod || !client || !termen){ alert('Completează cod, client și termen limită.'); return; }
      var tip = document.getElementById('f-tip').value.trim();
      var notite = document.getElementById('f-notite').value.trim();

      var pieces = [];
      piecesEditor.querySelectorAll('.piece-row').forEach(function(row){
        var name = row.querySelector('.piece-name').value.trim();
        if(!name) return;
        var colorCode = row.querySelector('.piece-color').value.trim();
        pieces.push({id: row.dataset.id, name: name, stationId: row.dataset.stationId || null, colorCode: colorCode});
      });

      if(editing){
        proj.cod=cod; proj.client=client; proj.termen=termen; proj.tip=tip;
        proj.notite=notite; proj.pieces=pieces;
        var stageSel = document.getElementById('f-stage');
        if(stageSel){ proj.stationId = stageSel.value; proj.lane = null; }
      } else {
        var stageSelNew = document.getElementById('f-stage');
        var newStations = JSON.parse(JSON.stringify(state.stations || []));
        var firstProiect = newStations.filter(function(s){ return s.type==='proiect'; })[0];
        state.projects.push({
          id: uid(), cod:cod, client:client, termen:termen, tip:tip,
          stations: newStations,
          stationId: stageSelNew ? stageSelNew.value : (firstProiect ? firstProiect.id : null),
          finalizat:false, notite:notite, pieces:pieces, orders:[], montajNotes:'', createdAt: isoToday()
        });
        logEvent('proiect-nou', cod + ' · ' + client);
      }
      saveState(); close(); render();
    });
  }

  function makeSidebarController(asideId, handleId, closeId, hideDelay, pinStorageKey){
    var timer = null;
    var aside = document.getElementById(asideId);
    var handle = document.getElementById(handleId);
    var closeBtn = document.getElementById(closeId);
    var pinned = false;
    var wasVisible = false;
    try { pinned = localStorage.getItem(pinStorageKey) === '1'; } catch(e){ /* ignore */ }
    function trackMobileVisibility(){
      var visible = aside.classList.contains('visible');
      if(isMobile() && visible !== wasVisible) updateBackdrop(visible ? 1 : -1);
      wasVisible = visible;
    }
    function show(){
      aside.classList.add('visible');
      trackMobileVisibility();
      clearTimeout(timer);
      // on mobile there's no hover-out to trigger auto-hide, so it must stay open until explicitly closed
      if(!pinned && !isMobile()) timer = setTimeout(hide, hideDelay);
    }
    function hide(){
      if(pinned) return;
      aside.classList.remove('visible');
      trackMobileVisibility();
    }
    function isPinned(){ return pinned; }
    function setPinned(val){
      pinned = val;
      try { localStorage.setItem(pinStorageKey, pinned ? '1' : '0'); } catch(e){ /* ignore */ }
      aside.classList.toggle('pinned', pinned);
      if(pinned){ clearTimeout(timer); aside.classList.add('visible'); trackMobileVisibility(); }
      else { timer = setTimeout(hide, hideDelay); }
    }
    aside.classList.toggle('pinned', pinned);
    aside.addEventListener('mouseenter', function(){ clearTimeout(timer); aside.classList.add('visible'); trackMobileVisibility(); });
    aside.addEventListener('mouseleave', function(){ if(!pinned) timer = setTimeout(hide, 1200); });
    handle.addEventListener('mouseenter', show);
    handle.addEventListener('click', show);
    if(closeBtn) closeBtn.addEventListener('click', hide);
    return { show: show, hide: hide, clearTimer: function(){ clearTimeout(timer); }, isPinned: isPinned, setPinned: setPinned };
  }
  var teamSidebarCtrl = makeSidebarController('team-sidebar', 'sidebar-handle', 'sidebar-close', 3000, 'panou-pin-echipa');
  var supplierSidebarCtrl = makeSidebarController('supplier-sidebar', 'supplier-handle', 'supplier-close', 3000, 'panou-pin-furnizori');
  sidebarBackdrop.addEventListener('click', function(){ teamSidebarCtrl.hide(); supplierSidebarCtrl.hide(); });

  function updateSidebarForTab(){
    var aside1 = document.getElementById('team-sidebar');
    var aside2 = document.getElementById('supplier-sidebar');
    var main = document.getElementById('main');
    if(tab === 'hala'){
      aside1.style.display = 'flex';
      aside2.style.display = 'flex';
      main.classList.add('sidebar-active');
      main.classList.add('canvas-fullbleed');
      main.style.paddingTop = '';
      // sidebars stay closed until the user hovers/taps the handle — never auto-open
    } else {
      aside1.style.display = 'none';
      aside2.style.display = 'none';
      main.classList.remove('sidebar-active');
      main.classList.remove('canvas-fullbleed');
      // the topbar is position:fixed — push the scrollable content clear of it
      var tb = document.querySelector('.topbar');
      main.style.paddingTop = ((tb ? tb.offsetHeight : 60) + 12) + 'px';
      teamSidebarCtrl.clearTimer();
      supplierSidebarCtrl.clearTimer();
    }
  }

  document.getElementById('search').addEventListener('input', function(e){ searchQuery = e.target.value; render(); });
  document.getElementById('btn-feedback').addEventListener('click', function(){ openFeedbackModal(); });
  document.getElementById('btn-undo').addEventListener('click', doUndo);
  document.getElementById('btn-redo').addEventListener('click', doRedo);
  document.addEventListener('keydown', function(e){
    if(!(e.ctrlKey || e.metaKey)) return;
    var k = (e.key || '').toLowerCase();
    if(k !== 'z' && k !== 'y') return;
    var a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; // let the field's native text undo win
    e.preventDefault();
    if(k === 'y' || e.shiftKey) doRedo(); else doUndo();
  });
  document.getElementById('btn-add-list').addEventListener('click', addChecklist);
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      if(tab === b.dataset.tab) return;
      tab = b.dataset.tab;
      document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('active', x === b); });
      setAddButton();
      updateSidebarForTab();
      render();
    });
  });

  document.getElementById('btn-reset').addEventListener('click', function(){
    if(confirm('Ștergi tot panoul (proiecte, etape, reparații)? Nu se poate anula.')){
      if(confirm('Ești absolut sigur? Toate datele salvate se pierd definitiv.')){
        state = defaultState(); saveState(); render();
      }
    }
  });

  function startApp(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    loadState().then(function(s){
      state = s;
      if(!state.colorHistory) state.colorHistory = ['#f0b878','#a8c8dc','#a8d9b8','#f0dd9a','#d4b8dc','#a8dcc8','#f0b3bd','#b3d0e8'];
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      resetUndoHistory();
      setAddButton();
      updateSidebarForTab();
      render();
      attachLiveSync();
      if(!hasFirebase && !hasCloudStorage) showToast('Mod local — configurează Firebase (vezi comentariul din cod) sau deschide prin Claude.ai, ca șeful tău să vadă aceleași date.', true);
    });
  }

  // Live sync: apply changes other people save, as they happen. Held back only while
  // this user is mid-edit (a field focused or a modal open), then applied on the next tick.
  function userIsBusy(){
    var mr = document.getElementById('modal-root');
    if(mr && mr.children.length) return true;
    if(nodeDragging || canvasDragging) return true;
    var a = document.activeElement;
    if(!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA' && a.tagName !== 'SELECT')) return false;
    // the top-bar search box is a filter, not data entry — it must not block live sync
    return !!(a.closest && a.closest('#board, .team-sidebar'));
  }
  function applyRemote(incoming){
    if(stableStringify(incoming) === stableStringify(state)) return;
    state = incoming;
    noteLocalWrite(stableStringify(state));
    resetUndoHistory(); // a colleague's change invalidates our local undo stack
    setAddButton();
    render();
    showToast('Tablou actualizat — modificări de la un coleg.');
  }
  // A remote change came in while the user was mid-edit — re-fetch the current DB state
  // (not a possibly-stale stashed copy) and apply it now that it's safe.
  function flushRemote(){
    if(!remoteDirty || !hasRtdb || userIsBusy()) return;
    remoteDirty = false;
    dbRef().once('value').then(function(snap){
      var raw = snap.val();
      if(!raw) return;
      try {
        var incoming = resolveVersioned(raw);
        if(recentLocalSigs.indexOf(stableStringify(incoming)) !== -1) return;
        console.log('[sync] aplic modificarea care aștepta');
        applyRemote(incoming);
      } catch(e){ /* ignore */ }
    }).catch(function(){});
  }
  function attachLiveSync(){
    console.log('[sync] hasAuth=' + hasAuth + ' hasRtdb=' + hasRtdb + ' firebase.database=' + (typeof (window.firebase && firebase.database)));
    if(liveSyncAttached) return;
    if(!hasRtdb){ console.warn('[sync] RTDB SDK indisponibil — rămân pe REST (fără actualizări live)'); return; }
    liveSyncAttached = true;
    try {
      firebase.database().ref('.info/connected').on('value', function(s){
        console.log('[sync] ' + (s.val() ? 'conectat la Firebase' : 'offline'));
      });
    } catch(e){ /* ignore */ }
    console.log('[sync] listener live pornit');
    dbRef().on('value', function(snap){
      var raw = snap.val();
      if(!raw) return;
      var incoming;
      try { incoming = resolveVersioned(raw); } catch(e){ console.warn('[sync] snapshot invalid', e); return; }
      var sig = stableStringify(incoming);
      if(recentLocalSigs.indexOf(sig) !== -1 || sig === stableStringify(state)){ return; } // our own echo / no change
      if(userIsBusy()){ console.log('[sync] schimbare primită — o aplic după ce termini editarea'); remoteDirty = true; return; }
      console.log('[sync] schimbare primită de la un coleg — aplic');
      applyRemote(incoming);
    }, function(err){
      console.warn('[sync] listener respins:', err && err.code, err && err.message);
    });
    setInterval(flushRemote, 1000);
    document.addEventListener('focusout', function(){ setTimeout(flushRemote, 60); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(flushRemote, 60); });
  }

  if(hasAuth){
    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type="submit"]');
      var errEl = document.getElementById('login-error');
      var pass = document.getElementById('login-password').value;
      btn.disabled = true;
      errEl.textContent = '';
      firebase.auth().signInWithEmailAndPassword(SHARED_LOGIN_EMAIL, pass).catch(function(){
        errEl.textContent = 'Parolă greșită. Încearcă din nou.';
        btn.disabled = false;
      });
    });
    firebase.auth().onAuthStateChanged(function(user){
      if(user){
        startApp();
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
