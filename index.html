    ORDER_STATUSES.forEach(function(st){ cnt[st] = needs.filter(function(n){ return n.status === st; }).length; });
    var h = '<div class="cmz-bar">';
    h += '<div class="cmz-seg">' + [['','Toate'],['de-comandat','De comandat'],['comandat','Comandat'],['primit','Primit']]
      .map(function(o){
        return '<button type="button" data-cmz="f-st" data-cmzv="' + o[0] + '"' + (cmzFst === o[0] ? ' class="on"' : '') +
          '>' + o[1] + '<i>' + cnt[o[0]] + '</i></button>';
      }).join('') + '</div>';
    h += '<input class="cmz-in" data-cmz="f-q" id="cmz-q" value="' + esc(cmzQ) + '" placeholder="caută material, furnizor, proiect…">';
    h += '<select class="cmz-in" data-cmz="f-s" title="Furnizor"><option value="">toți furnizorii</option>' + supplierOptionsHtml(cmzFs, null) + '</select>';
    h += '<select class="cmz-in" data-cmz="f-p" title="Proiect"><option value="">toate proiectele</option>' + projectOptionsHtml(cmzFp) + '</select>';
    h += '<button type="button" class="btn btn-xs' + (cmzUrg ? ' btn-primary' : '') + '" data-cmz="f-urg" ' +
      'title="Proiect întârziat sau cu termen în ≤7 zile, material încă necomandat">⚑ doar urgente</button>';
    h += '<button type="button" class="btn btn-xs' + (cmzGroup ? ' btn-primary' : '') + '" data-cmz="f-group" ' +
      (cmzFst === 'comandat' ? 'disabled title="Recepția e deja grupată pe comandă"' : 'title="Strânge rândurile sub antet de furnizor"') +
      '>⊞ grupează pe furnizor</button>';
    if(cmzFcmd){
      var oo = cmdById(cmzFcmd);
      h += '<button type="button" class="cmz-chip late" data-cmz="f-cmd-x">' + esc(oo ? oo.nr : 'comandă') + ' ×</button>';
    }
    h += '<span class="sp"></span>';
    h += '<button type="button" class="btn btn-xs btn-ghost" data-cmz="f-clear">curăță filtrele</button>';
    h += '<button type="button" class="btn btn-xs' + (cmzAddOpen ? ' btn-primary' : '') + '" data-cmz="add-toggle">+ Necesar nou</button>';
    h += '</div>';
    if(cmzAddOpen){
      var defP = cmzFp || (state.projects[0] ? state.projects[0].id : '');
      h += '<div class="cmz-addf" data-cmz-form="new"><span class="lbl">Necesar nou</span>' +
        '<input class="cmz-in" data-cmzadd="text" id="cmz-add-text" placeholder="Ce se cumpără — ex. Șuruburi M6×20">' +
        '<input class="cmz-in cmz-num" data-cmzadd="qty" value="1" placeholder="Cant.">' +
        '<select class="cmz-in" data-cmzadd="um" title="Unitate de măsură">' + umOptionsHtml('buc') + '</select>' +
        '<select class="cmz-in" data-cmzadd="projectId" title="Proiect">' + projectOptionsHtml(defP) + '</select>' +
        '<select class="cmz-in" data-cmzadd="supplierId" title="Furnizor">' + supplierOptionsHtml(cmzFs, 'fără furnizor') + '</select>' +
        '<select class="cmz-in" data-cmzadd="altSupplierId" title="Furnizor alternativ">' + supplierOptionsHtml('', 'sau… (alternativ)') + '</select>' +
        '<button type="button" class="btn btn-xs btn-primary" data-cmz="add">Adaugă</button>' +
        '<button type="button" class="btn btn-xs btn-ghost" data-cmz="add-toggle">renunț</button></div>';
    }
    return h;
  }

  /* ---- filtrare + sortare ---- */
  function cmzBaseRows(needs){
    var rows = needs.slice();
    if(cmzFcmd) rows = rows.filter(function(n){ return n.cmdId === cmzFcmd; });
    if(cmzFs) rows = rows.filter(function(n){ return n.supplierId === cmzFs || n.altSupplierId === cmzFs; });
    if(cmzFp) rows = rows.filter(function(n){ return n.projectId === cmzFp; });
    if(cmzUrg) rows = rows.filter(cmzIsUrgent);
    if(cmzQ){
      var q = cmzQ.toLowerCase();
      rows = rows.filter(function(n){
        var cmd = n.cmdId ? (cmdById(n.cmdId) || { nr:'' }).nr : '';
        return (n.text + ' ' + supplierName(n.supplierId) + ' ' + n.projectCod + ' ' + cmd).toLowerCase().indexOf(q) >= 0;
      });
    }
    return rows;
  }
  var CMZ_SORTK = {
    st:   function(n){ return ORDER_STATUSES.indexOf(n.status); },
    text: function(n){ return String(n.text).toLowerCase(); },
    qty:  function(n){ var v = parseFloat(n.qty); return isNaN(v) ? -1 : v; },
    sup:  function(n){ return supplierName(n.supplierId).toLowerCase(); },
    prj:  function(n){ return String(n.projectCod || 'zz').toLowerCase(); },
    urg:  function(n){ var p = n._p; return (!p || !p.termen) ? 99999 : daysBetween(todayDate(), parseDate(p.termen)); }
  };
  function cmzSortRows(rows){
    var f = CMZ_SORTK[cmzSort] || CMZ_SORTK.sup;
    return rows.sort(function(a, b){ var x = f(a), y = f(b); return (x < y ? -1 : (x > y ? 1 : 0)) * cmzDir; });
  }
  // grupurile cu livrare apropiată urcă; cei fără zi fixă cad sub ei; „fără furnizor" la coadă
  function cmzSupRank(k){
    if(k === '__') return ['3', ''];
    var d = nextDeliveryDate(k);
    return d ? ['0' + d, supplierName(k)] : ['1', supplierName(k)];
  }

  /* ---- tabelul ---- */
  var CMZ_COLS = [['st','Stare'],['text','Material'],['qty','Cant.'],[null,'U.M.'],['sup','Furnizor'],
                  [null,'Alt.'],['prj','Proiect'],['urg','Termen']];
  function cmzTheadHtml(rows){
    var pick = rows.filter(function(n){ return n.status === 'de-comandat'; });
    var allOn = pick.length > 0 && pick.every(function(n){ return cmzSel[n.key]; });
    var h = '<thead><tr><th style="width:26px"><input class="cmz-selall" type="checkbox" data-cmz="selall" title="Bifează tot ce e de comandat"' +
      (allOn ? ' checked' : '') + '></th>';
    CMZ_COLS.forEach(function(c){
      if(!c[0]){ h += '<th>' + c[1] + '</th>'; return; }
      var on = cmzSort === c[0];
      h += '<th class="sortable" data-cmz="sort" data-cmzv="' + c[0] + '">' + c[1] +
        (on ? ' <span class="ar">' + (cmzDir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>';
    });
    return h + '<th style="width:62px"></th></tr></thead>';
  }
  function cmzRowHtml(n){
    var p = n._p, L = cmzLateDays(p), s = cmzSoonDays(p);
    var cls = 'row';
    if(L > 0) cls += (n.status === 'de-comandat' ? ' blk' : ' blk-soft');
    if(cmzSel[n.key]) cls += ' on';
    if(n.status === 'primit') cls += ' dimr';
    var cmd = n.cmdId ? cmdById(n.cmdId) : null;
    var h = '<tr class="' + cls + '" data-cmz-row="' + n.key + '">';
    h += '<td>' + (n.status === 'de-comandat'
      ? '<input type="checkbox" data-cmz="sel" data-cmzk="' + n.key + '"' + (cmzSel[n.key] ? ' checked' : '') + ' title="Pune în coș">'
      : '') + '</td>';
    h += '<td>' + cmzStatePill(n) + '</td>';
    h += '<td class="mat"><input class="cmz-in flat" data-cmz="edit" data-cmzfield="text" data-cmzk="' + n.key + '" value="' + esc(n.text) + '" placeholder="Ce se comandă">' +
      (cmd ? '<div class="cmz-matnote">' + esc(cmd.nr) + (n.orderedAt ? ' · ' + esc(fmtShortDate(n.orderedAt)) : '') +
        (n.receivedAt ? ' · primit ' + esc(fmtShortDate(n.receivedAt)) : '') + '</div>' : '') + '</td>';
    h += '<td class="q"><input class="cmz-in flat cmz-num" data-cmz="edit" data-cmzfield="qty" data-cmzk="' + n.key + '" value="' + esc(n.qty) + '" placeholder="—"></td>';
    h += '<td><select class="cmz-in flat" data-cmz="edit" data-cmzfield="um" data-cmzk="' + n.key + '">' + umOptionsHtml(n.um) + '</select></td>';
    h += '<td><select class="cmz-in flat" data-cmz="edit" data-cmzfield="supplierId" data-cmzk="' + n.key + '">' + supplierOptionsHtml(n.supplierId, '—') + '</select></td>';
    h += '<td><select class="cmz-in flat" data-cmz="edit" data-cmzfield="altSupplierId" data-cmzk="' + n.key + '">' + supplierOptionsHtml(n.altSupplierId, '+ alternativ') + '</select></td>';
    h += '<td><select class="cmz-in flat" data-cmz="edit" data-cmzfield="projectId" data-cmzk="' + n.key + '">' + projectOptionsHtml(n.projectId) + '</select></td>';
    h += '<td>' + (p && p.termen
      ? '<span class="cmz-chip' + (L ? ' late' : (s !== null && s <= 4 ? ' soon' : '')) + '">' + (L ? 'întârziat ' + L + 'z' : esc(fmtShortDate(p.termen))) + '</span>'
      : '<span class="cmz-note">—</span>') + '</td>';
    h += '<td class="acts">' +
      (n.altSupplierId ? '<button type="button" class="cmz-icob" data-cmz="swapalt" data-cmzk="' + n.key + '" title="Schimbă furnizorul cu alternativul">↔</button>' : '') +
      '<button type="button" class="cmz-icob" data-cmz="del" data-cmzk="' + n.key + '" title="Șterge rândul">×</button></td>';
    return h + '</tr>';
  }
  function cmzGroupHeadHtml(k, lines){
    var open = lines.filter(function(n){ return n.status === 'de-comandat'; });
    var d = nextDeliveryDate(k);
    var due = !!(d && daysBetween(todayDate(), parseDate(d)) <= 2);
    var sup = k === '__' ? null : supplierById(k);
    var h = '<tr class="grow"><td colspan="10"><div class="cmz-grp' + (due && open.length ? ' due' : '') + '">';
    h += '<span class="nm">' + esc(supplierName(k === '__' ? '' : k)) + '</span>';
    h += '<span class="cat">' + esc(k === '__' ? 'pune un furnizor pe rând ca să poți trimite' : ((sup && sup.taskNote) || '')) + '</span>';
    h += '<span class="when' + (d ? '' : ' pick') + '">' + esc(deliveryLabel(k === '__' ? '' : k)) + '</span>';
    h += '<span class="sp"></span>';
    h += '<span class="cnt">' + lines.length + ' rând' + (lines.length === 1 ? '' : 'uri') + ' · ' + open.length + ' de comandat</span>';
    if(k === '__') h += '<button type="button" class="btn btn-xs" disabled>Trimite comanda</button>';
    else h += '<button type="button" class="btn btn-xs' + (open.length ? ' btn-primary' : '') + '" data-cmz="send-group" data-cmzv="' + k + '"' +
      (open.length ? '' : ' disabled') + '>Trimite comanda</button>';
    return h + '</div></td></tr>';
  }
  function cmzTableHtml(rows){
    var body = '';
    if(!rows.length){
      body = '<tr><td colspan="10" style="text-align:center;color:var(--ink-faint);padding:20px;">' +
        'Niciun rând pentru filtrele astea. <button type="button" class="btn btn-xs btn-ghost" data-cmz="f-clear">curăță filtrele</button></td></tr>';
    } else if(cmzGroup){
      var live = cmzSortRows(rows.filter(function(n){ return n.status !== 'primit'; }));
      var got  = cmzSortRows(rows.filter(function(n){ return n.status === 'primit'; }));
      var g = {}, keys = [];
      live.forEach(function(n){ var k = n.supplierId || '__'; if(!g[k]){ g[k] = []; keys.push(k); } g[k].push(n); });
      keys.sort(function(a, b){
        var ra = cmzSupRank(a), rb = cmzSupRank(b);
        return ra[0] < rb[0] ? -1 : (ra[0] > rb[0] ? 1 : ra[1].localeCompare(rb[1]));
      });
      keys.forEach(function(k){
        body += cmzGroupHeadHtml(k, g[k]);
        g[k].forEach(function(n){ body += cmzRowHtml(n); });
      });
      if(got.length){
        body += '<tr class="grow"><td colspan="10"><div class="cmz-grp got">' +
          '<span class="nm">Primite</span><span class="cat">au ajuns în atelier</span><span class="sp"></span>' +
          '<span class="cnt">' + got.length + ' rând' + (got.length === 1 ? '' : 'uri') + '</span></div></td></tr>';
        got.forEach(function(n){ body += cmzRowHtml(n); });
      }
    } else {
      cmzSortRows(rows).forEach(function(n){ body += cmzRowHtml(n); });
    }
    return '<div class="cmz-tw"><table class="cmz-t">' + cmzTheadHtml(rows) + '<tbody>' + body + '</tbody></table></div>';
  }

  /* ---- recepție: liniile pe drum, grupate pe comanda din care fac parte ---- */
  function cmzReceptionHtml(needs, vis){
    var visKeys = {};
    vis.forEach(function(n){ visKeys[n.key] = true; });
    var open = (state.orders || []).filter(function(o){
      var ls = cmdLines(o.id, needs);
      if(!ls.length) return false;
      if(!ls.some(function(n){ return n.status === 'comandat'; })) return false;
      return ls.some(function(n){ return visKeys[n.key]; });
    }).sort(function(a, b){ return (a.date || '') < (b.date || '') ? -1 : ((a.date || '') > (b.date || '') ? 1 : 0); });

    var h = '<div class="cmz-sect">Pe drum — bifează ce a ajuns</div>';
    if(!open.length) return h + '<div class="cmz-empty">Nimic în curs de livrare pentru filtrele astea.</div>';
    h += '<div class="cmz-track">';
    open.forEach(function(o){
      var ls = cmdLines(o.id, needs), st = orderState(o, needs);
      h += '<div class="cmz-trk' + (st.received === st.total ? ' full' : '') + '"><div class="cmz-trk-h"><span class="nr">' + esc(o.nr) + '</span>' +
        '<span class="sup">' + esc(supplierName(o.supplierId)) + '</span>' +
        '<span class="cmz-note">' + (o.date ? 'trimisă ' + ZI_NAME[parseDate(o.date).getDay()] + ' ' + esc(fmtShortDate(o.date)) : 'comandă veche') + '</span>' +
        '<span class="sp"></span>' +
        '<span class="cmz-prog"><span class="bar"><i style="width:' + Math.round(100 * st.received / st.total) + '%"></i></span>' +
        st.received + '/' + st.total + ' primite</span>' +
        '<span class="cmz-pill ' + st.cls + '">' + st.label + '</span></div>';
      ls.forEach(function(n){
        h += '<div class="cmz-rl' + (n.status === 'primit' ? ' done' : '') + '">' + cmzQtyHtml(n) +
          '<span class="g">' + esc(n.text || '(fără denumire)') + '</span>' + cmzProjChip(n);
        if(n.status === 'primit'){
          h += '<span class="cmz-pill recv">primit ' + esc(n.receivedAt ? fmtShortDate(n.receivedAt) : '') + '</span>' +
            '<button type="button" class="cmz-icob" data-cmz="unreceive" data-cmzk="' + n.key + '" title="Anulează recepția">↺</button>';
        } else {
          h += '<span class="sp" style="flex:0"></span><button type="button" class="btn btn-xs" data-cmz="receive" data-cmzk="' + n.key + '">✓ primit</button>';
        }
        h += '</div>';
      });
      h += '</div>';
    });
    return h + '</div>';
  }

  /* ---- istoric: tot ce a plecat la furnizori ---- */
  function cmzHistoryHtml(needs){
    var list = (state.orders || []).slice().sort(function(a, b){
      var da = a.date || '', db = b.date || '';
      return da < db ? 1 : (da > db ? -1 : (a.nr < b.nr ? 1 : -1));
    });
    var h = '<div><button type="button" class="cmz-hist-h" data-cmz="hist"><span class="ar">' + (cmzHist ? '▾' : '▸') + '</span>' +
      '<b>Comenzi trimise (' + list.length + ')</b>' +
      '<span class="cmz-note">tot ce a plecat la furnizori — număr, dată, cât s-a primit</span>' +
      '<span class="sp"></span>' +
      '<span class="cmz-note">' + (cmzHist ? 'ascunde' : 'arată') + '</span></button>';
    if(!cmzHist) return h + '</div>';
    if(!list.length) return h + '<div class="cmz-hist"><div class="cmz-empty">Nicio comandă trimisă încă.</div></div></div>';
    h += '<div class="cmz-hist">';
    list.forEach(function(o){
      var st = orderState(o, needs), ls = cmdLines(o.id, needs);
      var titles = ls.map(function(n){ return n.text || '(fără denumire)'; }).join(', ');
      if(titles.length > 62) titles = titles.slice(0, 60) + '…';
      h += '<button type="button" class="cmz-hl' + (cmzFcmd === o.id ? ' on' : '') + '" data-cmz="f-cmd" data-cmzv="' + o.id + '">' +
        '<b>' + esc(o.nr) + '</b><span>' + esc(supplierName(o.supplierId)) + '</span>' +
        '<span class="cmz-num">' + esc(o.date ? fmtShortDate(o.date) : '—') + '</span>' +
        '<span class="g cmz-note">' + esc(titles) + '</span>' +
        '<span class="sp"></span>' +
        '<span class="cmz-prog"><span class="bar"><i style="width:' + (st.total ? Math.round(100 * st.received / st.total) : 0) + '%"></i></span>' +
        st.received + '/' + st.total + ' primite</span></button>';
    });
    return h + '</div></div>';
  }

  /* ---- coșul: bifezi rânduri, pleacă o comandă per furnizor ---- */
  function cmzCartKeys(needs){
    var byKey = {};
    (needs || allNeeds()).forEach(function(n){ byKey[n.key] = n; });
    return Object.keys(cmzSel).filter(function(k){
      var n = byKey[k];
      return cmzSel[k] && n && n.status === 'de-comandat';
    });
  }
  function cmzCartHtml(needs){
    needs = needs || allNeeds();
    var byKey = {};
    needs.forEach(function(n){ byKey[n.key] = n; });
    var keys = cmzCartKeys(needs);
    if(!keys.length) return '';
    var g = {}, sups = [];
    keys.forEach(function(k){
      var n = byKey[k], s = n.supplierId || '__';
      if(!g[s]){ g[s] = []; sups.push(s); }
      g[s].push(n);
    });
    var sendable = sups.filter(function(s){ return s !== '__'; });
    var h = '<div class="cmz-cart"><span class="ttl cmz-num">' + keys.length + (keys.length === 1 ? ' rând' : ' rânduri') + ' · ' +
      sups.length + (sups.length === 1 ? ' furnizor' : ' furnizori') + '</span>';
    h += '<span class="grp">' + sups.map(function(s){
      var d = nextDeliveryDate(s);
      return '<span class="cmz-chip sup">' + esc(supplierName(s === '__' ? '' : s)) + ' ×' + g[s].length + (d ? ' · ' + esc(fmtShortDate(d)) : '') + '</span>';
    }).join('') + '</span>';
    h += '<span class="sp"></span>';
    h += '<button type="button" class="btn btn-xs btn-ghost" data-cmz="cart-clear">golește coșul</button>';
    h += '<button type="button" class="btn btn-xs btn-primary" data-cmz="cart-send"' + (sendable.length ? '' : ' disabled') + '>Consolidează în ' +
      sendable.length + (sendable.length === 1 ? ' comandă' : ' comenzi') + '</button></div>';
    return h;
  }
  function cmzPatchCart(){
    var board = document.getElementById('board');
    var old = board.querySelector('.cmz-cart');
    if(old) old.remove();
    var html = cmzCartHtml();
    if(html) board.insertAdjacentHTML('beforeend', html);
  }

  /* ================= randarea tab-ului ================= */
  function renderComenzi(){
    var board = document.getElementById('board');
    board.className = 'cmz';
    board.style.display = 'flex';
    board.style.flexDirection = 'column';
    board.style.alignItems = 'stretch';
    board.style.height = 'auto';
    board.style.minHeight = '100%';

    var needs = allNeeds();
    var openCount = needs.filter(function(n){ return n.status === 'de-comandat'; }).length;
    var wayCount = needs.filter(function(n){ return n.status === 'comandat'; }).length;
    var supSeen = {};
    needs.forEach(function(n){ if(n.status === 'de-comandat') supSeen[n.supplierId || '__'] = 1; });

    var vis = cmzBaseRows(needs);
    var rows = cmzFst ? vis.filter(function(n){ return n.status === cmzFst; }) : vis;

    var h = '';
    h += cmzSignalHtml(needs);
    h += '<div class="cmz-hd"><h2>Comenzi materiale</h2>' +
      '<span class="sub">' + needs.length + ' necesare · ' + openCount + ' de comandat la ' +
      Object.keys(supSeen).length + (Object.keys(supSeen).length === 1 ? ' furnizor' : ' furnizori') + ' · ' + wayCount + ' pe drum</span>' +
      '<span class="sp"></span>' +
      '<span class="cmz-note">Fiecare rând e un necesar. Grupul de furnizor pleacă într-o singură comandă.</span></div>';
    h += cmzFlashHtml();
    h += cmzToolbarHtml(needs);
    h += (cmzFst === 'comandat') ? cmzReceptionHtml(needs, vis) : cmzTableHtml(rows);
    h += cmzHistoryHtml(needs);
    h += renderFurnizoriPanel();
    h += cmzCartHtml(needs);

    board.innerHTML = h;
    attachFurnizoriEvents();
    attachComenziEvents();

    if(cmzFocus){
      var el = document.getElementById(cmzFocus);
      if(el){
        el.focus();
        if(el.setSelectionRange && (el.type === 'text' || !el.type)){ var v = el.value; try { el.setSelectionRange(v.length, v.length); } catch(e){} }
      }
      cmzFocus = null;
    }
  }

  /* ---- formularul „Necesar nou" ---- */
  function cmzReadAddForm(){
    var f = document.querySelector('[data-cmz-form="new"]');
    if(!f) return null;
    function g(k){ var e = f.querySelector('[data-cmzadd="' + k + '"]'); return e ? e.value : ''; }
    var t = g('text').trim();
    if(!t){ var i = f.querySelector('[data-cmzadd="text"]'); if(i) i.focus(); return null; }
    var pid = g('projectId');
    var p = projectById(pid);
    if(!p) return null;
    var line = newOrderLine();
    line.text = t;
    line.qty = g('qty').trim();
    line.um = g('um') || 'buc';
    line.supplierId = g('supplierId') || '';
    line.altSupplierId = g('altSupplierId') || '';
    return { project: p, line: line };
  }

  /* ---- handlere delegate: 3 ascultători pe #board, nu N pe element ---- */
  function attachComenziEvents(){
    if(cmzEventsOn) return;
    cmzEventsOn = true;
    var board = document.getElementById('board');

    board.addEventListener('click', function(e){
      if(tab !== 'comenzi') return;
      var el = e.target.closest('[data-cmz]');
      if(!el || el.disabled) return;
      var act = el.dataset.cmz;
      if(act === 'sel' || act === 'selall' || act === 'edit' || act === 'f-q' || act === 'f-s' || act === 'f-p') return; // pe change/input
      var key = el.dataset.cmzk || '';
      var found = key ? findOrderByKey(key) : null;
      var keepFlash = false;
      var dirty = true;   // acțiunile de filtrare nu ating datele

      switch(act){
        case 'add': {
          var add = cmzReadAddForm();
          if(!add) return;
          if(!Array.isArray(add.project.orders)) add.project.orders = [];
          add.project.orders.unshift(add.line);
          cmzFlash = { title:'Adăugat', body: add.line.text + (add.line.qty ? ' · ' + add.line.qty + ' ' + add.line.um : '') + ' pe ' + (add.project.cod || '—') };
          keepFlash = true;
          cmzFocus = 'cmz-add-text';
          break;
        }
        case 'add-toggle': cmzAddOpen = !cmzAddOpen; if(cmzAddOpen) cmzFocus = 'cmz-add-text'; dirty = false; break;
        case 'del': {
          if(!found) return;
          if(found.order.text && !confirm('Ștergi rândul „' + found.order.text + '”?')) return;
          found.project.orders = found.project.orders.filter(function(x){ return x.id !== found.order.id; });
          delete cmzSel[key];
          pruneOrders();
          break;
        }
        case 'cycle': if(!found) return; cycleOrderStatus(found.order); delete cmzSel[key]; break;
        case 'receive': {
          if(!found) return;
          setOrderStatus(found.order, 'primit');
          var o = found.order.cmdId ? cmdById(found.order.cmdId) : null;
          if(o){
            var st = orderState(o);
            if(st.total && st.received === st.total){
              cmzFlash = { title: o.nr + ' încheiată', body: 'Toate cele ' + st.total + ' rânduri de la ' + supplierName(o.supplierId) + ' au ajuns în atelier.' };
              keepFlash = true;
            }
          }
          break;
        }
        case 'unreceive': if(!found) return; found.order.status = 'comandat'; found.order.receivedAt = null; break;
        case 'swapalt': {
          if(!found) return;
          var t2 = found.order.supplierId || '';
          found.order.supplierId = found.order.altSupplierId || '';
          found.order.altSupplierId = t2;
          break;
        }
        case 'send-group': {
          var gk = el.dataset.cmzv;
          var gvis = cmzBaseRows(allNeeds());
          if(cmzFst) gvis = gvis.filter(function(x){ return x.status === cmzFst; });
          var picked = gvis.filter(function(x){ return x.status === 'de-comandat' && (x.supplierId || '__') === gk; });
          var cmd = mintCmd(gk, picked.map(function(x){ return x._o; }));
          if(!cmd) return;
          picked.forEach(function(x){ delete cmzSel[x.key]; });
          cmzFlash = { title: cmd.nr, body: picked.length + ' rând' + (picked.length === 1 ? '' : 'uri') + ' către ' + supplierName(gk) + ' · ' + deliveryLabel(gk), cmdId: cmd.id };
          keepFlash = true;
          break;
        }
        case 'cart-send': {
          var all = allNeeds(), byKey = {};
          all.forEach(function(n){ byKey[n.key] = n; });
          var chosen = cmzCartKeys(all), by = {}, sups = [];
          chosen.forEach(function(k){
            var n = byKey[k], s = n.supplierId || '__';
            if(!by[s]){ by[s] = []; sups.push(s); }
            by[s].push(n);
          });
          var made = [];
          sups.forEach(function(s){
            if(s === '__') return;
            var cmd2 = mintCmd(s, by[s].map(function(n){ return n._o; }));
            if(cmd2){
              made.push(cmd2.nr + ' · ' + supplierName(s) + ' ×' + by[s].length);
              by[s].forEach(function(n){ delete cmzSel[n.key]; });
            }
          });
          if(!made.length) return;
          cmzFlash = { title: made.length + (made.length === 1 ? ' comandă trimisă' : ' comenzi trimise'), body: made.join('  ·  ') };
          keepFlash = true;
          break;
        }
        case 'cart-clear': cmzSel = {}; dirty = false; break;
        case 'sort': { var sk = el.dataset.cmzv; if(cmzSort === sk) cmzDir *= -1; else { cmzSort = sk; cmzDir = 1; } dirty = false; break; }
        case 'f-st': cmzFst = el.dataset.cmzv; dirty = false; break;
        case 'f-urg': cmzUrg = !cmzUrg; dirty = false; break;
        case 'f-group': cmzGroup = !cmzGroup; dirty = false; break;
        case 'f-prj': cmzFp = (cmzFp === el.dataset.cmzv ? '' : el.dataset.cmzv); cmzFst = ''; dirty = false; break;
        case 'f-cmd': cmzFcmd = (cmzFcmd === el.dataset.cmzv ? '' : el.dataset.cmzv); cmzFst = ''; cmzGroup = false; cmzUrg = false; cmzHist = true; dirty = false; break;
        case 'f-cmd-x': cmzFcmd = ''; dirty = false; break;
        case 'f-clear': cmzQ = ''; cmzFs = ''; cmzFp = ''; cmzFst = ''; cmzUrg = false; cmzFcmd = ''; dirty = false; break;
        case 'hist': cmzHist = !cmzHist; dirty = false; break;
        case 'flash-x': dirty = false; break;
        default: return;
      }
      if(!keepFlash) cmzFlash = null;
      if(dirty) saveState();
      render();
    });

    board.addEventListener('change', function(e){
      if(tab !== 'comenzi') return;
      var el = e.target.closest('[data-cmz]');
      if(!el) return;
      var act = el.dataset.cmz;

      // coșul: doar bifa + subsolul se schimbă — fără re-randare, altfel sar bifele
      if(act === 'sel'){
        var k = el.dataset.cmzk;
        if(el.checked) cmzSel[k] = true; else delete cmzSel[k];
        var tr = el.closest('tr');
        if(tr) tr.classList.toggle('on', el.checked);
        cmzPatchCart();
        return;
      }

      switch(act){
        case 'selall': {
          cmzSel = {};
          if(el.checked){
            document.querySelectorAll('input[data-cmz="sel"]').forEach(function(c){ cmzSel[c.dataset.cmzk] = true; });
          }
          cmzFlash = null;
          render();
          return;
        }
        case 'f-s': cmzFs = el.value; cmzFlash = null; render(); return;
        case 'f-p': cmzFp = el.value; cmzFlash = null; render(); return;
        case 'edit': {
          var found = findOrderByKey(el.dataset.cmzk);
          if(!found) return;
          var f = el.dataset.cmzfield, v = el.value;
          if(f === 'text'){
            v = v.trim();
            if(!v){ el.value = found.order.text || ''; return; }
            found.order.text = v;
          } else if(f === 'qty'){
            found.order.qty = v.trim();
          } else if(f === 'projectId'){
            var np = projectById(v);
            if(!np || np.id === found.project.id) return;
            if(!Array.isArray(np.orders)) np.orders = [];
            found.project.orders = found.project.orders.filter(function(x){ return x.id !== found.order.id; });
            np.orders.push(found.order);
            delete cmzSel[el.dataset.cmzk];
          } else {
            found.order[f] = v;
          }
          if(f === 'supplierId' && found.order.supplierId && found.order.supplierId === found.order.altSupplierId) found.order.altSupplierId = '';
          if(f === 'altSupplierId' && found.order.altSupplierId && found.order.altSupplierId === found.order.supplierId) found.order.altSupplierId = '';
          cmzFlash = null;
          saveState();
          render();
          return;
        }
        default: return;
      }
    });

    board.addEventListener('input', function(e){
      if(tab !== 'comenzi') return;
      var el = e.target.closest('[data-cmz="f-q"]');
      if(!el) return;
      cmzQ = el.value;
      cmzFocus = 'cmz-q';
      cmzFlash = null;
      render();
    });
  }

  /* ================= MODAL: feedback ================= */
  function openFeedbackModal(){
    var root = document.getElementById('modal-root');
    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>Feedback</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field"><label>Mesajul tău</label><textarea id="fb-text" placeholder="Ce observi, ce ai vrea schimbat, ce nu merge…" style="min-height:110px;"></textarea></div>';
    html += '<div class="field-hint" id="fb-status" style="margin:0;"></div>';
    html += '</div><div class="modal-foot"><div class="left" style="display:flex; gap:6px; flex-wrap:wrap;"><button class="btn btn-ghost btn-sm" id="fb-export">Feedback (.txt)</button><button class="btn btn-ghost btn-sm" id="fb-log-export">Istoric (.txt)</button></div>';
    html += '<div><button class="btn btn-ghost" id="btn-cancel">Închide</button> <button class="btn btn-primary" id="fb-send">Trimite</button></div></div></div></div>';
    root.innerHTML = html;

    function close(){ root.innerHTML=''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează

    document.getElementById('fb-send').addEventListener('click', function(){
      var text = document.getElementById('fb-text').value.trim();
      var statusEl = document.getElementById('fb-status');
      if(!text) return;
      if(!hasFirebase){ statusEl.textContent = 'Feedback indisponibil — nu e configurat Firebase.'; return; }
      var sendBtn = document.getElementById('fb-send');
      sendBtn.disabled = true;
      feedbackUrl().then(function(url){
        return fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({text: text, ts: new Date().toISOString()})
        });
      }).then(function(res){
        if(!res.ok) throw new Error('feedback send failed');
        close();
        showToast('✓');
      }).catch(function(){
        statusEl.textContent = 'Nu s-a putut trimite. Încearcă din nou.';
        sendBtn.disabled = false;
      });
    });

    document.getElementById('fb-export').addEventListener('click', function(){
      if(!hasFirebase){ alert('Feedback indisponibil — nu e configurat Firebase.'); return; }
      feedbackUrl().then(function(url){ return fetch(url); }).then(function(res){ return res.json(); }).then(function(raw){
        var entries = [];
        if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
        entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? -1 : 1; });
        var lines = entries.length
          ? entries.map(function(e){ return '[' + (e.ts||'?') + ']\n' + (e.text||'') + '\n'; })
          : ['Niciun feedback trimis încă.'];
        var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'feedback-atelier-' + isoToday() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(){ alert('Nu s-a putut încărca feedback-ul.'); });
    });

    document.getElementById('fb-log-export').addEventListener('click', function(){
      if(!hasFirebase){ alert('Istoric indisponibil — fără Firebase.'); return; }
      logUrl().then(function(u){ return fetch(u); }).then(function(r){ return r.json(); }).then(function(raw){
        var entries = [];
        if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
        entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? -1 : 1; });
        var lines = entries.length
          ? entries.map(function(e){ return fmtDateTime(e.ts) + '  [' + (LOG_LABEL[e.type] || e.type || '') + ']  ' + (e.text || ''); })
          : ['Istoric gol.'];
        var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'istoric-atelier-' + isoToday() + '.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(){ alert('Nu s-a putut încărca istoricul.'); });
    });
  }

  /* ================= MODAL: proiect ================= */
  function openProjectModal(projectId){
    var editing = !!projectId;
    var proj = editing ? state.projects.find(function(p){ return p.id===projectId; }) : null;
    var nextNum = state.projects.length + 1;
    var suggestedCode = 'P-' + new Date().getFullYear() + '-' + (nextNum<10?'0'+nextNum:nextNum);

    var root = document.getElementById('modal-root');

    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>'+(editing?'Editează proiect':'Proiect nou')+'</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field-row"><div class="field"><label>Cod proiect</label><input id="f-cod" value="'+esc(editing?proj.cod:suggestedCode)+'"></div>';
    html += '<div class="field"><label>Termen limită</label><input type="date" id="f-termen" value="'+esc(editing?proj.termen:'')+'"></div></div>';
    html += '<div class="field"><label>Client</label><input id="f-client" value="'+esc(editing?proj.client:'')+'" placeholder="Nume client"></div>';

    var proiectStations = (editing ? stationsFor(proj) : state.stations).filter(function(s){ return s.type==='proiect'; });
    var showStageField = (!editing) || !proj.finalizat;
    if(showStageField && proiectStations.length){
      html += '<div class="field"><label>Etapă curentă</label><select id="f-stage">' + proiectStations.map(function(s){
        var sel = editing ? (proj.stationId===s.id) : (s.id===proiectStations[0].id);
        return '<option value="'+s.id+'" '+(sel?'selected':'')+'>'+esc(s.name)+'</option>';
      }).join('') + '</select><div class="field-hint">Poți defini piesele acum, chiar dacă proiectul e încă la ofertare — piesele pornesc spre producție doar cele pe care le trimiți tu, una câte una.</div></div>';
    }

    if(editing){
      html += '<div class="field"><label>Etape proiect</label>';
      html += '<div id="modal-stages" class="modal-stages"></div>';
      html += '<div style="display:flex; gap:6px; margin-top:6px;">';
      html += '<button type="button" class="btn btn-xs btn-ghost" id="btn-add-stage-proiect">+ etapă proiectare</button>';
      html += '<button type="button" class="btn btn-xs btn-ghost" id="btn-add-stage-piesa">+ etapă execuție</button>';
      html += '</div></div>';
    }

    html += '<div class="field"><label>Tip lucrare</label><input id="f-tip" value="'+esc(editing?(proj.tip||''):'')+'" placeholder="ex: Balustradă, Poartă, Tâmplărie ușă…"></div>';

    html += '<div class="field"><label>Notițe</label><textarea id="f-notite" placeholder="Detalii, cotă, observații…">'+esc(editing?(proj.notite||''):'')+'</textarea></div>';
    html += '<div class="field"><label>Necesar montaj</label><textarea id="f-montaj" placeholder="Ce se pregătește / se duce pentru ziua montajului (șuruburi, scule, dibluri…)">'+esc(editing?(proj.montajNotes||''):'')+'</textarea></div>';
    html += '<div class="field"><label>Listă piese</label><div class="pieces-editor" id="pieces-editor"></div>';
    html += '<button type="button" class="btn btn-sm btn-ghost" id="btn-add-piece" style="margin-top:8px;">+ Adaugă piesă</button>';
    html += '<div class="field-hint">Piesele pornesc în prima etapă a proiectului; le muți mai departe din pipeline-ul rândului desfășurat.</div>';
    html += '</div></div>';

    html += '<div class="modal-foot"><div class="left">';
    if(editing) html += '<button class="btn btn-danger-outline" id="btn-del-project">Șterge proiect</button>';
    html += '</div><div><button class="btn btn-ghost" id="btn-cancel">Anulează</button> <button class="btn btn-primary" id="btn-save">'+(editing?'Salvează':'Adaugă proiect')+'</button></div></div></div></div>';
    root.innerHTML = html;

    var piecesEditor = document.getElementById('pieces-editor');
    function addPieceRow(pieceId, name, stationId, colorCode){
      var row = document.createElement('div');
      row.className = 'piece-row';
      row.dataset.id = pieceId || uid();
      row.dataset.stationId = stationId || '';
      row.innerHTML = '<input class="piece-name" value="'+esc(name||'')+'" placeholder="Denumire piesă (ex: stâlp 40x40, 1.2m)"><input class="piece-color" value="'+esc(colorCode||'')+'" placeholder="Cod culoare"><button type="button" class="btn-remove-piece">×</button>';
      row.querySelector('.btn-remove-piece').addEventListener('click', function(){ row.remove(); });
      piecesEditor.appendChild(row);
      return row;
    }
    if(editing && proj.pieces && proj.pieces.length) proj.pieces.forEach(function(pc){ addPieceRow(pc.id, pc.name, pc.stationId, pc.colorCode); });
    document.getElementById('btn-add-piece').addEventListener('click', function(){ addPieceRow(null,'').querySelector('input').focus(); });

    if(editing && document.getElementById('modal-stages')){
      function renderModalStages(){
        var el = document.getElementById('modal-stages'); if(!el) return;
        el.innerHTML = stationsFor(proj).map(function(s){ return '<span class="modal-stage-chip ' + s.type + '">' + esc(s.name) + '</span>'; }).join('');
      }
      renderModalStages();
      document.getElementById('btn-add-stage-proiect').addEventListener('click', function(){ addProjectStage(proj.id, 'proiect'); renderModalStages(); });
      document.getElementById('btn-add-stage-piesa').addEventListener('click', function(){ addProjectStage(proj.id, 'piesa'); renderModalStages(); });
    }

    // render() la închidere: o etapă adăugată din modal se vede în pipeline chiar dacă ieși cu Anulează/✕
    function close(){ root.innerHTML=''; render(); }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    // clicul pe fundal NU închide modalul (ca să nu pierzi ce ai completat) — închizi cu ✕ sau Anulează
    if(editing) document.getElementById('btn-del-project').addEventListener('click', function(){
      if(confirm('Ștergi proiectul '+proj.cod+'?')){
        state.projects = state.projects.filter(function(p){ return p.id!==proj.id; });
        state.repairs = (state.repairs || []).filter(function(r){ return r.projectId !== proj.id && normCod(r.cod) !== normCod(proj.cod); });
        delete registryOpen[proj.id];
        saveState(); close(); render();
      }
    });

    document.getElementById('btn-save').addEventListener('click', function(){
      var cod = document.getElementById('f-cod').value.trim();
      var client = document.getElementById('f-client').value.trim();
      var termen = document.getElementById('f-termen').value;
      if(!cod || !client || !termen){ alert('Completează cod, client și termen limită.'); return; }
      var tip = document.getElementById('f-tip').value.trim();
      var notite = document.getElementById('f-notite').value.trim();
      var montajNotes = document.getElementById('f-montaj').value.trim();

      var fallbackStationId = editing
        ? firstStationIdOf(proj)
        : ((state.stations && state.stations[0]) ? state.stations[0].id : null);
      var pieces = [];
      piecesEditor.querySelectorAll('.piece-row').forEach(function(row){
        var name = row.querySelector('.piece-name').value.trim();
        if(!name) return;
        var colorCode = row.querySelector('.piece-color').value.trim();
        pieces.push({id: row.dataset.id, name: name, stationId: row.dataset.stationId || fallbackStationId, colorCode: colorCode});
      });

      if(editing){
        proj.cod=cod; proj.client=client; proj.termen=termen; proj.tip=tip;
        proj.notite=notite; proj.montajNotes=montajNotes; proj.pieces=pieces;
        var stageSel = document.getElementById('f-stage');
        if(stageSel){ proj.stationId = stageSel.value; proj.lane = null; }
      } else {
        var stageSelNew = document.getElementById('f-stage');
        var newStations = JSON.parse(JSON.stringify(state.stations || []));
        var firstProiect = newStations.filter(function(s){ return s.type==='proiect'; })[0];
        state.projects.push({
          id: uid(), cod:cod, client:client, termen:termen, tip:tip,
          stations: newStations,
          stationId: stageSelNew ? stageSelNew.value : (firstProiect ? firstProiect.id : null),
          finalizat:false, notite:notite, pieces:pieces, orders:[], montajNotes:montajNotes, createdAt: isoToday()
        });
        logEvent('proiect-nou', cod + ' · ' + client);
      }
      saveState(); close(); render();
    });
  }

  /* ---------------- top-level wiring ---------------- */
  function setAddButton(){
    var btn = document.getElementById('btn-add');
    btn.textContent = '+ Proiect nou';
    btn.onclick = function(){ openProjectModal(null); };
  }

  function padMainBelowTopbar(){
    var main = document.getElementById('main');
    // the topbar is position:fixed — push the scrollable content clear of it (every tab, registru included)
    var tb = document.querySelector('.topbar');
    main.style.paddingTop = ((tb ? tb.offsetHeight : 60) + 12) + 'px';
  }
  // bara de sus e position:fixed și îi măsurăm înălțimea o dată — dacă fereastra se
  // redimensionează și butoanele se rup pe alt număr de rânduri, remăsurăm.
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ padMainBelowTopbar(); }, 150);
  });

  document.getElementById('search').addEventListener('input', function(e){ searchQuery = e.target.value; render(); });
  document.getElementById('btn-feedback').addEventListener('click', function(){ openFeedbackModal(); });
  document.getElementById('btn-undo').addEventListener('click', doUndo);
  document.getElementById('btn-redo').addEventListener('click', doRedo);
  document.addEventListener('keydown', function(e){
    if(!(e.ctrlKey || e.metaKey)) return;
    var k = (e.key || '').toLowerCase();
    if(k !== 'z' && k !== 'y') return;
    var a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; // let the field's native text undo win
    e.preventDefault();
    if(k === 'y' || e.shiftKey) doRedo(); else doUndo();
  });
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      if(tab === b.dataset.tab) return;
      tab = b.dataset.tab;
      document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('active', x === b); });
      setAddButton();
      padMainBelowTopbar();
      render();
    });
  });


  function startApp(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    loadState().then(function(s){
      state = s;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      resetUndoHistory();
      setAddButton();
      padMainBelowTopbar();
      render();
      attachLiveSync();
      if(!hasFirebase && !hasCloudStorage) showToast('Mod local — configurează Firebase (vezi comentariul din cod) sau deschide prin Claude.ai, ca șeful tău să vadă aceleași date.', true);
    });
  }

  // Live sync: apply changes other people save, as they happen. Held back only while
  // this user is mid-edit (a field focused or a modal open), then applied on the next tick.
  function userIsBusy(){
    var mr = document.getElementById('modal-root');
    if(mr && mr.children.length) return true;
    var a = document.activeElement;
    if(!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA' && a.tagName !== 'SELECT')) return false;
    // the top-bar search box is a filter, not data entry — it must not block live sync
    return !!(a.closest && a.closest('#board'));
  }
  function applyRemote(incoming){
    if(stableStringify(incoming) === stableStringify(state)) return;
    state = incoming;
    noteLocalWrite(stableStringify(state));
    resetUndoHistory(); // a colleague's change invalidates our local undo stack
    setAddButton();
    render();
    showToast('Tablou actualizat — modificări de la un coleg.');
  }
  // A remote change came in while the user was mid-edit — re-fetch the current DB state
  // (not a possibly-stale stashed copy) and apply it now that it's safe.
  function flushRemote(){
    if(!remoteDirty || !hasRtdb || userIsBusy()) return;
    remoteDirty = false;
    dbRef().once('value').then(function(snap){
      var raw = snap.val();
      if(!raw) return;
      try {
        var incoming = resolveVersioned(raw);
        if(recentLocalSigs.indexOf(stableStringify(incoming)) !== -1) return;
        console.log('[sync] aplic modificarea care aștepta');
        applyRemote(incoming);
      } catch(e){ /* ignore */ }
    }).catch(function(){});
  }
  function attachLiveSync(){
    console.log('[sync] hasAuth=' + hasAuth + ' hasRtdb=' + hasRtdb + ' firebase.database=' + (typeof (window.firebase && firebase.database)));
    if(liveSyncAttached) return;
    if(!hasRtdb){ console.warn('[sync] RTDB SDK indisponibil — rămân pe REST (fără actualizări live)'); return; }
    liveSyncAttached = true;
    try {
      firebase.database().ref('.info/connected').on('value', function(s){
        console.log('[sync] ' + (s.val() ? 'conectat la Firebase' : 'offline'));
      });
    } catch(e){ /* ignore */ }
    console.log('[sync] listener live pornit');
    dbRef().on('value', function(snap){
      var raw = snap.val();
      if(!raw) return;
      var incoming;
      try { incoming = resolveVersioned(raw); } catch(e){ console.warn('[sync] snapshot invalid', e); return; }
      var sig = stableStringify(incoming);
      if(recentLocalSigs.indexOf(sig) !== -1 || sig === stableStringify(state)){ return; } // our own echo / no change
      if(userIsBusy()){ console.log('[sync] schimbare primită — o aplic după ce termini editarea'); remoteDirty = true; return; }
      console.log('[sync] schimbare primită de la un coleg — aplic');
      applyRemote(incoming);
    }, function(err){
      console.warn('[sync] listener respins:', err && err.code, err && err.message);
    });
    setInterval(flushRemote, 1000);
    document.addEventListener('focusout', function(){ setTimeout(flushRemote, 60); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(flushRemote, 60); });
  }

  if(hasAuth){
    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type="submit"]');
      var errEl = document.getElementById('login-error');
      var pass = document.getElementById('login-password').value;
      btn.disabled = true;
      errEl.textContent = '';
      firebase.auth().signInWithEmailAndPassword(SHARED_LOGIN_EMAIL, pass).catch(function(){
        errEl.textContent = 'Parolă greșită. Încearcă din nou.';
        btn.disabled = false;
      });
    });
    firebase.auth().onAuthStateChanged(function(user){
      if(user){
        startApp();
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  } else {
    startApp();
  }
})();
</script>
