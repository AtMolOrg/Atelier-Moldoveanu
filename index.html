        } else {
          html += '<span class="sub-piece-status pending">La proiectare</span>';
          if(piesaStationsFor(p).length > 0) html += '<button type="button" class="sub-piece-btn send" data-piece-move="' + p.id + '::' + pc.id + '" data-dir="next" title="Trimite în producție">→</button>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '<div class="card-actions">';
    if(p.finalizat){
      html += '<button class="btn btn-sm btn-ghost" data-reopen="' + p.id + '">↺ Redeschide</button>';
    } else {
      var next = nextProiectStationFor(p, station.id);
      if(next) html += '<button class="btn btn-sm" data-advance="' + p.id + '" data-target="' + next.id + '">Avansează → ' + esc(next.name) + '</button>';
      if(isPostExecStationFor(p, station.id)){
        html += '<button class="btn btn-sm btn-primary" data-close-project="' + p.id + '">Finalizează proiect ✓</button>';
      }
    }
    html += '</div>';
    html += '<div class="card-actions">';
    html += '<button class="btn btn-sm" data-edit="' + p.id + '">Editează</button>';
    html += '<button class="btn btn-sm btn-danger-outline" data-del="' + p.id + '">Șterge</button>';
    html += '</div></div></div>';
    return html;
  }

  function renderPieceCard(piece, project){
    var ps = piesaStationsFor(project);
    var psIdx = ps.findIndex(function(s){ return s.id === piece.stationId; });
    var isBack = psIdx === -1;
    var grad = urgencyGradient(project);
    var cardStyle = grad ? ' style="border-left:3px solid ' + grad.border + '; background:' + grad.tint + ';"' : '';
    var html = '<div class="piece-card' + (isBack ? ' back-to-design' : '') + '" draggable="true" data-piece="' + project.id + '::' + piece.id + '"' + cardStyle + '>';
    html += '<div class="p-code">' + esc(project.cod) + '</div>';
    html += '<div class="p-name">' + esc(piece.name) + '</div>';
    if(piece.colorCode) html += '<div class="p-color">' + esc(piece.colorCode) + '</div>';
    html += '<div class="p-client">' + esc(project.client) + '</div>';
    if(isBack) html += '<div class="badge badge-done" style="margin:4px 0;">La proiectare</div>';
    html += renderAssignedPeople(project.id, piece.id);
    if(!isBack){
      html += '<div class="piece-btn-row">';
      html += '<button class="btn btn-xs btn-ghost" data-piece-demote="' + project.id + '::' + piece.id + '" title="Scoate doar această piesă din execuție, înapoi la proiectare">↺</button>';
      html += '<button class="btn btn-xs sub-piece-btn send" data-piece-to-montaj="' + project.id + '::' + piece.id + '" title="Trimite piesa la montaj">📦</button>';
      html += '</div>';
    } else {
      html += '<button class="btn btn-xs btn-primary" style="width:100%; margin-top:6px;" data-piece-move="' + project.id + '::' + piece.id + '" data-dir="next">La execuție →</button>';
    }
    html += '</div>';
    return html;
  }

  function attachHalaEvents(){
    document.querySelectorAll('.col-title').forEach(function(inp){
      inp.addEventListener('change', function(){
        var st = stationById(inp.dataset.station);
        if(st){ st.name = inp.value.trim() || st.name; saveState(); }
      });
    });
    document.querySelectorAll('.lane-title').forEach(function(inp){
      inp.addEventListener('change', function(){
        var projId = inp.dataset.project;
        if(projId){
          var proj = state.projects.find(function(x){ return x.id===projId; });
          var lanes = proj && proj.laneDefs && proj.laneDefs[inp.dataset.station];
          var lane = lanes && lanes.find(function(l){ return l.id === inp.dataset.lane; });
          if(lane){ lane.name = inp.value.trim() || lane.name; saveState(); }
          return;
        }
        var st = stationById(inp.dataset.station);
        if(!st || !st.lanes) return;
        var lane = st.lanes.find(function(l){ return l.id === inp.dataset.lane; });
        if(lane){ lane.name = inp.value.trim() || lane.name; saveState(); }
      });
    });
    document.querySelectorAll('.lane-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var projId = btn.dataset.project;
        var laneId = btn.dataset.lane;
        if(projId){
          var proj = state.projects.find(function(x){ return x.id===projId; });
          if(!proj || !proj.laneDefs || !proj.laneDefs[btn.dataset.station]) return;
          var lanes = proj.laneDefs[btn.dataset.station];
          var remaining = lanes.filter(function(l){ return l.id !== laneId; });
          var fallbackId = remaining[0] ? remaining[0].id : null;
          var st0 = stationByIdFor(proj, btn.dataset.station);
          if(st0 && st0.type === 'proiect'){
            if(proj.stationId===btn.dataset.station && proj.lane===laneId) proj.lane = fallbackId;
          } else {
            (proj.pieces||[]).forEach(function(pc){ if(pc.stationId===btn.dataset.station && pc.lane===laneId) pc.lane = fallbackId; });
          }
          proj.laneDefs[btn.dataset.station] = remaining;
          saveState(); render();
          return;
        }
        var st = stationById(btn.dataset.station);
        if(!st || !st.lanes) return;
        var remaining = st.lanes.filter(function(l){ return l.id !== laneId; });
        var fallbackId = remaining[0] ? remaining[0].id : null;
        if(st.type === 'proiect'){
          state.projects.forEach(function(p){ if(p.stationId===st.id && p.lane===laneId) p.lane = fallbackId; });
        } else {
          state.projects.forEach(function(p){ (p.pieces||[]).forEach(function(pc){ if(pc.stationId===st.id && pc.lane===laneId) pc.lane = fallbackId; }); });
        }
        st.lanes = remaining;
        saveState(); render();
      });
    });
    document.querySelectorAll('.col-actions button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.station;
        var act = btn.dataset.act;
        var proj = btn.dataset.project ? projectById(btn.dataset.project) : null;
        // the flow of stages is per-project now — a project scopes to its own p.stations
        var arr = proj ? forkProjectStations(proj) : state.stations;
        var idx = arr.findIndex(function(s){ return s.id === id; });
        var st = arr[idx];
        if(act === 'addlane'){
          if(proj){
            var stP = stationByIdFor(proj, id);
            if(!stP) return;
            var existing = projectLanesFor(proj, stP);
            var laneNameP = prompt('Denumire partiție nouă:', existing.length ? '' : 'Atelier');
            if(!laneNameP || !laneNameP.trim()) return;
            existing.push({id: uid(), name: laneNameP.trim()});
            saveState(); render();
            return;
          }
          var stA = stationById(id);
          var laneName = prompt('Denumire coloană nouă:', stA.lanes && stA.lanes.length ? '' : 'Atelier');
          if(!laneName || !laneName.trim()) return;
          if(!stA.lanes) stA.lanes = [];
          stA.lanes.push({id: uid(), name: laneName.trim()});
          saveState(); render();
        } else if(act === 'left' && idx > 0){
          var t = arr[idx-1]; arr[idx-1]=arr[idx]; arr[idx]=t; saveState(); render();
        } else if(act === 'right' && idx < arr.length-1){
          var t2 = arr[idx+1]; arr[idx+1]=arr[idx]; arr[idx]=t2; saveState(); render();
        } else if(act === 'del'){
          if(!st) return;
          var sameType = arr.filter(function(s){ return s.type===st.type; });
          if(sameType.length <= 1){ alert('Trebuie să existe cel puțin o etapă de tip ' + (st.type==='piesa'?'piesă':'proiect') + '.'); return; }
          var remaining = arr.filter(function(s){ return s.id !== id; });
          var fallback = remaining.filter(function(s){ return s.type===st.type; })[0];
          if(proj){
            var affected = st.type==='proiect'
              ? (proj.stationId===id ? 1 : 0)
              : (proj.pieces||[]).filter(function(pc){ return pc.stationId===id; }).length;
            if(affected > 0 && !confirm('Etapa are ' + affected + (st.type==='piesa'?' piese':' proiect') + ' aici. Se mută în altă etapă. Continui?')) return;
            if(st.type==='proiect'){ if(proj.stationId===id){ proj.stationId = fallback.id; proj.lane = null; breakConnectionsFor(proj.id); } }
            else { (proj.pieces||[]).forEach(function(pc){ if(pc.stationId===id){ pc.stationId = fallback.id; pc.lane = null; breakConnectionsFor('pc:' + proj.id + '::' + pc.id); } }); }
            proj.stations = remaining;
            saveState(); render();
            return;
          }
          var affectedCount = st.type==='proiect'
            ? state.projects.filter(function(p){ return p.stationId===id; }).length
            : state.projects.reduce(function(a,p){ return a + (p.pieces||[]).filter(function(pc){ return pc.stationId===id; }).length; }, 0);
          if(affectedCount > 0 && !confirm('Etapa are ' + affectedCount + ' ' + (st.type==='piesa'?'piese':'proiect(e)') + '. Se mută în etapa anterioară de același tip. Continui?')) return;
          if(st.type==='proiect'){
            state.projects.forEach(function(p){ if(p.stationId===id){ p.stationId = fallback.id; p.lane = null; breakConnectionsFor(p.id); } });
          } else {
            state.projects.forEach(function(p){ (p.pieces||[]).forEach(function(pc){ if(pc.stationId===id){ pc.stationId = fallback.id; pc.lane = null; breakConnectionsFor('pc:' + p.id + '::' + pc.id); } }); });
          }
          state.stations = remaining;
          saveState(); render();
        }
      });
    });
    document.querySelectorAll('[data-add-stage]').forEach(function(btn){

        if(!found) return;

        found.order.status = ORDER_STATUSES[(i + 1) % ORDER_STATUSES.length];
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-order-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var found = findOrderByKey(btn.dataset.orderDel);
        if(!found) return;
        if(found.order.text && !confirm('Ștergi rândul „' + found.order.text + '”?')) return;
        found.project.orders = found.project.orders.filter(function(x){ return x.id !== found.order.id; });
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-order-edit]').forEach(function(inp){
      inp.addEventListener('mousedown', function(e){ e.stopPropagation(); });
      inp.addEventListener('change', function(){
        var found = findOrderByKey(inp.dataset.orderEdit);
        if(!found) return;
        // trim free text, but leave the supplier <select> value untouched
        found.order[inp.dataset.field] = inp.tagName === 'SELECT' ? inp.value : inp.value.trim();
        saveState(); // no re-render: the summary badge only tracks count + status, not these fields
      });
    });

    // checklist cards — mărunțișuri
    document.querySelectorAll('[data-note-rename]').forEach(function(tab){
      tab.addEventListener('dblclick', function(e){
        e.preventDefault(); e.stopPropagation();
        var cl = checklistById(tab.dataset.noteRename);
        if(!cl) return;
        var t = prompt('Titlul listei:', cl.title || '');
        if(t === null) return;
        cl.title = t.trim() || cl.title;
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var cl = checklistById(btn.dataset.noteDel);
        if(!cl) return;
        if(!confirm('Ștergi lista „' + (cl.title || '') + '” cu tot cu rânduri?')) return;
        state.checklists = state.checklists.filter(function(x){ return x.id !== cl.id; });
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-add]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var cl = checklistById(btn.dataset.noteAdd);
        if(!cl) return;
        if(!Array.isArray(cl.items)) cl.items = [];
        cl.items.push({ id: uid(), text: '', done: false, workerId: '' });
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-check]').forEach(function(cb){
      cb.addEventListener('mousedown', function(e){ e.stopPropagation(); });
      cb.addEventListener('change', function(){
        var f = findChecklistItem(cb.dataset.noteCheck);
        if(!f) return;
        f.item.done = cb.checked;
        if(cb.checked) f.item.doneTs = Date.now(); else delete f.item.doneTs;
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-text]').forEach(function(inp){
      inp.addEventListener('mousedown', function(e){ e.stopPropagation(); });
      inp.addEventListener('change', function(){
        var f = findChecklistItem(inp.dataset.noteText);
        if(!f) return;
        f.item.text = inp.value.trim();
        saveState(); // no re-render: keeps focus; text isn't shown anywhere else live
      });
    });
    document.querySelectorAll('[data-note-item-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var f = findChecklistItem(btn.dataset.noteItemDel);
        if(!f) return;
        if(f.item.text && !confirm('Ștergi rândul „' + f.item.text + '”?')) return;
        f.list.items = f.list.items.filter(function(x){ return x.id !== f.item.id; });
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-unassign]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var f = findChecklistItem(btn.dataset.noteUnassign);
        if(!f) return;
        f.item.workerId = '';
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-restore]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var f = findChecklistItem(btn.dataset.noteRestore);
        if(!f) return;
        f.item.done = false; delete f.item.doneTs;
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-note-done-clear]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var cl = checklistById(btn.dataset.noteDoneClear);
        if(!cl) return;
        if(!confirm('Golești secțiunea „gata"? Rândurile bifate se șterg definitiv.')) return;
        cl.items = cl.items.filter(function(x){ return !x.done; });
        saveState(); render();
      });
    });
    document.querySelectorAll('.note-item[data-note-row]').forEach(function(row){
      row.addEventListener('dragover', function(e){
        if((draggingData || '').indexOf('WRK::') === 0){ e.preventDefault(); e.stopPropagation(); row.classList.add('link-target'); }
      });
      row.addEventListener('dragleave', function(){ row.classList.remove('link-target'); });
      row.addEventListener('drop', function(e){
        var data = e.dataTransfer.getData('text/plain') || draggingData;
        if(!data || data.indexOf('WRK::') !== 0) return;
        e.preventDefault(); e.stopPropagation();
        row.classList.remove('link-target');
        var f = findChecklistItem(row.dataset.noteRow);
        if(!f) return;
        f.item.workerId = data.slice(5);
        saveState(); render();
      });
    });

    // folder side panels (comenzi materiale — stânga; necesar montaj — dreapta):
    // hover/click the handle to open; auto-hide unless pinned; pin is shared per project
    document.querySelectorAll('[data-side-panel]').forEach(function(pnl){
      var id = pnl.dataset.sidePanel, kind = pnl.dataset.sideKind, pinField = pnl.dataset.sidePinfield;
      var okey = id + '|' + kind;
      var closeTimer = null;
      function open(){ clearTimeout(closeTimer); sideOpen[okey] = true; pnl.classList.add('open'); }
      function scheduleClose(){
        var pr = projectById(id);
        if(pr && pr[pinField]) return;
        clearTimeout(closeTimer);
        closeTimer = setTimeout(function(){ sideOpen[okey] = false; pnl.classList.remove('open'); }, 900);
      }
      var handle = pnl.querySelector('[data-side-handle]');
      if(handle){
        handle.addEventListener('mouseenter', open);
        handle.addEventListener('click', function(e){ e.stopPropagation(); open(); });
      }
      pnl.addEventListener('mouseenter', function(){ clearTimeout(closeTimer); });
      pnl.addEventListener('mouseleave', scheduleClose);
    });
    document.querySelectorAll('[data-side-pin]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var pr = projectById(btn.dataset.sidePin), field = btn.dataset.pinfield;
        if(!pr || !field) return;
        pr[field] = !pr[field];
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-montaj-notes]').forEach(function(ta){
      ta.addEventListener('mousedown', function(e){ e.stopPropagation(); });
      ta.addEventListener('change', function(){
        var p = projectById(ta.dataset.montajNotes);
        if(!p) return;
        p.montajNotes = ta.value;
        saveState(); // on blur; no re-render so the caret stays put
      });
    });

    // drop zones — station bodies (projects/pieces/workers) and the unassigned-people pool (workers only)
    document.querySelectorAll('.col-body').forEach(function(zone){
      zone.addEventListener('dragover', function(e){
        var d = draggingData || '';
        if(d.indexOf('WRK::')===0) return; // people are never dropped directly on a bench
        e.preventDefault(); zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', function(){ zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', function(e){
        var data = e.dataTransfer.getData('text/plain') || draggingData;
        if(!data || data.indexOf('WRK::') === 0) return;
        e.preventDefault();
        zone.classList.remove('drag-over');
        var kind = zone.dataset.kind;
        if(data.indexOf('PC::') === 0){
          var parts = data.slice(4).split('::');
          var p = state.projects.find(function(x){ return x.id === parts[0]; });
          if(!p) return;
          var pc = p.pieces.find(function(x){ return x.id === parts[1]; });
          if(!pc) return;
          if(kind === 'piesa'){
            pc.stationId = zone.dataset.station; pc.lane = zone.dataset.lane || null;
            breakConnectionsFor('pc:' + p.id + '::' + pc.id);
            saveState(); render();
          } else if(kind === 'proiect' && isPostExecStationFor(p, zone.dataset.station)){
            // dropping a piece onto Montaj (or any post-execution stage) sends the whole project there
            p.stationId = zone.dataset.station; p.lane = zone.dataset.lane || null;
            breakConnectionsFor(p.id);
            saveState(); render();
          }
        } else if(data.indexOf('PRJ::') === 0){
          if(kind !== 'proiect') return;
          var proj = state.projects.find(function(x){ return x.id === data.slice(5); });
          if(proj){
            proj.stationId = zone.dataset.station; proj.lane = zone.dataset.lane || null;
            breakConnectionsFor(proj.id);
            saveState(); render();
          }
        }
      });
    });
  }

  function openWorkerModal(workerId){

    html += '<div class="modal-body">';
    html += '<div class="field"><label>Nume</label><input id="wf-name" value="'+esc(w.name)+'"></div>';
    html += '<div class="field-row"><div class="field" style="flex:0 0 90px;"><label>Culoare</label><input type="color" id="wf-color" value="'+esc(workerColor(w))+'" style="height:40px; padding:4px; cursor:pointer;"></div>';
    html += '<div class="field" style="flex:1; justify-content:flex-end; display:flex; flex-direction:column;"><label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:13px; margin-bottom:0;"><input type="checkbox" id="wf-furnizor" style="width:auto;" '+(w.kind==='furnizor'?'checked':'')+'> Furnizor extern (nu angajat)</label></div></div>';
    if((state.colorHistory||[]).length){
      html += '<div class="field"><label>Culori folosite</label><div class="color-history">' + state.colorHistory.map(function(c){
        return '<button type="button" class="color-swatch" data-pick-color="'+esc(c)+'" style="background:'+esc(c)+'" title="'+esc(c)+'"></button>';
      }).join('') + '</div></div>';
    }
    html += '<div class="field"><label>Task-uri legate</label>';
    if(links.length === 0){
      html += '<div class="field-hint">Niciunul încă — trage-l direct peste un card de proiect sau piesă, ca să-l legi.</div>';
    } else {
      html += '<div class="pieces-editor">';
      links.forEach(function(a){
        html += '<div class="piece-row"><input class="piece-name" disabled value="'+esc(assignmentLabel(a))+'"><button type="button" class="btn-remove-piece" data-unlink-modal="'+a.id+'">×</button></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="field"><label>Notă generală</label><input id="wf-note" value="'+esc(w.taskNote||'')+'" placeholder="ex: liber după ora 14"></div>';
    html += '</div>';
    html += '<div class="modal-foot"><div class="left"><button class="btn btn-danger-outline" id="btn-del-worker">Șterge</button></div>';
    html += '<div><button class="btn btn-ghost" id="btn-cancel">Anulează</button> <button class="btn btn-primary" id="btn-save-worker">Salvează</button></div></div>';
    html += '</div></div>';
    root.innerHTML = html;

    document.querySelectorAll('[data-unlink-modal]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.assignments = state.assignments.filter(function(a){ return a.id !== btn.dataset.unlinkModal; });
        saveState(); openWorkerModal(workerId);
      });
    });
    document.querySelectorAll('[data-pick-color]').forEach(function(sw){
      sw.addEventListener('click', function(){ document.getElementById('wf-color').value = sw.dataset.pickColor; });
    });

    function close(){ root.innerHTML = ''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target.id==='modal-overlay') close(); });
    document.getElementById('btn-del-worker').addEventListener('click', function(){
      if(confirm('Ștergi pe '+w.name+'?')){
        state.workers = state.workers.filter(function(x){ return x.id !== w.id; });
        state.assignments = state.assignments.filter(function(a){ return a.workerId !== w.id; });
        saveState(); close(); render();
      }

      addToColorHistory(w.color);

      saveState(); close(); render();
    });
  }

  /* ================= GANTT ================= */
  function renderGantt(){
    var board = document.getElementById('board');
    var visibleProjects = state.projects.filter(function(p){ return matchesSearch(p.cod,p.client); })
      .slice().sort(function(a,b){ return (a.termen||'9999') < (b.termen||'9999') ? -1 : 1; });

    board.className = ''; board.style.display='block'; board.style.height='100%';

    if(state.projects.length === 0){
      board.innerHTML = '<div class="empty-state gantt-empty"><h2>Nimic de programat</h2><p>Adaugă un proiect cu termen limită ca să apară pe cronologie.</p><button class="btn btn-primary" id="empty-add-g">+ Adaugă primul proiect</button></div>';
      document.getElementById('empty-add-g').onclick = function(){ openProjectModal(null); };
      return;
    }

    var today = todayDate();
    var minDate = today, maxDate = new Date(today.getTime() + 13*86400000);
    visibleProjects.forEach(function(p){
      var c = parseDate(p.createdAt), t = parseDate(p.termen);
      if(c && c < minDate) minDate = c;
      if(t && t > maxDate) maxDate = t;
    });
    minDate = new Date(minDate.getTime() - 2*86400000);
    maxDate = new Date(maxDate.getTime() + 3*86400000);
    var numDays = Math.max(14, daysBetween(minDate, maxDate));
    var dayWidth = 34;

    function dayBg(){
      var stops = [];
      for(var i=0;i<numDays;i++){
        var d = new Date(minDate.getTime() + i*86400000);
        var isWeekend = d.getDay()===0 || d.getDay()===6;
        var isToday = sameDay(d, today);
        var color = isToday ? 'rgba(0,0,0,0.12)' : (isWeekend ? 'rgba(0,0,0,0.06)' : 'transparent');
        var from = i*dayWidth, to=(i+1)*dayWidth;
        stops.push(color+' '+from+'px', color+' '+to+'px');
      }
      return 'linear-gradient(to right, '+stops.join(',')+')';
    }
    var bg = dayBg();
    var trackWidth = numDays*dayWidth;

    var html = '<div class="gantt-wrap"><div style="min-width:'+(230+trackWidth)+'px;">';
    html += '<div class="gantt-row gantt-row-header"><div class="gantt-label"><span class="g-code">Proiect</span></div>';
    html += '<div class="gantt-header-days" style="width:'+trackWidth+'px; background-image:'+bg+'">';
    for(var i=0;i<numDays;i++){
      var d = new Date(minDate.getTime()+i*86400000);
      html += '<div class="gantt-daycell" style="width:'+dayWidth+'px">'+d.getDate()+(d.getDate()===1||i===0?'<span class="g-month">'+MONTHS[d.getMonth()]+'</span>':'')+'</div>';
    }
    html += '</div></div>';
    visibleProjects.forEach(function(p){
      var c = parseDate(p.createdAt) || today;
      var t = parseDate(p.termen) || c;
      var offsetDays = Math.max(0, daysBetween(minDate, c));
      var spanDays = Math.max(1, daysBetween(c, t));
      var urg = p.finalizat ? 'done' : urgencyOf(p);
      html += '<div class="gantt-row"><div class="gantt-label"><span class="g-code">'+esc(p.cod)+'</span><span class="g-client">'+esc(p.client)+'</span></div>';
      html += '<div class="gantt-track" style="width:'+trackWidth+'px; height:40px; background-image:'+bg+'">';
      html += '<div class="gantt-bar bar-'+urg+'" data-edit="'+p.id+'" style="left:'+(offsetDays*dayWidth)+'px; width:'+(spanDays*dayWidth-4)+'px" title="'+esc(p.cod)+' — '+esc(p.client)+' — termen '+esc(p.termen)+'">'+esc(p.cod)+'</div>';
      html += '</div></div>';
    });
    html += '</div></div>';
    board.innerHTML = html;
    document.querySelectorAll('.gantt-bar').forEach(function(bar){ bar.addEventListener('click', function(){ openProjectModal(bar.dataset.edit); }); });
  }

  /* ================= PROIECTE (table / traseu) ================= */
  var showFinalizate = false;
  var proiecteViewMode = 'traseu';
  function renderProiecte(){
    var board = document.getElementById('board');
    board.className=''; board.style.display='block'; board.style.height='100%';

    var list = state.projects.filter(function(p){ return matchesSearch(p.cod,p.client); })
      .filter(function(p){ return showFinalizate || !p.finalizat; })
      .sort(function(a,b){ return (a.termen||'9999') < (b.termen||'9999') ? -1 : 1; });

    var html = '<div class="toolbar-row"><label><input type="checkbox" id="chk-finalizate" ' + (showFinalizate?'checked':'') + '> Arată și proiectele finalizate</label>';
    html += '<div class="view-toggle-mini"><button data-mode="traseu" class="' + (proiecteViewMode==='traseu'?'active':'') + '">Traseu, câte un rând per proiect</button><button data-mode="tabel" class="' + (proiecteViewMode==='tabel'?'active':'') + '">Tabel</button></div></div>';

    if(list.length === 0){
      html += '<div class="empty-state" style="margin-top:20px;"><h2>Niciun proiect de listat</h2><p>Ajustează căutarea sau adaugă un proiect nou.</p></div>';
      board.innerHTML = html;
      document.getElementById('chk-finalizate').addEventListener('change', function(e){ showFinalizate = e.target.checked; render(); });
      document.querySelectorAll('.view-toggle-mini button').forEach(function(b){ b.addEventListener('click', function(){ proiecteViewMode = b.dataset.mode; render(); }); });
      return;
    }

    html += proiecteViewMode === 'traseu' ? renderProiecteTraseu(list) : renderProiecteTabel(list);

    board.innerHTML = html;
    document.getElementById('chk-finalizate').addEventListener('change', function(e){ showFinalizate = e.target.checked; render(); });
    document.querySelectorAll('.view-toggle-mini button').forEach(function(b){ b.addEventListener('click', function(){ proiecteViewMode = b.dataset.mode; render(); }); });
    document.querySelectorAll('[data-edit]').forEach(function(el){ el.addEventListener('click', function(){ openProjectModal(el.dataset.edit); }); });
  }
  function renderProiecteTabel(list){
    var html = '<div class="table-wrap"><table class="proj-table"><thead><tr><th>Cod</th><th>Client</th><th>Tip</th><th>Stare</th><th>Termen</th><th></th></tr></thead><tbody>';
    list.forEach(function(p){
      var st = stationById(p.stationId);
      var stareHtml = esc(st ? st.name : '—');
      var bd = pieceBreakdown(p);
      var badges = piesaStations().map(function(s){ return bd[s.id] ? '<span>'+bd[s.id]+' '+esc(s.name)+'</span>' : ''; }).join('');
      if(badges) stareHtml += '<div class="t-badges" style="margin-top:4px;">'+badges+'</div>';
      html += '<tr><td class="t-code">'+esc(p.cod)+'</td><td>'+esc(p.client)+'</td><td>'+esc(displayTip(p))+'</td><td>'+stareHtml+'</td>';
      html += '<td><span class="badge badge-'+(p.finalizat?'done':urgencyOf(p))+'">'+esc(p.finalizat?'Finalizat':urgencyLabel(p))+'</span></td>';
      html += '<td><button class="btn btn-xs" data-edit="'+p.id+'">Editează</button></td></tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }
  function renderProiecteTraseu(list){
    var html = '<div class="table-wrap"><table class="traseu-table"><thead><tr><th class="traseu-proj-col">Proiect</th>';
    state.stations.forEach(function(s){
      html += '<th>' + esc(s.name) + '<span class="traseu-kind">' + (s.type==='piesa'?'piesă':'proiect') + '</span></th>';
    });
    html += '</tr></thead><tbody>';
    list.forEach(function(p){
      var grad = urgencyGradient(p);
      html += '<tr class="traseu-row" data-edit="' + p.id + '">';
      html += '<td class="traseu-proj-cell"' + (grad ? ' style="border-left:4px solid '+grad.border+';"' : '') + '>';
      html += '<span class="t-code">' + esc(p.cod) + '</span><span class="traseu-client">' + esc(p.client) + '</span>';
      html += '<span class="badge badge-' + (p.finalizat?'done':urgencyOf(p)) + '">' + esc(p.finalizat?'Finalizat':urgencyLabel(p)) + '</span></td>';
      state.stations.forEach(function(s){
        html += '<td class="traseu-cell">';
        if(s.type === 'proiect'){
          if(p.stationId === s.id) html += '<span class="traseu-here" title="Proiectul e aici acum">●</span>';
        } else {
          var pieces = (p.pieces||[]).filter(function(pc){ return pc.stationId === s.id; });
          if(pieces.length){
            html += '<div class="traseu-pieces">';
            pieces.forEach(function(pc){ html += '<span class="traseu-piece-chip">' + esc(pc.name) + '</span>'; });
            html += '</div>';
          }
        }
        html += '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  /* ================= REPARAȚII ================= */
  var REPAIR_STATUSES = [
    {id:'deschisa', name:'Deschisă'},
    {id:'in-lucru', name:'În lucru'},
    {id:'rezolvata', name:'Rezolvată'}
  ];
  function renderReparatii(){
    var board = document.getElementById('board');
    board.style.display='flex'; board.className='board';

    if(state.repairs.length === 0){
      board.innerHTML = '<div class="empty-state" style="margin:auto;"><h2>Nicio reparație înregistrată</h2><p>Când un proiect vechi are o problemă — balama cedată, vopsea zgâriată — deschide o reparație aici, legată de codul proiectului original.</p><button class="btn btn-primary" id="empty-add-r">+ Reparație nouă</button></div>';
      document.getElementById('empty-add-r').onclick = function(){ openRepairModal(null); };
      return;
    }

    var html = '';
    REPAIR_STATUSES.forEach(function(status, idx){
      var items = state.repairs.filter(function(r){ return r.status===status.id && matchesSearch(r.cod, r.client); });
      html += '<div class="column proiect" data-rstatus="'+status.id+'" style="animation-delay:'+(idx*40)+'ms">';
      html += '<div class="col-head"><div class="col-title" style="padding:2px 0;">'+esc(status.name)+'</div><span class="col-count">'+items.length+'</span></div>';
      html += '<div class="col-body" data-rstatus="'+status.id+'">';
      if(items.length===0) html += '<div class="col-empty">Nimic aici.</div>';
      else items.forEach(function(r){
        var si = REPAIR_STATUSES.findIndex(function(s){ return s.id===r.status; });
        html += '<div class="repair-card" draggable="true" data-repair="'+r.id+'">';

  function openFeedbackModal(){
    var root = document.getElementById('modal-root');
    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal">';
    html += '<div class="modal-head"><h3>Feedback</h3><button class="modal-close" id="modal-close">✕</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field"><label>Mesajul tău</label><textarea id="fb-text" placeholder="Ce observi, ce ai vrea schimbat, ce nu merge…" style="min-height:110px;"></textarea></div>';
    html += '<div class="field-hint" id="fb-status" style="margin:0;"></div>';
    html += '</div><div class="modal-foot"><div class="left"><button class="btn btn-ghost btn-sm" id="fb-export">Exportă tot (.txt)</button></div>';
    html += '<div><button class="btn btn-ghost" id="btn-cancel">Închide</button> <button class="btn btn-primary" id="fb-send">Trimite</button></div></div></div></div>';
    root.innerHTML = html;

    function close(){ root.innerHTML=''; }
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('btn-cancel').addEventListener('click', close);
    document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target.id==='modal-overlay') close(); });

    document.getElementById('fb-send').addEventListener('click', function(){
      var text = document.getElementById('fb-text').value.trim();
      var statusEl = document.getElementById('fb-status');
      if(!text) return;
      if(!hasFirebase){ statusEl.textContent = 'Feedback indisponibil — nu e configurat Firebase.'; return; }
      var sendBtn = document.getElementById('fb-send');
      sendBtn.disabled = true;
      feedbackUrl().then(function(url){
        return fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({text: text, ts: new Date().toISOString()})
        });
      }).then(function(res){
        if(!res.ok) throw new Error('feedback send failed');
        close();
        showToast('✓');
      }).catch(function(){
        statusEl.textContent = 'Nu s-a putut trimite. Încearcă din nou.';
        sendBtn.disabled = false;
      });
    });

    document.getElementById('fb-export').addEventListener('click', function(){
      if(!hasFirebase){ alert('Feedback indisponibil — nu e configurat Firebase.'); return; }
      feedbackUrl().then(function(url){ return fetch(url); }).then(function(res){ return res.json(); }).then(function(raw){
        var entries = [];
        if(raw) Object.keys(raw).forEach(function(k){ entries.push(raw[k]); });
        entries.sort(function(a,b){ return (a.ts||'') < (b.ts||'') ? -1 : 1; });
        var lines = entries.length
          ? entries.map(function(e){ return '[' + (e.ts||'?') + ']\n' + (e.text||'') + '\n'; })
          : ['Niciun feedback trimis încă.'];
        var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'feedback-atelier-' + isoToday() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(){ alert('Nu s-a putut încărca feedback-ul.'); });
    });
  }

  function makeSidebarController(asideId, handleId, closeId, hideDelay, pinStorageKey){
    var timer = null;
    var aside = document.getElementById(asideId);
    var handle = document.getElementById(handleId);
    var closeBtn = document.getElementById(closeId);
    var pinned = false;
    var wasVisible = false;
    try { pinned = localStorage.getItem(pinStorageKey) === '1'; } catch(e){ /* ignore */ }
    function trackMobileVisibility(){
      var visible = aside.classList.contains('visible');
      if(isMobile() && visible !== wasVisible) updateBackdrop(visible ? 1 : -1);
      wasVisible = visible;
    }
    function show(){
      aside.classList.add('visible');
      trackMobileVisibility();
      clearTimeout(timer);
      // on mobile there's no hover-out to trigger auto-hide, so it must stay open until explicitly closed
      if(!pinned && !isMobile()) timer = setTimeout(hide, hideDelay);
    }
    function hide(){
      if(pinned) return;
      aside.classList.remove('visible');
      trackMobileVisibility();
    }
    function isPinned(){ return pinned; }
    function setPinned(val){
      pinned = val;
      try { localStorage.setItem(pinStorageKey, pinned ? '1' : '0'); } catch(e){ /* ignore */ }
      aside.classList.toggle('pinned', pinned);
      if(pinned){ clearTimeout(timer); aside.classList.add('visible'); trackMobileVisibility(); }
      else { timer = setTimeout(hide, hideDelay); }
    }
    aside.classList.toggle('pinned', pinned);
    aside.addEventListener('mouseenter', function(){ clearTimeout(timer); aside.classList.add('visible'); trackMobileVisibility(); });
    aside.addEventListener('mouseleave', function(){ if(!pinned) timer = setTimeout(hide, 1200); });
    handle.addEventListener('mouseenter', show);
    handle.addEventListener('click', show);
    if(closeBtn) closeBtn.addEventListener('click', hide);
    return { show: show, hide: hide, clearTimer: function(){ clearTimeout(timer); }, isPinned: isPinned, setPinned: setPinned };
  }

  // Live sync: apply changes other people save, as they happen. Held back only while
  // this user is mid-edit (a field focused or a modal open), then applied on the next tick.
  function userIsBusy(){
    var mr = document.getElementById('modal-root');
    if(mr && mr.children.length) return true;
    if(nodeDragging || canvasDragging || colDragging || resizeDragging) return true;
    var a = document.activeElement;
    if(!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA' && a.tagName !== 'SELECT')) return false;
    // the top-bar search box is a filter, not data entry — it must not block live sync
    return !!(a.closest && a.closest('#board, .team-sidebar'));
  }
  function applyRemote(incoming){
    if(stableStringify(incoming) === stableStringify(state)) return;
    state = incoming;
    noteLocalWrite(stableStringify(state));
    setAddButton();
    render();
    showToast('Tablou actualizat — modificări de la un coleg.');
  }
  // A remote change came in while the user was mid-edit — re-fetch the current DB state
  // (not a possibly-stale stashed copy) and apply it now that it's safe.
  function flushRemote(){
    if(!remoteDirty || !hasRtdb || userIsBusy()) return;
    remoteDirty = false;
    dbRef().once('value').then(function(snap){
      var raw = snap.val();
      if(!raw) return;
      try {
        var incoming = resolveVersioned(raw);
        if(recentLocalSigs.indexOf(stableStringify(incoming)) !== -1) return;
        console.log('[sync] aplic modificarea care aștepta');
        applyRemote(incoming);
      } catch(e){ /* ignore */ }
    }).catch(function(){});
  }
  function attachLiveSync(){
    console.log('[sync] hasAuth=' + hasAuth + ' hasRtdb=' + hasRtdb + ' firebase.database=' + (typeof (window.firebase && firebase.database)));
    if(liveSyncAttached) return;
    if(!hasRtdb){ console.warn('[sync] RTDB SDK indisponibil — rămân pe REST (fără actualizări live)'); return; }
    liveSyncAttached = true;
    try {
      firebase.database().ref('.info/connected').on('value', function(s){
        console.log('[sync] ' + (s.val() ? 'conectat la Firebase' : 'offline'));
      });
    } catch(e){ /* ignore */ }
    console.log('[sync] listener live pornit');
    dbRef().on('value', function(snap){
      var raw = snap.val();
      if(!raw) return;
      var incoming;
      try { incoming = resolveVersioned(raw); } catch(e){ console.warn('[sync] snapshot invalid', e); return; }
      var sig = stableStringify(incoming);
      if(recentLocalSigs.indexOf(sig) !== -1 || sig === stableStringify(state)){ return; } // our own echo / no change
      if(userIsBusy()){ console.log('[sync] schimbare primită — o aplic după ce termini editarea'); remoteDirty = true; return; }
      console.log('[sync] schimbare primită de la un coleg — aplic');
      applyRemote(incoming);
    }, function(err){
      console.warn('[sync] listener respins:', err && err.code, err && err.message);
    });
    setInterval(flushRemote, 1000);
    document.addEventListener('focusout', function(){ setTimeout(flushRemote, 60); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(flushRemote, 60); });
  }

  if(hasAuth){
    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type="submit"]');
      var errEl = document.getElementById('login-error');
      var pass = document.getElementById('login-password').value;
      btn.disabled = true;
      errEl.textContent = '';
      firebase.auth().signInWithEmailAndPassword(SHARED_LOGIN_EMAIL, pass).catch(function(){
        errEl.textContent = 'Parolă greșită. Încearcă din nou.';
        btn.disabled = false;
      });
    });
    firebase.auth().onAuthStateChanged(function(user){
      if(user){
        startApp();
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  } else {
    startApp();
  }
})();
</script>
</body>
