<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panou de Producție — Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#f1f1f1;
    --bg-grid-dot: rgba(0,0,0,0.09);
    --panel:#ffffff;
    --panel-2:#e8e8e8;
    --panel-3:#d9d9d9;
    --ink:#141414;
    --ink-dim:#5a5a5a;
    --ink-faint:#8a8a8a;
    --border: rgba(0,0,0,0.15);
    --accent:#1f1f1f;
    --accent-ink:#ffffff;
    --steel:#a8c8dc;
    --ok:#a8d9b8;
    --warn:#f0dd9a;
    --danger:#e8a8a0;
    --radius: 10px;
    --shadow: 0 8px 22px rgba(0,0,0,0.14);
    --dur: 180ms;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-grid-dot) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: 'Raleway', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea{ font-family: inherit; }
  button{ cursor:pointer; }
  ::selection{ background: var(--accent); color: var(--accent-ink); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .app{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- HEADER ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; }
  .topbar-actions{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-left:auto; }
  .brand-title{
    font-family:'Raleway', sans-serif; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; font-size:19px; color:var(--ink);
  }
  .brand-title span{ color:var(--accent); }
  .brand-sub{ font-size:11px; color:var(--ink-faint); letter-spacing:0.08em; text-transform:uppercase; margin-top:2px; }

  .tabs{ display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .tabs button{
    border:none; background:transparent; color:var(--ink-dim); font-weight:600; font-size:12.5px;
    padding:7px 13px; border-radius:999px; transition: background var(--dur), color var(--dur); white-space:nowrap;
  }
  .tabs button.active{ background:var(--accent); color:var(--accent-ink); }

  .search-input{
    background:var(--panel-2); border:1px solid var(--border); color:var(--ink);
    padding:8px 12px; border-radius:8px; font-size:13px; width:170px;
  }
  .search-input::placeholder{ color:var(--ink-faint); }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--ink);
    padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600;
    transition: transform var(--dur), background var(--dur), border-color var(--dur);
    white-space:nowrap;
  }
  .btn:hover{ background:var(--panel-3); border-color: rgba(0,0,0,0.28); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn-primary:hover{ background:#3a3a3a; }
  .btn-ghost{ background:transparent; }
  .btn-danger-outline{ color:#a85248; border-color: rgba(200,110,95,0.45); background:transparent; }
  .btn-danger-outline:hover{ background: rgba(200,110,95,0.14); }
  .btn-icon{ padding:8px 10px; }
  .btn-sm{ padding:5px 9px; font-size:12px; }
  .btn-xs{ padding:3px 7px; font-size:11px; border-radius:6px; }
  .btn[disabled]{ opacity:0.35; pointer-events:none; }

  /* ---------- MAIN / BOARD ---------- */
  main{ flex:1; overflow:auto; padding:18px 20px; }
  .board{ display:flex; gap:14px; align-items:flex-start; height:100%; }

  .column{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    width:280px; min-width:280px;
    display:flex; flex-direction:column;
    max-height:100%;
    animation: rise 320ms ease both;
  }
  .column.piesa{ border-top:3px solid var(--steel); width:250px; min-width:250px; }
  .column.proiect{ border-top:3px solid var(--accent); }
  .column.drag-over{ box-shadow: 0 0 0 2px rgba(0,0,0,0.4) inset; }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform:none; } }

  .column.dragging-col{ box-shadow: 0 16px 40px rgba(0,0,0,0.35); z-index:50; opacity:0.97; }
  .col-head{ display:flex; align-items:center; gap:8px; padding:11px 12px 9px 14px; border-bottom:1px solid var(--border); cursor:grab; user-select:none; }
  .col-head:active{ cursor:grabbing; }

  .proj-wrap{ width:max-content; margin-bottom:16px; position:relative; }
  .proj-cluster-tab{
    display:inline-flex; align-items:baseline; gap:10px; position:relative; z-index:1;
    background:var(--panel-2); border:1px solid var(--border); border-bottom:none;
    border-radius:10px 10px 0 0; padding:8px 20px; margin:0 0 -1px 16px;
    font-family:'Raleway',sans-serif; letter-spacing:0.02em;
    cursor:grab; user-select:none;
  }
  .proj-cluster-tab .pct-code{ font-size:30px; font-weight:800; color:var(--accent); }
  .proj-cluster-tab .pct-client{ font-size:28px; font-weight:600; color:var(--ink-dim); }
  .proj-cluster-tab:active{ cursor:grabbing; }
  .proj-wrap.node-dragging .proj-cluster-tab{ cursor:grabbing; }
  .proj-wrap.node-dragging{ z-index:50; }
  .proj-wrap.node-dragging .proj-cluster{ box-shadow: 0 16px 40px rgba(0,0,0,0.35); opacity:0.97; }
  .proj-cluster{ background:var(--panel); border:1px solid var(--border); border-radius:0 10px 10px 10px; overflow:hidden; box-shadow:var(--shadow); }
  .proj-cluster-head{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel-2); }
  .proj-cluster-client{ color:var(--ink-dim); font-size:12.5px; }
  /* culorile fazei — folosite si de eticheta de faza, si de inelul din jurul dosarului */
  .proj-wrap.phase-proiect{ --ph:#2f80c0; --ph-halo:rgba(47,128,192,0.32); }
  .proj-wrap.phase-piesa{   --ph:#e0842a; --ph-halo:rgba(224,132,42,0.32); }
  .proj-wrap.phase-montaj{  --ph:#c0392b; --ph-halo:rgba(192,57,43,0.32); }
  /* inel colorat dupa faza, pe toate dosarele — calm, static, "harta color dintr-o privire" */
  .proj-wrap .proj-cluster{ box-shadow:0 0 0 3px var(--ph-halo, transparent), var(--shadow); }
  .proj-wrap[class*="phase-"] .proj-cluster-tab{ border-color:var(--ph); }
  /* eticheta cu faza curenta — "esti aici", nu alarma (folosita si in registru, fara ancestor .proj-cluster-tab) */
  .pct-stage{
    align-self:center; padding:2px 10px; border-radius:999px;
    font-size:12px; font-weight:700; letter-spacing:0.02em;
    color:#fff; white-space:nowrap; background:var(--ph,#888);
  }
  .pct-stage.phase-proiect{ --ph:#2f80c0; }
  .pct-stage.phase-piesa{   --ph:#e0842a; }
  .pct-stage.phase-montaj{   --ph:#c0392b; }
  /* proiect cu ceva incomplet: inel mai gros (static) + bara care enumera ce lipseste = singura alarma */
  .proj-wrap.has-warn .proj-cluster{ border-color:var(--ph, #c0392b); box-shadow:0 0 0 5px var(--ph-halo, rgba(192,57,43,0.32)), var(--shadow); }
  .proj-wrap.has-warn .proj-cluster-tab{ border-color:var(--ph, #c0392b); }
  .proj-warn-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    padding:9px 16px; background:#fbe6e3; color:#8c2a1e;
    border-bottom:1px solid rgba(192,57,43,0.35);
    font-size:12.5px; font-weight:700;
  }
  .proj-warn-bar .pwb-sep{ opacity:0.5; font-weight:400; }
  .proj-cluster-stages{ display:flex; align-items:stretch; }
  .proj-stage-box{ flex:0 0 220px; border-right:1px dashed var(--border); display:flex; flex-direction:column; }
  .proj-stage-box:last-child{ border-right:none; }
  .proj-stage-box.piesa{ background: rgba(0,0,0,0.02); }
  .proj-stage-head{ font-family:'Raleway',sans-serif; text-transform:uppercase; font-size:10.5px; letter-spacing:0.03em; color:var(--ink-faint); padding:9px 10px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .proj-stage-head > span{ min-width:0; word-break:break-word; }
  .proj-stage-head .col-actions{ opacity:0.6; flex:none; }
  .proj-stage-head .col-actions:hover{ opacity:1; }
  .proj-stage-head .col-actions button{ padding:3px 4px; font-size:12px; }
  .proj-stage-box .col-body{ padding:8px; gap:8px; min-height:76px; flex:1; }
  .head-add-stage{ display:flex; flex-wrap:wrap; gap:6px; }
  .head-add-stage button{
    border:1px dashed var(--border); background:transparent; color:var(--ink-dim);
    border-radius:6px; padding:3px 10px; font-size:10.5px; font-weight:600;
    text-transform:none; letter-spacing:0;
  }
  .head-add-stage button:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---------- REGISTRU — listă verticală de proiecte, rânduri pliabile (înlocuiește harta canvas) ---------- */
  .reg{ border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--panel); }
  .reg-row{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--border); padding:9px 12px; }
  .reg-row:first-child{ border-top:0; }
  .reg-row:hover{ background:var(--panel-2); }
  .reg-row.phase-proiect{ box-shadow:inset 3px 0 0 #2f80c0; }
  .reg-row.phase-piesa{   box-shadow:inset 3px 0 0 #e0842a; }
  .reg-row.phase-montaj{   box-shadow:inset 3px 0 0 #c0392b; }
  .reg-row.has-warn{ box-shadow:inset 4px 0 0 #c0392b; background:rgba(192,57,43,0.05); }
  .reg-row .rr-cod{ font-weight:700; font-size:12.5px; font-variant-numeric: tabular-nums; }
  .mono{ font-family:monospace; }
  .reg-row .rr-cli{ font-weight:600; min-width:90px; }
  .reg-bar{ display:flex; height:7px; width:120px; border-radius:4px; overflow:hidden; background:var(--panel-3); flex:none; }
  .reg-bar i{ display:block; }
  .reg-bar i.pregatire{ background:#2f80c0; }
  .reg-bar i.exec{ background:#e0842a; }
  .reg-bar i.montaj{ background:#c0392b; }
  .reg-count{ font-family:monospace; font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .reg-term{ font-family:monospace; font-size:12px; color:var(--ink-dim); white-space:nowrap; margin-left:auto; }
  .reg-term.late{ color:#c0392b; font-weight:700; }
  .reg-warn{ width:8px; height:8px; border-radius:50%; background:#c0392b; flex:none; }
  .reg-chev{ color:var(--ink-dim); transition:transform .15s; flex:none; }
  .reg-row[aria-expanded="true"] .reg-chev{ transform:rotate(90deg); }
  .reg-detail{ border-top:1px solid var(--border); background:var(--panel-2); padding:12px; }
  .reg-detail-head{ display:flex; flex-direction:column; gap:8px; }
  .reg-detail-head .card-actions{ display:flex; flex-wrap:wrap; gap:6px; }
  .reg-orders-toggle{ align-self:flex-start; background:var(--panel-3); border:1px solid var(--border); color:var(--ink); border-radius:6px; padding:4px 9px; font-size:12px; cursor:pointer; }
  .reg-orders{ margin-top:2px; }
  .reg-strip{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font-size:12px; }
  .reg-strip .rs-k{ display:flex; align-items:center; gap:5px; }
  .reg-strip .rs-dim{ color:var(--ink-dim); }
  .reg-strip .rs-term{ font-family:monospace; }
  .reg-strip .rs-term.late{ color:#c0392b; font-weight:700; }
  .reg-strip .rs-sep{ width:1px; align-self:stretch; background:var(--border); }
  .reg-strip .rs-grow{ flex:1 1 20px; }
  .reg-strip .reg-bar.mini{ width:78px; height:6px; }
  .reg-strip .reg-orders-toggle{ align-self:auto; padding:3px 8px; }
  .reg-strip .rs-more{ background:var(--panel-2); border:1px solid var(--border); color:var(--ink); border-radius:6px; padding:2px 9px; cursor:pointer; font-size:14px; line-height:1; }
  .reg-attn{ display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; background:rgba(192,57,43,0.09); border:1px solid rgba(192,57,43,0.3); color:#a3392c; border-radius:8px; padding:6px 11px; font-size:12px; }
  .reg-more-body{ display:flex; flex-direction:column; gap:8px; }
  .reg-detail-pipe .proj-stage-box.thin{ flex:0 0 34px; background:var(--panel-2); }
  .reg-detail-pipe .proj-stage-box.thin .proj-stage-head{ writing-mode:vertical-rl; text-orientation:mixed; padding:8px 2px; border-bottom:0; justify-content:center; gap:0; }
  .reg-detail-pipe .proj-stage-box.thin .col-body{ min-height:28px; padding:4px; }
  .reg-detail-pipe{ display:flex; gap:8px; overflow-x:auto; padding-top:10px; }
  .reg-detail-pipe .proj-stage-box{ flex:0 0 150px; }
  .reg-detail-pipe .head-add-stage{ flex:0 0 auto; }
  .reg-detail-pipe .proj-stage-box.is-here{ box-shadow: inset 0 3px 0 var(--accent); }
  .reg-detail-pipe .proj-stage-head[draggable="true"]{ cursor:grab; }
  .reg-detail-pipe .proj-stage-head[draggable="true"]:active{ cursor:grabbing; }
  .proj-stage-box.dragging{ opacity:0.4; }
  .stage-here{ font-size:9px; font-weight:700; color:var(--accent); margin-left:6px; letter-spacing:0.03em; white-space:nowrap; }

  /* ---------- SIDE PANEL — „comenzi materiale", iese din marginea stângă a dosarului.
     Mâner, hover, auto-hide, pin sincronizat per proiect. ---------- */
  .side-panel{ position:absolute; top:28px; z-index:20; display:flex; align-items:flex-start; }
  .side-handle{
    flex:none; writing-mode:vertical-rl; text-orientation:mixed;
    background:var(--panel-2); border:1px solid var(--border);
    padding:12px 6px;
    font-family:'Raleway',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--ink-dim); cursor:pointer; white-space:nowrap;
    box-shadow:var(--shadow);
  }
  .side-left .side-handle{ border-right:none; border-radius:8px 0 0 8px; }
  .side-handle:hover{ color:var(--ink); }
  .side-panel.open .side-handle{ display:none; }
  .side-body{
    display:none; width:270px;
    background:var(--panel); border:1px solid var(--border);
    padding:12px;
  }
  .side-left .side-body{ border-right:3px solid var(--accent); border-radius:10px 0 0 10px; box-shadow: -12px 0 30px rgba(0,0,0,0.18); }
  .side-panel.open .side-body{ display:block; }
  .side-head{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .side-title{ flex:1; font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:11px; color:var(--ink-dim); }
  .side-pin.pinned{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .side-count{ background:var(--panel-3); border-radius:999px; padding:1px 7px; font-size:9px; color:var(--ink-dim); }

  /* comenzi materiale — rânduri într-un panou îngust: stare+text+șterge sus, cantitate+furnizor jos */
  .side-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .order-row{
    display:grid; align-items:center; gap:6px 5px;
    grid-template-columns: 56px minmax(0,1fr) 24px;
    grid-template-areas: "status status del" "text text text" "qty supp supp";
  }
  .order-row + .order-row{ border-top:1px dashed var(--border); padding-top:8px; }
  .order-row input, .order-row select{ min-width:0; }
  .order-status{
    grid-area:status; justify-self:start; border:1px solid var(--border); border-radius:6px; padding:4px 8px;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; min-width:88px; text-align:center;
  }
  .order-status-de-comandat{ background: rgba(232,168,160,0.35); color:#a8483a; border-color: rgba(232,168,160,0.6); }
  .order-status-comandat{ background: rgba(240,221,154,0.4); color:#8a7020; border-color: rgba(240,221,154,0.7); }
  .order-status-primit{ background: rgba(168,217,184,0.4); color:#3d7a52; border-color: rgba(168,217,184,0.7); }
  .order-text{ grid-area:text; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:5px 8px; border-radius:6px; font-size:12px; }
  .order-qty{ grid-area:qty; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:5px 6px; border-radius:6px; font-size:12px; }
  .order-supplier{ grid-area:supp; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:5px 6px; border-radius:6px; font-size:12px; }
  .order-del{ grid-area:del; justify-self:end; background:transparent; border:1px solid var(--border); color:var(--ink-faint); border-radius:6px; width:24px; height:24px; font-size:12px; padding:0; }
  .order-del:hover{ color:#a85248; border-color: rgba(200,110,95,0.45); }
  .order-add{ align-self:flex-start; }
  .card-orders-line{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-dim); margin-bottom:8px; }

  .col-resize{
    position:absolute; right:0; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; z-index:4;
    background: linear-gradient(135deg, transparent 50%, var(--ink-faint) 50%, var(--ink-faint) 58%, transparent 58%, transparent 74%, var(--ink-faint) 74%, var(--ink-faint) 82%, transparent 82%);
    opacity:0.5; border-radius:0 0 8px 0;
  }
  .col-resize:hover{ opacity:1; background: linear-gradient(135deg, transparent 50%, var(--accent) 50%, var(--accent) 58%, transparent 58%, transparent 74%, var(--accent) 74%, var(--accent) 82%, transparent 82%); }
  .col-title{
    font-family:'Raleway', sans-serif; font-weight:600; text-transform:uppercase;
    font-size:12.5px; letter-spacing:0.04em; flex:1;
    background:transparent; border:none; color:var(--ink); padding:2px 0; width:100%;
  }
  .col-kind{ font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); display:block; margin-top:1px; }
  .col-count{
    font-family:'Raleway', sans-serif; font-size:11px; color:var(--ink-faint);
    background:var(--panel-2); border-radius:999px; padding:2px 8px; min-width:20px; text-align:center;
  }
  .col-actions{ display:flex; gap:2px; }
  .col-actions button{ background:transparent; border:none; color:var(--ink-faint); font-size:13px; padding:4px 6px; border-radius:6px; }
  .col-actions button:hover{ color:var(--ink); background:var(--panel-2); }

  .col-body{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:9px; min-height:60px; }
  .col-empty{ color:var(--ink-faint); font-size:12px; font-style:italic; padding:14px 6px; text-align:center; }

  .add-col-wrap{ width:220px; min-width:220px; padding-top:2px; }
  .add-col-btn{
    width:100%; padding:12px; border:1.5px dashed var(--border); border-radius:var(--radius);
    background:transparent; color:var(--ink-dim); font-weight:600; font-size:13px;
    transition: border-color var(--dur), color var(--dur);
  }
  .add-col-btn:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---------- PROJECT CARD (work-order ticket) ---------- */
  .card{ background: var(--panel-2); border:1px solid var(--border); border-radius:8px; position:relative; transition: box-shadow var(--dur), transform var(--dur), opacity var(--dur); }
  .card:hover{ box-shadow: var(--shadow); }
  .card.dragging{ opacity:0.35; transform: rotate(-1.5deg) scale(0.98); }
  .card-drag-handle{ cursor:grab; }
  .card-drag-handle:active{ cursor:grabbing; }
  .card-stub{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px 8px 20px; position:relative; }
  .card-stub::before{ content:''; position:absolute; left:6px; top:50%; transform:translateY(-50%); width:8px; height:8px; border-radius:50%; background: var(--panel); box-shadow: inset 0 0 0 1px var(--border); }
  .card-code{ font-family:'Raleway', sans-serif; font-weight:600; font-size:12.5px; color:var(--accent); letter-spacing:0.02em; }

  .card-notes{ font-size:12.5px; color:var(--ink-dim); margin-bottom:8px; line-height:1.4; }
  .sub-piece-btn{ flex:none; background:transparent; border:1px solid var(--border); color:var(--ink-faint); border-radius:5px; width:22px; height:22px; font-size:11px; padding:0; }
  .sub-piece-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .sub-piece-btn.send{ color:#333333; border-color:rgba(0,0,0,0.45); }

  .card-actions{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

  /* ---------- PIECE CARD (compact, on the floor) ---------- */
  .piece-card{ position:relative; background: var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--steel); border-radius:7px; padding:9px 10px; cursor:grab; transition: box-shadow var(--dur), transform var(--dur), opacity var(--dur); }

  .piece-card.dragging{ opacity:0.35; transform: rotate(-1.5deg) scale(0.98); }
  .piece-card .p-code{ font-family:'Raleway', sans-serif; font-size:11px; color:var(--accent); font-weight:600; }
  .piece-card .p-name{ font-size:13px; font-weight:600; margin:2px 0 1px; }
  .piece-card .p-color{ font-size:11px; color:#000000; font-weight:600; margin-bottom:2px; }

  .piece-btn-row{ display:flex; gap:6px; margin-top:6px; }
  .piece-nav{ display:flex; justify-content:space-between; gap:6px; margin-top:8px; }

  .piece-nav button:hover{ color:var(--ink); border-color: var(--steel); }

  /* ---------- EXEC SUMMARY STRIP ---------- */
  .exec-summary{ width:100%; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; }
  .exec-summary-title{ font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:12px; color:var(--ink-dim); margin-bottom:10px; }
  .exec-list{ display:flex; flex-wrap:wrap; gap:10px; }
  .exec-chip{ display:flex; align-items:center; gap:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; }
  .exec-chip .g-code{ font-family:'Raleway', sans-serif; font-size:11.5px; color:var(--accent); font-weight:600; }
  .exec-chip .g-client{ font-size:12.5px; font-weight:600; }
  .exec-chip .g-breakdown{ font-size:11px; color:var(--ink-faint); font-family:'Raleway', sans-serif; }

  /* ---------- EMPTY STATE ---------- */
  .empty-state{ margin:auto; max-width:420px; text-align:center; padding:50px 30px; background:var(--panel); border:1px dashed var(--border); border-radius:var(--radius); }

  .empty-state p{ color:var(--ink-dim); font-size:13.5px; line-height:1.5; margin:0 0 18px; }

  .col-body.drag-over{ box-shadow: 0 0 0 2px rgba(0,0,0,0.45) inset; border-radius:8px; }

  .lanes-row{ display:flex; flex-direction:column; }
  .lane{ min-width:0; display:flex; flex-direction:column; border-bottom:1px dashed var(--border); }

  .lane-title{ flex:1; min-width:0; background:transparent; border:none; color:var(--ink-faint); font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:10.5px; padding:2px 0; }
  .lane-title:focus{ color:var(--ink); }
  .lane-del{ flex:none; background:transparent; border:none; color:var(--ink-faint); font-size:11px; padding:2px 4px; border-radius:5px; text-transform:none; letter-spacing:0; }
  .lane-del:hover{ color:var(--danger); background:var(--panel-3); }
  .lane .col-body{ padding:8px; gap:8px; min-height:50px; }

  /* ---------- TABLE (Proiecte) ---------- */
  .table-wrap{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; height:100%; }
  table.proj-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.proj-table th{ text-align:left; font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:11px; color:var(--ink-faint); padding:12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); }
  table.proj-table td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.proj-table tr:hover td{ background: rgba(0,0,0,0.05); }
  .comenzi-table tr.comenzi-group:hover td{ background:var(--panel-2); }
  .comenzi-table .comenzi-group td{ background:var(--panel-2); font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:11px; font-weight:700; color:var(--ink-dim); padding:8px 14px; }
  .comenzi-group-n{ color:var(--ink-faint); font-weight:600; margin-left:6px; }
  .cmz-inp{ width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:6px 8px; border-radius:6px; font-size:12.5px; }
  .cmz-proj{ cursor:pointer; white-space:nowrap; }
  .cmz-proj:hover .t-code{ text-decoration:underline; }
  .furn-panel{ border:1px solid var(--border); border-radius:8px; margin-bottom:14px; background:var(--panel); }
  .furn-panel-head{ display:flex; align-items:center; gap:8px; width:100%; background:none; border:0; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; }
  .furn-count{ color:var(--ink-dim); font-weight:400; }
  .furn-chev{ margin-left:auto; color:var(--ink-dim); transition:transform .15s; }
  .furn-panel-head[aria-expanded="true"] .furn-chev, .furn-panel.open .furn-chev{ transform:rotate(90deg); }
  .furn-panel-body{ padding:4px 12px 12px; display:flex; flex-direction:column; gap:6px; }
  .furn-row{ display:grid; grid-template-columns:1.4fr 1.4fr 2fr 32px; gap:8px; align-items:center; }
  .furn-row-head{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-dim); padding:0 2px; }
  .furn-inp{ background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:6px 9px; border-radius:6px; font-size:12.5px; }
  .furn-del{ background:transparent; border:1px solid var(--border); color:var(--ink-faint); border-radius:6px; width:28px; height:28px; cursor:pointer; }

  @media (max-width:640px){ .furn-row{ grid-template-columns:1fr 1fr; } .furn-row > *:nth-child(3){ grid-column:1 / -1; } .furn-row-head{ display:none; } }
  .fin-detail td{ background:var(--panel-2); }
  .fin-detail-box{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-dim); padding:4px 0; }
  .fin-sec b{ color:var(--ink); }
  .fin-log-type{ display:inline-block; background:var(--panel-2); border:1px solid var(--border); border-radius:5px; padding:1px 7px; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-dim); }
  .t-code{ font-family:'Raleway', sans-serif; color:var(--accent); font-weight:600; }
  .t-badges span{ font-family:'Raleway', sans-serif; font-size:10.5px; color:var(--ink-dim); background:var(--panel-2); border-radius:5px; padding:2px 6px; margin-right:4px; display:inline-block; margin-bottom:3px; }
  .toolbar-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:12.5px; color:var(--ink-dim); flex-wrap:wrap; }
  .toolbar-row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .view-toggle-mini{ display:flex; gap:6px; margin-left:auto; }
  .view-toggle-mini button{ background:var(--panel-2); border:1px solid var(--border); color:var(--ink-dim); padding:6px 12px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .view-toggle-mini button.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .traseu-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .traseu-table th{ text-align:left; font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:10.5px; color:var(--ink-faint); padding:10px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); white-space:nowrap; z-index:1; }
  .traseu-kind{ display:block; font-size:9px; text-transform:none; letter-spacing:0; color:var(--ink-faint); font-weight:400; margin-top:1px; }
  .traseu-proj-col{ position:sticky; left:0; z-index:3; min-width:170px; }
  .traseu-row{ cursor:pointer; }
  .traseu-row:hover td{ background: rgba(0,0,0,0.05); }
  .traseu-row:hover .traseu-proj-cell{ background: var(--panel-2); }
  .traseu-proj-cell{ position:sticky; left:0; z-index:2; background:var(--panel); min-width:170px; padding:10px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); vertical-align:middle; }
  .traseu-proj-cell .t-code{ display:block; }
  .traseu-client{ display:block; font-size:11.5px; color:var(--ink-dim); margin:1px 0 5px; }
  .traseu-cell{ min-width:112px; max-width:150px; padding:8px; border-bottom:1px solid var(--border); border-right:1px dashed var(--border); vertical-align:top; }
  .traseu-here{ color:var(--ok); font-size:20px; line-height:1; }
  .traseu-pieces{ display:flex; flex-direction:column; gap:3px; }
  .traseu-piece-chip{ background:var(--panel-3); border-radius:5px; padding:2px 6px; font-size:10.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }

  /* ---------- GANTT / CRONOLOGIE ---------- */
  .gantt-toolbar{ display:flex; align-items:center; gap:10px; padding:0 2px 10px; flex-wrap:wrap; }
  .gantt-zoom{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .gantt-zoom button{ border:none; background:var(--panel); padding:7px 14px; font-size:12.5px; cursor:pointer; color:var(--ink-dim); }
  .gantt-zoom button.active{ background:var(--accent); color:var(--accent-ink); }
  .gantt-hint{ font-size:11.5px; color:var(--ink-faint); }
  .gantt-wrap{ overflow:auto; height:calc(100% - 44px); max-height:calc(100vh - 150px); background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); }
  .gantt-row{ display:flex; }
  .gantt-row:nth-child(even) .gantt-track{ background-color: rgba(0,0,0,0.015); }
  .gantt-row-header{ position:sticky; top:0; z-index:3; background:var(--panel); }
  .gantt-label{ position:sticky; left:0; z-index:2; width:210px; min-width:210px; background:var(--panel); border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; flex-direction:column; justify-content:center; gap:2px; cursor:pointer; }
  .gantt-label:hover{ background:var(--panel-2); }
  .gantt-row-header .gantt-label{ z-index:4; cursor:default; }
  .gantt-row-header .gantt-label:hover{ background:var(--panel); }
  .gantt-label .g-code{ font-family:'Raleway', sans-serif; font-size:11.5px; color:var(--accent); font-weight:600; }
  .gantt-label .g-client{ font-size:12.5px; font-weight:600; }
  .gantt-label .g-slip{ font-size:10.5px; font-weight:700; margin-top:1px; }
  .gantt-track{ position:relative; border-bottom:1px solid var(--border); }
  .gantt-header-days{ display:flex; border-bottom:1px solid var(--border); }
  .gantt-daycell{ flex:none; text-align:center; font-family:'Raleway', sans-serif; font-size:10px; color:var(--ink-faint); padding:9px 0 5px; border-right:1px solid rgba(0,0,0,0.06); }
  .gantt-daycell.is-today{ color:#b3402f; font-weight:800; }
  .gantt-daycell .g-month{ display:block; color:var(--accent); font-weight:700; font-size:9px; text-transform:uppercase; margin-top:1px; }
  .gantt-today-line{ position:absolute; top:0; bottom:0; width:2px; background:#c0392b; z-index:2; pointer-events:none; }
  .gantt-seg{ position:absolute; top:9px; height:22px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; overflow:hidden; opacity:0.5; cursor:pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.22); }
  .gantt-seg:hover{ filter:brightness(1.07); }
  .gantt-seg.is-current{ opacity:1; }
  .gantt-seg.seg-first{ border-radius:5px 0 0 5px; }
  .gantt-seg.seg-last{ border-radius:0 5px 5px 0; }
  .gantt-seg.seg-only{ border-radius:5px; }
  .gantt-seg:not(.seg-last):not(.seg-only){ border-right:1px solid rgba(255,255,255,0.6); }
  .gantt-seg.seg-ante{ background:#2f80c0; }
  .gantt-seg.seg-exec{ background:#e0842a; }
  .gantt-seg.seg-montaj{ background:#c0392b; }
  .gantt-seg.seg-done{ opacity:0.4; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.28) 0 4px, rgba(255,255,255,0) 4px 8px); }
  .gantt-seg.is-current{ opacity:1; box-shadow: 0 1px 4px rgba(0,0,0,0.22), 0 0 0 2px rgba(0,0,0,0.18); }
  .gantt-seg-remain{ position:absolute; top:0; bottom:0; background: rgba(255,255,255,0.5); }
  .gantt-overdue{ position:absolute; top:9px; height:22px; z-index:2; border-radius:0 4px 4px 0; pointer-events:none; background: repeating-linear-gradient(45deg, rgba(192,57,43,0.92) 0 5px, rgba(192,57,43,0.5) 5px 10px); }
  .gantt-overshoot{ position:absolute; top:9px; height:22px; background:repeating-linear-gradient(45deg, rgba(192,57,43,0.85), rgba(192,57,43,0.85) 6px, rgba(192,57,43,0.6) 6px, rgba(192,57,43,0.6) 12px); border-radius:0 5px 5px 0; z-index:3; display:flex; align-items:center; padding-left:6px; font-size:10px; font-weight:800; color:#fff; white-space:nowrap; pointer-events:none; }
  .gantt-deadline{ position:absolute; top:3px; bottom:3px; width:0; border-left:2px dashed #7a2018; z-index:3; pointer-events:none; }
  .gantt-deadline::after{ content:'⚑'; position:absolute; top:-2px; left:1px; font-size:11px; color:#7a2018; }
  .gantt-empty{ margin:auto; }

  /* ---------- REPARATII ---------- */
  .repair-card{ background: var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:8px; padding:11px 12px; cursor:grab; transition: box-shadow var(--dur), transform var(--dur), opacity var(--dur); }
  .repair-card:hover{ box-shadow: var(--shadow); }
  .repair-card.dragging{ opacity:0.35; transform: rotate(-1.5deg) scale(0.98); }
  .repair-card .r-code{ font-family:'Raleway', sans-serif; font-size:11.5px; color:var(--accent); font-weight:600; }
  .repair-card .r-client{ font-weight:600; font-size:13.5px; margin:3px 0 6px; }
  .repair-card .r-desc{ font-size:12.5px; color:var(--ink-dim); line-height:1.4; margin-bottom:8px; }
  .repair-card .r-date{ font-size:10.5px; color:var(--ink-faint); font-family:'Raleway', sans-serif; margin-bottom:8px; }

  /* ---------- MODAL ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(8,11,15,0.7); backdrop-filter: blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation: fade 160ms ease both; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:14px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: pop 200ms cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop{ from{ opacity:0; transform: translateY(12px) scale(0.97); } to{ opacity:1; transform:none; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); }
  .modal-head h3{ margin:0; font-family:'Raleway',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:16px; }
  .modal-close{ background:transparent; border:none; color:var(--ink-faint); font-size:20px; line-height:1; padding:4px 8px; }
  .modal-close:hover{ color:var(--ink); }
  .modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; }
  .field input, .field select, .field textarea{ width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:10px 12px; border-radius:8px; font-size:14px; }
  .field textarea{ resize:vertical; min-height:60px; font-family:inherit; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; }
  .color-history{ display:flex; flex-wrap:wrap; gap:8px; }
  .color-swatch{ width:26px; height:26px; border-radius:7px; border:1px solid var(--border); cursor:pointer; padding:0; transition: transform var(--dur); }
  .color-swatch:hover{ transform: scale(1.15); box-shadow: 0 0 0 2px var(--ink-faint); }
  .pieces-editor{ display:flex; flex-direction:column; gap:8px; }
  .piece-row{ display:flex; gap:8px; align-items:center; }
  .piece-row input.piece-name{ flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:8px 10px; border-radius:7px; font-size:13px; }
  .piece-row input.piece-color{ flex:0 0 130px; background:var(--panel-2); border:1px solid var(--border); color:var(--ink); padding:8px 10px; border-radius:7px; font-size:13px; }
  .btn-remove-piece{ background:transparent; border:1px solid var(--border); color:var(--ink-faint); border-radius:7px; width:32px; height:32px; flex:none; }
  .btn-remove-piece:hover{ color:#a85248; border-color: rgba(200,110,95,0.45); }
  .modal-stages{ display:flex; flex-wrap:wrap; gap:4px; }
  .modal-stage-chip{ font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--panel-3); color:var(--ink-dim); }
  .modal-stage-chip.piesa{ background:#fbeee1; color:#8a5a2b; }
  .modal-foot{ display:flex; justify-content:space-between; gap:10px; padding:16px 20px 20px; border-top:1px solid var(--border); }
  .modal-foot .left{ display:flex; gap:8px; }

  /* ---------- TOAST ---------- */
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-3); border:1px solid var(--border); color:var(--ink); padding:11px 18px; border-radius:8px; font-size:13px; box-shadow: var(--shadow); z-index:100; opacity:0; pointer-events:none; transition: opacity 220ms ease, transform 220ms ease; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  #toast.err{ border-color: rgba(200,110,95,0.45); color:#8a3428; }

  /* ---------- LOADING ---------- */
  #loading{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--ink-dim); font-size:14px; gap:10px; }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); border-top-color: var(--accent); animation: spin 700ms linear infinite; }

  /* ---------- LOGIN ---------- */
  #login-screen{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--bg); z-index:9999; }
  .login-box{ display:flex; flex-direction:column; gap:12px; width:280px; padding:28px; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.12); }
  .login-title{ font-family:'Raleway', sans-serif; font-weight:800; font-size:15px; letter-spacing:0.03em; text-align:center; }
  .login-sub{ font-size:12.5px; color:var(--ink-dim); text-align:center; margin:-6px 0 4px; }
  .login-input{ width:100%; box-sizing:border-box; }
  .login-btn{ width:100%; }
  .login-error{ font-size:12px; color:#c0392b; min-height:14px; text-align:center; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (max-width: 640px){
    .topbar{ padding:12px; gap:10px; }

    table.proj-table td{ padding:13px 10px; }
    .view-toggle-mini button{ padding:9px 14px; font-size:12.5px; }
    /* 16px prevents iOS Safari from auto-zooming the page on focus */
    .field input, .field select, .field textarea{ font-size:16px; padding:12px 13px; }
    .field-hint{ font-size:12.5px; }
    .modal-close{ padding:9px 13px; font-size:24px; }
    .btn-remove-piece{ width:40px; height:40px; }

  }
</style>

<body>

<div id="login-screen">
  <form id="login-form" class="login-box">
    <div class="login-title">ATELIER MOLDOVEANU</div>
    <div class="login-sub">Introdu parola echipei pentru a continua</div>

    <button type="submit" class="btn btn-primary login-btn">Intră</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<div id="loading" style="display:none;"><div class="spinner"></div> Se încarcă panoul de producție…</div>

<div class="app" id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">ATELIER MOLDOVEANU <span>—</span> ORGANIZARE</div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="hala" class="active">Hartă atelier</button>
      <button data-tab="gantt">Gantt</button>
      <button data-tab="comenzi">Comenzi</button>

      <button class="btn btn-ghost btn-icon" id="btn-redo" title="Refă (Ctrl+Shift+Z)" disabled>↷</button>
      <button class="btn btn-ghost btn-icon" id="btn-feedback" title="Lasă un feedback">💬</button>
      <button class="btn btn-ghost btn-icon" id="btn-reset" title="Resetează tot panoul">⟲</button>
